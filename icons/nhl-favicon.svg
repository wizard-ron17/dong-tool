<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <!-- Favicon cut: no knurl, heavier ring. The app mark's dot texture dissolves
       into flat white below ~48px, which reads as a blob rather than a puck. -->
  <g transform="rotate(-6 250 250)">
    <path d="M38 208 V300 A212 120 0 0 0 462 300 V208 Z" fill="#ffffff"/>
    <path d="M38 208 V300 A212 120 0 0 0 462 300 V208" fill="none" stroke="#72d907" stroke-width="44" stroke-linejoin="round"/>
    <ellipse cx="250" cy="208" rx="212" ry="120" fill="#ffffff" stroke="#72d907" stroke-width="44"/>
  </g>
</svg>
