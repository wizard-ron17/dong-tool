<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found · Ron's Tools</title>
<meta name="robots" content="noindex">
<script>window.RT_PAGE = '404';</script>
<script defer src="/analytics.js"></script>
<link rel="icon" type="image/svg+xml" href="/icons/logo.svg?v=2">
<link rel="icon" type="image/x-icon" href="/icons/favicon.ico?v=2">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2">
<script>
  // Netlify serves this page for any path that matches no file and no app.
  // The MLB app used to live at the root (/picks, /due/results…), so old
  // bookmarks land here: forward those to /mlb before showing a 404.
  (function () {
    var MLB = ['picks','due','pairs','stats','recap','schedule','matchups','prospects','daylate','returning','birthdays','milestones','steals','pitchtypes','pitchervuln','pitcherks','pitcherwalks'];
    var seg = location.pathname.split('/').filter(Boolean)[0];
    if (seg && MLB.indexOf(seg) !== -1) location.replace('/mlb' + location.pathname + location.search + location.hash);
  })();
</script>
<style>
  :root { --bg:#05080f; --card:#0e1524; --card2:#131c30; --border:#233149; --text:#e8edf5; --muted:#8a94a6; --green:#33d07c; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background:
      radial-gradient(1200px 600px at 50% -10%, rgba(51,208,124,0.10), transparent 60%),
      var(--bg);
    color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center; text-align: center;
    padding: 2rem 1.2rem; min-height: 100dvh; }
  .wrap { width: 100%; max-width: 520px; }
  .code { font-weight: 800; font-size: clamp(4rem, 18vw, 6.5rem); line-height: 1; letter-spacing: -0.03em; color: var(--green); }
  h1 { font-weight: 800; font-size: clamp(1.4rem, 5vw, 1.9rem); margin-top: 0.6rem; }
  p { color: var(--muted); font-size: 0.98rem; margin-top: 0.6rem; line-height: 1.45; }
  .links { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; margin-top: 1.8rem; }
  a.tile { display: block; background: linear-gradient(180deg, var(--card2), var(--card)); border: 1px solid var(--border);
    border-radius: 14px; padding: 0.95rem; color: var(--text); text-decoration: none; font-weight: 800; font-size: 1.02rem;
    transition: border-color 0.15s, transform 0.15s; }
  a.tile:hover { border-color: var(--green); transform: translateY(-2px); }
  a.tile span { display: block; font-size: 1.7rem; margin-bottom: 0.3rem; }
  a.home { display: inline-block; margin-top: 1.3rem; color: var(--green); font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>That link doesn't go anywhere. It may be mistyped, or the page moved.</p>
    <div class="links">
      <a class="tile" href="/nfl/"><span>🏈</span>Tud Tool</a>
      <a class="tile" href="/mlb/"><span>⚾</span>Dong Tool</a>
    </div>
    <a class="home" href="/">All sports →</a>
  </div>
</body>
</html>
