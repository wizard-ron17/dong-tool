<style>
  :root {
    --bg:       #05070e;
    --surface0: #0a1120;
    --surface1: #0e1728;
    --surface2: #152339;
    --border:   #1c2c44;
    --border2:  #27395a;
    --text:     #eaf2fc;
    --muted:    #adbfd6;
    --dim:      #94a9c2;
    --accent:   #33d07c;
    --green:    #4cd46a;
    --gold:     #f2c94c;
    --silver:   #9db8cd;
    /* Semantic ramp — always: green = good, amber = ok, red = bad.
       Use these for any value where higher OR lower can be "better"; the
       class (great/good/avg/below/bad) carries the meaning, not the number. */
    --good:     #33d07c;
    --good-2:   #79d861;
    --ok:       #f2c94c;
    --warn:     #ff9a4d;
    --bad:      #ef4d64;
    --text-strong: #ffffff;  /* brightest text (headings) — flips dark in light mode */
    --glow: rgba(51,208,124,0.07);
    --font-d: 'Chakra Petch', sans-serif;
    --font-m: 'JetBrains Mono', monospace;
    --font-b: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  }
  :root[data-theme="light"] {
    --bg:       #eef1f6;
    --surface0: #ffffff;
    --surface1: #f6f8fb;
    --surface2: #e9eef4;
    --border:   #dde3ec;
    --border2:  #c5d0de;
    --text:     #141d29;
    --muted:    #4a5a6e;
    --dim:      #5d6e83;
    --accent:   #10a758;
    --green:    #17a34a;
    --gold:     #b07d0a;
    --silver:   #5f7183;
    --good:     #10a758;
    --good-2:   #4f9e18;
    --ok:       #b07d0a;
    --warn:     #d9741a;
    --bad:      #d61f3c;
    --text-strong: #0e1621;
    --glow: rgba(16,167,88,0.06);
  }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-b); font-size: 14px; font-weight: 600; -webkit-font-smoothing: antialiased; min-height: 100vh; padding: clamp(0.75rem, 3vw, 2rem); }
  body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(115% 70% at 50% -12%, var(--glow), transparent 58%); pointer-events: none; z-index: 0; }
  .wrap { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; }
  .topbar { display: flex; align-items: center; gap: 1.1rem; margin-bottom: 1.2rem; padding-bottom: 0.7rem; border-bottom: 1px solid var(--border); }
  .tb-brand { display: flex; align-items: center; gap: 0.4rem; flex-shrink: 0; }
  .tb-right { display: flex; align-items: center; gap: 0.5rem; margin-left: auto; }
  .site-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.5rem 1rem;
               margin: 2.2rem 0 0; padding: 0.9rem 0 0.4rem; border-top: 1px solid var(--border); font-size: 0.75rem; color: var(--muted); }
  .social-links { display: inline-flex; align-items: center; gap: 0.55rem; margin-left: 0.5rem; vertical-align: middle; }
  .social-links a { color: var(--muted); display: inline-flex; transition: color 0.15s; }
  .social-links a:hover { color: var(--accent); }
  .social-links svg { width: 15px; height: 15px; display: block; }
  .foot-data { font-size: 0.7rem; letter-spacing: 0.18em; text-transform: uppercase; display: flex; align-items: center; gap: 0.5rem; }
  header { margin-bottom: 1rem; }
  .eyebrow { font-size: 0.692rem; letter-spacing: 0.4em; color: var(--muted); margin-bottom: 0.4rem; text-transform: uppercase; display: flex; align-items: center; gap: 0.5rem; white-space: nowrap; }
  h1 { font-family: var(--font-d); font-size: clamp(1.15rem, 1.9vw, 1.5rem); font-weight: 700; line-height: 1; color: var(--text-strong); margin: 0; display: flex; align-items: center; gap: 0.5rem; white-space: nowrap; }
  h1 em { color: var(--accent); font-style: normal; }
  .status-badge { font-size: 0.673rem; font-weight: 700; letter-spacing: 0.08em; text-transform: none; padding: 0.12rem 0.5rem; border-radius: 10px; border: 1px solid var(--border2); color: var(--muted); background: var(--surface2); flex-shrink: 0; }
  .status-badge.fetching { color: var(--gold); border-color: #5a5000; background: #1e1a00; }
  .status-badge.ready    { color: var(--green); border-color: #1a6020; background: #0a2a10; }
  .status-badge.error    { color: #f05050; border-color: #5a1010; background: #2a0a0a; }
  .nav-shell { position: relative; z-index: 210; }
  nav { position: relative; z-index: 2; display: flex; gap: 0.2rem; }
  .nav-btn { position: relative; display: flex; align-items: center; justify-content: center; gap: 0.35rem; background: transparent; border: none; border-radius: 8px; color: var(--muted); font-family: var(--font-d); font-size: 1.02rem; font-weight: 700; letter-spacing: 0.03em; padding: 0.45rem 0.7rem; cursor: pointer; transition: color 0.15s; white-space: nowrap; }
  .nav-btn:hover:not(.active):not(:disabled) { color: var(--text); }
  .nav-btn.active { color: var(--text-strong); }
  .nav-btn.active::after { content: ''; position: absolute; left: 0.7rem; right: 0.7rem; bottom: -0.1rem; height: 2px; border-radius: 2px; background: var(--accent); }
  .nav-btn:disabled { opacity: 0.32; cursor: not-allowed; }
  .nav-btn svg { display: none; width: 20px; height: 20px; }
  @media (max-width: 980px) {
    .topbar { flex-wrap: wrap; gap: 0.45rem 0.6rem; padding-bottom: 0.5rem; margin-bottom: 0.9rem; }
    h1 { font-size: clamp(1.05rem, 4.4vw, 1.35rem); }
  }
  @media (max-width: 600px) {
    .topbar { flex-wrap: nowrap; gap: 0.4rem; }
    .tb-brand { gap: 0.25rem; min-width: 0; }
    h1 { font-size: 1.02rem; }
    .theme-toggle { width: 30px; height: 30px; }
    .topbar { border-bottom: none; padding-bottom: 0; }
    :root { --nav-side: 0.75rem; --nav-bottom: calc(0.55rem + env(safe-area-inset-bottom)); --nav-h: 3.61rem; }
    nav { position: fixed; left: var(--nav-side); right: var(--nav-side); bottom: var(--nav-bottom); z-index: 230; margin: 0; border: 1px solid var(--border2); border-radius: 24px; background: rgba(10,17,32,0.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); padding: 0.3rem 0.4rem 0.35rem; gap: 0; box-shadow: 0 8px 30px rgba(0,0,0,0.5); }
    .nav-btn { flex: 1 1 0; min-width: 0; flex-direction: column; gap: 0.18rem; font-size: 0.692rem; font-weight: 700; letter-spacing: 0.02em; padding: 0.42rem 0.1rem 0.3rem; border-radius: 10px; }
    .nav-btn svg { display: block; }
    .nav-btn.active { color: var(--accent); background: transparent; box-shadow: none; }
    body { padding-bottom: calc(5rem + env(safe-area-inset-bottom)); }
  }
  .sub-tabs { display: flex; gap: 0.3rem; margin-bottom: 1rem; background: var(--surface0); padding: 0.25rem; border-radius: 8px; border: 1px solid var(--border); }
  .sub-btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 0.3rem; background: transparent; border: none; color: var(--muted); font-family: var(--font-d); font-size: 1rem; font-weight: 700; letter-spacing: 0.06em; padding: 0.4rem; border-radius: 5px; cursor: pointer; transition: background 0.15s, color 0.15s; }
  .sub-btn.active { background: var(--accent); color: #fff; }
  .sub-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .u-tabs { background: transparent; border: none; border-bottom: 1px solid var(--border); border-radius: 0; padding: 0; gap: 1.5rem; justify-content: flex-start; margin-bottom: 1rem; }
  .u-tabs .sub-btn { flex: 0 0 auto; background: transparent; border-radius: 0; padding: 0.5rem 0.15rem 0.55rem; color: var(--muted); position: relative; }
  .u-tabs .sub-btn:hover:not(.active):not(:disabled) { color: var(--text); background: transparent; }
  .u-tabs .sub-btn.active { background: transparent; color: var(--text-strong); }
  .u-tabs .sub-btn.active::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2.5px; background: var(--accent); border-radius: 2px 2px 0 0; }
  .result-meta { font-size: 0.692rem; color: var(--dim); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 0.8rem; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none} }
  .empty { text-align: center; padding: 3rem 1rem; color: var(--dim); font-size: 0.82rem; border: 1px dashed var(--border); border-radius: 8px; }
  @keyframes spin { to{transform:rotate(360deg)} }
  .pairs-filter-row { display: flex; align-items: center; gap: 0.4rem; margin-bottom: 0.7rem; flex-wrap: wrap; }
  .due-filter-label { font-size: 0.692rem; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
  .due-filter-chip { background: var(--surface1); border: 1px solid var(--border2); color: var(--dim); font-family: var(--font-b); font-size: 0.704rem; font-weight: 700; padding: 0.18rem 0.55rem; border-radius: 20px; cursor: pointer; transition: background 0.15s, color 0.15s, border-color 0.15s; }
  .due-filter-chip:hover { color: var(--text); }
  .due-filter-chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .due-filter-chip.disabled { opacity: 0.3; cursor: not-allowed; }
  .hm-tile.good  b { color: var(--good-2); }
  .hm-tile.bad   b { color: var(--bad); }
  .hm-cols { display: flex; gap: 0.6rem; align-items: flex-start; }
  .hm-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 0.6rem; }
  @media (max-width: 640px) {
    .hm-cols { flex-direction: column; align-items: stretch; }
  }
  @media (max-width: 600px) {
    #home-content .hm-card { padding: 0.75rem 0.7rem; }
  }
  .hm-card { min-width: 0; background: var(--surface0); border: 1px solid var(--border); border-radius: 10px; padding: 0.75rem 0.85rem; cursor: pointer; transition: border-color 0.15s, background 0.15s; animation: fadeIn 0.15s ease; }
  .hm-card:hover { border-color: var(--accent); background: var(--surface1); }
  .hm-head { display: flex; justify-content: space-between; align-items: baseline; gap: 0.5rem; margin-bottom: 0.55rem; }
  .hm-title { font-family: var(--font-d); font-weight: 700; font-size: 0.98rem; color: var(--text-strong); letter-spacing: 0.02em; }
  .hm-link { font-size: 0.692rem; color: var(--accent); font-weight: 700; white-space: nowrap; }
  .hm-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.4rem; margin-bottom: 0.55rem; }
  .hm-tile { background: var(--surface1); border: 1px solid var(--border); border-radius: 7px; text-align: center; padding: 0.5rem 0.2rem 0.42rem; }
  .hm-tile b { font-family: var(--font-d); font-size: 2.05rem; font-weight: 600; color: var(--text-strong); display: block; line-height: 1.0; letter-spacing: 0; }
  .hm-tile span { font-size: 0.717rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; font-weight: 600; }
  .hm-chips { display: flex; flex-wrap: wrap; gap: 0.25rem; }
  .hm-chip { font-size: 0.692rem; font-weight: 600; color: var(--accent);
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
    border-radius: 4px; padding: 0.08rem 0.34rem; }
  .hm-sub { display: flex; align-items: baseline; justify-content: space-between; gap: 0.5rem;
    margin: 0.55rem 0 0.12rem; cursor: pointer; }
  .hm-sub:hover .hm-link { text-decoration: underline; }
  .hm-glogo { width: 18px; height: 18px; object-fit: contain; flex-shrink: 0; }
  .hm-cols > .hm-col > .hm-card { animation: none; }
  @media (max-width: 720px) {
    .hm-cols { flex-direction: column; }
  }
  .hm-row { display: flex; align-items: center; gap: 0.55rem; padding: 0.42rem 0; border-bottom: 1px solid var(--border); font-size: 0.82rem; min-width: 0; }
  .hm-row:last-of-type { border-bottom: none; }
  .hm-photo { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; background: var(--surface2); flex-shrink: 0; }
  .hm-name { font-family: var(--font-d); font-weight: 700; font-size: 1.04rem; letter-spacing: 0.005em; line-height: 1.25; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
  .hm-name:has(.hm-subtle) { display: flex; flex-direction: column; white-space: normal; }
  .hm-name.hm-matchup, .hm-name.hm-matchup:has(.hm-at) { display: block; white-space: nowrap; flex: 0 1 auto; }
  .hm-at { color: var(--dim); font-weight: 600; margin: 0 0.15rem; }
  .hm-subtle { font-size: 0.779rem; color: var(--muted); font-weight: 500; letter-spacing: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hm-score { margin-left: auto; font-family: var(--font-d); font-weight: 600; font-size: 1.24rem; line-height: 1.05; flex-shrink: 0; letter-spacing: 0; }
  .hm-score.hot, .hm-score.great { color: var(--accent); }
  .hm-score.warm, .hm-score.good { color: var(--gold); }
  .hm-score.mild, .hm-score.ok   { color: var(--warn); }
  .theme-toggle { flex-shrink: 0; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border-radius: 9px; border: 1px solid var(--border2); background: var(--surface1); color: var(--muted); cursor: pointer; transition: color 0.15s, background 0.15s, border-color 0.15s; }
  .theme-toggle:hover { color: var(--accent); border-color: var(--accent); background: var(--surface2); }
  .theme-toggle svg { width: 18px; height: 18px; display: block; }
  .panel { display: none; }
  .panel.visible { display: block; }
  :root[data-theme="light"] .status-badge.fetching { background: rgba(176,125,10,0.14); border-color: rgba(176,125,10,0.4); }
  :root[data-theme="light"] .status-badge.ready    { background: rgba(16,167,88,0.12);  border-color: rgba(16,167,88,0.4); }
  :root[data-theme="light"] .status-badge.error    { background: rgba(214,31,60,0.12);  border-color: rgba(214,31,60,0.4); }
  .rc-wknav { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; margin: 0.2rem 0 0.7rem; }
  .rc-wknav-center { display: flex; align-items: center; gap: 0.5rem; }
  .rc-arrow { background: var(--surface1); border: 1px solid var(--border2); color: var(--text); font-size: 1.25rem; font-weight: 700; width: 2.1rem; height: 2.1rem; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; line-height: 1; transition: background 0.15s; }
  .rc-arrow:hover:not(:disabled) { background: var(--surface2); }
  .rc-arrow:disabled { opacity: 0.3; cursor: not-allowed; }
  .rc-wklabel { font-family: var(--font-d); font-weight: 700; font-size: 0.98rem; color: var(--text); min-width: 6.8rem; text-align: center; }
  .rc-jump { border: 1px solid transparent; background: var(--accent); color: #06210f; font-family: var(--font-d); font-size: 0.704rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; padding: 0.5rem 0.7rem; border-radius: 8px; cursor: pointer; white-space: nowrap; transition: filter 0.15s, background 0.15s; }
  .rc-jump:hover:not(:disabled) { filter: brightness(1.08); }
  .rc-jump:disabled { background: var(--surface1); border: 1px solid var(--border2); color: var(--muted); cursor: default; }
  @media (max-width: 460px) {
    .rc-jump { font-size: 0.661rem; padding: 0.5rem 0.5rem; letter-spacing: 0.02em; }
    .rc-wklabel { min-width: 5.2rem; font-size: 0.88rem; }

  }
  .rc-list { display: flex; flex-direction: column; gap: 0.4rem; }
  .rc-wknav:has(.rc-latest), .rc-wknav { justify-content: center; position: relative; }
  .rc-latest { position: absolute; right: 0; background: none; border: none; color: var(--accent); font-family: var(--font-d); font-weight: 700; font-size: 0.9rem; cursor: pointer; }
  :root {
    --pos-qb: #22d3ee; --pos-rb: #f472b6; --pos-wr: #58a6ff;
    --pos-te: #c084fc; --pos-fb: #9db8cd;

    --pos-qb: #0e7490; --pos-rb: #be185d; --pos-wr: #1663c7;
    --pos-te: #7e22ce; --pos-fb: #5f7183;
  }

  .sc-game:hover { border-color: var(--border2); }
  .sc-chev { flex-shrink: 0; color: var(--dim); font-size: 0.754rem; transition: transform 0.18s; display: inline-block; }
  .sc-top { display: grid; grid-template-columns: 1fr auto 1fr auto; align-items: center; gap: 0.5rem; }
  .sc-side { display: flex; align-items: center; gap: 0.5rem; min-width: 0; }
  .sc-side.end { justify-content: flex-end; }

<script>
  const APP_BASE = '/nba';

  // ── Theme ──────────────────────────────────────────────────────────────
  const SUN_SVG  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6"/></svg>';
  const MOON_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>';
  function currentTheme() { return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark'; }
  function updateThemeToggleIcon() { const b = document.getElementById('theme-toggle'); if (b) b.innerHTML = currentTheme() === 'light' ? MOON_SVG : SUN_SVG; }
  function toggleTheme() {
    const n = currentTheme() === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', n);
    try { localStorage.setItem('theme', n); } catch (e) {}
    updateThemeToggleIcon();
    // ESPN ships a dark-background cut of every mark; repaint on the flip.
    document.querySelectorAll('img[data-team]').forEach(img => { img.src = teamLogo(img.dataset.team); });
  }

  // ── Sport switcher ─────────────────────────────────────────────────────
  function sportBackdrop(on) {
    let el = document.getElementById('sport-backdrop');
    if (!el) {
      el = document.createElement('div');
      el.id = 'sport-backdrop';
      el.className = 'sport-backdrop';
      el.addEventListener('click', closeSportMenu);
      document.body.appendChild(el);
    }
    el.classList.toggle('open', on);
    document.body.classList.toggle('sport-open', on);
  }
  /** Hang the menu under the arrow, right-aligned to it, clamped to the screen. */
  function placeSportMenu(menu, btn) {
    const r = btn.getBoundingClientRect(), w = menu.offsetWidth, pad = 12;
    menu.style.top = Math.round(r.bottom + 8) + 'px';
    menu.style.left = Math.round(Math.max(pad, Math.min(r.right - w, window.innerWidth - w - pad))) + 'px';
  }
  function toggleSportMenu(e) {
    e.stopPropagation();
    const menu = document.getElementById('sport-menu'), btn = document.getElementById('sport-switch-btn');
    const open = menu.classList.toggle('open');
    btn.classList.toggle('open', open);
    sportBackdrop(open);
    if (open) placeSportMenu(menu, btn);
  }
  function closeSportMenu() {
    document.getElementById('sport-menu')?.classList.remove('open');
    document.getElementById('sport-switch-btn')?.classList.remove('open');
    sportBackdrop(false);
  }
  document.addEventListener('click', (e) => { if (!e.target.closest('.sport-switch, .sport-menu')) closeSportMenu(); });

  // ── Tools menu ─────────────────────────────────────────────────────────
  const TOOL_NAVS = ['threes', 'first', 'points', 'stocks', 'doubles', 'due', 'milestones', 'birthdays'];                            // live tools; the menu's dimmed items ship into here
  let navToolsOpen = false;
  function openNavTools()  { navToolsOpen = true;  document.getElementById('nav-tools-menu').classList.add('open');    document.getElementById('nav-tools-backdrop').classList.add('open');    document.getElementById('main-nav').classList.add('tools-open'); }
  function closeNavTools() { navToolsOpen = false; document.getElementById('nav-tools-menu').classList.remove('open'); document.getElementById('nav-tools-backdrop').classList.remove('open'); document.getElementById('main-nav').classList.remove('tools-open'); }
  function toggleNavTools(e) { e.stopPropagation(); navToolsOpen ? closeNavTools() : openNavTools(); }
  document.addEventListener('click', (e) => { if (navToolsOpen && !e.target.closest('#nav-tools-menu') && !e.target.closest('#nav-tools-btn')) closeNavTools(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && navToolsOpen) closeNavTools(); });

  // ── Nav + routing ──────────────────────────────────────────────────────
  const NBA_NAVS = ['home', 'stats', 'recap', 'threes', 'first', 'points', 'stocks', 'doubles', 'due', 'milestones', 'birthdays', 'schedule'];   // tools added here as they ship
  const PAGE_TITLES = { home: "Ron's Hoop Tool", stats: "Stats · Ron's Hoop Tool", recap: "Recap · Ron's Hoop Tool", threes: "Threes · Ron's Hoop Tool", first: "First Basket · Ron's Hoop Tool", points: "Points · Ron's Hoop Tool", stocks: "Steals & Blocks · Ron's Hoop Tool", doubles: "Double & Triple-Doubles · Ron's Hoop Tool", due: "Due · Ron's Hoop Tool", milestones: "Milestones · Ron's Hoop Tool", birthdays: "Birthdays · Ron's Hoop Tool", schedule: "Schedule · Ron's Hoop Tool" };
  let activeNav = 'home', applyingRoute = false;
  function switchNav(nav) {
    activeNav = nav;
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('visible'));
    document.getElementById('panel-' + nav)?.classList.add('visible');
    document.querySelectorAll('.nav-btn[data-nav]').forEach(b => b.classList.toggle('active', b.dataset.nav === nav));
    // on a tool page the Tools button is the lit one, and the menu marks which tool
    document.getElementById('nav-tools-btn')?.classList.toggle('active', TOOL_NAVS.includes(nav));
    document.querySelectorAll('.nav-menu-item[data-nav]').forEach(b => b.classList.toggle('active', b.dataset.nav === nav));
    document.title = PAGE_TITLES[nav] || "Ron's Hoop Tool";
    renderPanel(nav);
    closeNavTools();
    if (!applyingRoute) commitRoute();
  }
  function currentPath() { return activeNav === 'home' ? APP_BASE + '/' : APP_BASE + '/' + activeNav; }
  function commitRoute() { const p = currentPath(); if (location.pathname !== p) history.pushState(null, '', p); }
  function parsePath() { const rel = location.pathname.startsWith(APP_BASE) ? location.pathname.slice(APP_BASE.length) : location.pathname; return rel.replace(/^\/+|\/+$/g, '').split('/')[0] || 'home'; }
  function applyRouteState() {
    applyingRoute = true;
    let nav = parsePath();
    if (nav === 'pra') { bdState('points').tab = 'pra'; nav = 'points'; }   // PRA moved into Points; old links still land
    switchNav(NBA_NAVS.includes(nav) ? nav : 'home');
    history.replaceState(history.state, '', currentPath());
    applyingRoute = false;
  }
  window.addEventListener('popstate', applyRouteState);

  function renderPanel(nav) {
    if (nav === 'home') renderHome();
    else if (nav === 'stats') renderStats();
    else if (nav === 'recap') renderRecap();
    else if (nav === 'schedule') renderSchedule();
    else if (nav === 'threes') renderThrees();
    else if (nav === 'first') renderFirst();
    else if (BD[nav]) renderBoard(nav);
    else if (nav === 'doubles') renderDoubles();
    else if (nav === 'due') renderDue();
    else if (nav === 'milestones') renderMilestones();
    else if (nav === 'birthdays') renderBirthdays();
  }

  // ── Data ───────────────────────────────────────────────────────────────
  let D = null, recapDate = null, scheduleDate = null;
  function timeAgo(iso) {
    const mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
    if (mins < 1)  return 'just now';
    if (mins < 60) return `${mins}m ago`;
    const hrs = Math.round(mins / 60);
    if (hrs < 24) return `${hrs}h ago`;
    return `${Math.round(hrs / 24)}d ago`;
  }
  function setStatus(type, text) {
    const labels = { fetching: 'Loading', error: 'Error' };
    const badge = document.getElementById('status-badge');
    badge.className = 'status-badge ' + type;
    badge.textContent = text ?? labels[type] ?? type;
  }
  // Coverage · volume · freshness, the same shape as the other sports' badges.
  function statusSummary(d) {
    const nights = new Set((d.recap || []).map(g => g.date)).size;
    return `${nights}n · ${(d.recap || []).length} gm · upd ${timeAgo(d.generated)}`;
  }
  // Data files come straight from the repo (raw.githubusercontent.com: CORS-open,
  // and a data-only commit doesn't redeploy the site — see netlify.toml). On
  // localhost the local file wins, so a local build can be looked at.
  const DATA_RAW = 'https://raw.githubusercontent.com/wizard-ron17/dong-tool/main';
  // Local first on localhost, but a missing local file falls back to the repo's rather than erroring.
  const dataFetch = (f, opts) => /^(localhost|127\.0\.0\.1)$/.test(location.hostname)
    ? fetch(`${APP_BASE}/${f}`, opts).then(r => r.ok ? r : Promise.reject(r)).catch(() => fetch(`${DATA_RAW}${APP_BASE}/${f}`, opts))
    : fetch(`${DATA_RAW}${APP_BASE}/${f}`, opts).then(r => r.ok ? r : Promise.reject(r)).catch(() => fetch(`${APP_BASE}/${f}`, opts));
  async function loadNba() {
    setStatus('fetching');
    try {
      const r = await dataFetch('data.json', { cache: 'no-store' });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      D = await r.json();
      D.dates = [...new Set(D.schedule.map(g => g.date))].sort();
      const el = document.getElementById('eyebrow-season');
      if (el && D.season) el.textContent = D.season;
      setStatus('ready', statusSummary(D));
    } catch (e) { D = 'error'; setStatus('error'); }
    renderPanel(activeNav);
  }
  function dataGate(id) {
    const el = document.getElementById(id); if (!el) return null;
    if (!D) { el.innerHTML = '<div class="empty">Loading…</div>'; return null; }
    if (D === 'error') { el.innerHTML = '<div class="empty">Couldn\'t load NBA data. <a href="javascript:void(0)" onclick="loadNba()">Retry</a></div>'; return null; }
    return el;
  }

  // ── Helpers ────────────────────────────────────────────────────────────
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  // ESPN labels each club's marks; the dark cut is the one for dark backgrounds.
  const teamLogo = (ab) => { const t = D?.teams?.[ab]; return (currentTheme() === 'dark' ? t?.logoDark : null) || t?.logo || ''; };
  const logoImg = (ab, cls) => `<img class="${cls}" data-team="${ab}" src="${teamLogo(ab)}" alt="${ab}" loading="lazy">`;
  const teamName = (ab) => D.teams?.[ab]?.name || ab;
  const record = (ab) => { const t = D.teams?.[ab]; return t && (t.w || t.l) ? `${t.w}-${t.l}` : ''; };
  // Positions are categories, not ratings: their own hues, none from the good/bad ramp.
  const POS_FAM = { PG: 'G', SG: 'G', G: 'G', SF: 'F', PF: 'F', F: 'F', C: 'C', GF: 'F', FC: 'C' };
  const posBadge = (p) => { const f = POS_FAM[p] || 'F'; return `<span class="posb p-${f}">${esc(p || f)}</span>`; };
  const pct = (v, d = 1) => v == null ? '—' : (v * 100).toFixed(d) + '%';
  const odds = (v) => v == null ? '' : (v > 0 ? '+' : '') + v;
  const sgn = (v) => v == null ? '' : v > 0 ? '+' + v : v === 0 ? 'PK' : String(v);

  /** A date string the feed keys on (yyyy-mm-dd) as a label in the reader's words. */
  function dayLabel(ymd, long) {
    const d = new Date(ymd + 'T12:00:00Z');
    const opt = long ? { weekday: 'long', month: 'short', day: 'numeric' } : { weekday: 'short', month: 'short', day: 'numeric' };
    return new Intl.DateTimeFormat('en-US', { ...opt, timeZone: 'UTC' }).format(d);
  }
  /** Tip-off in the reader's own timezone — the feed publishes UTC. */
  const gameTime = (iso) => iso ? new Intl.DateTimeFormat('en-US', { hour: 'numeric', minute: '2-digit' }).format(new Date(iso)) : '';
  /** Today, on the NBA's clock: its day boundary is US Eastern, and so are its date keys. */
  const todayET = () => new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());

  /** Headshots 404 for anyone without one; fall back to initials. */
  function faceHtml(pid, name, cls) {
    const ini = (name || '').split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
    if (!pid) return `<div class="rc-photo rc-noface ${cls || ''}">${esc(ini)}</div>`;
    return `<img class="rc-photo ${cls || ''}" src="https://a.espncdn.com/i/headshots/nba/players/full/${esc(pid)}.png" alt="" loading="lazy"
      onerror="this.outerHTML='&lt;div class=\\'rc-photo rc-noface ${cls || ''}\\'&gt;${esc(ini)}&lt;/div&gt;'">`;
  }
  const typeTag = (t) => t === 1 ? '<span class="sc-pre">PRE</span>' : t === 5 ? '<span class="sc-pre">PLAY-IN</span>' : t === 3 ? '<span class="sc-pre">PLAYOFFS</span>' : '';

  // ── Recap ──────────────────────────────────────────────────────────────
  // One night at a time: every final, each side's points, rebounds and assists
  // leaders. The unit is the game, as on the NHL recap — a night has one date.
  const recapDates = () => [...new Set((D.recap || []).map(g => g.date))].sort();
  function setRecapDate(d) { recapDate = d; renderRecap(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  function shiftRecapDate(n) {
    const ds = recapDates(), i = ds.indexOf(recapDate) + n;
    if (i >= 0 && i < ds.length) setRecapDate(ds[i]);
  }
  function recapToLatest() { const ds = recapDates(); setRecapDate(ds[ds.length - 1]); }
  const LEAD_KEYS = [['points', 'PTS'], ['rebounds', 'REB'], ['assists', 'AST']];
  function renderRecap() {
    const el = dataGate('recap-content'); if (!el) return;
    const ds = recapDates();
    if (!ds.length) { el.innerHTML = `<div class="empty">No games have been played yet this season${D.phase === 'pre' || D.phase === 'off' ? ' — opening night is ' + dayLabel(regStart(), true) : ''}.</div>`; return; }
    if (recapDate == null || !ds.includes(recapDate)) recapDate = ds[ds.length - 1];
    const i = ds.indexOf(recapDate), atFirst = i <= 0, atLast = i >= ds.length - 1;
    const games = D.recap.filter(g => g.date === recapDate);
    const side = (x) => `<div class="rc-list">${LEAD_KEYS.map(([k, lab]) => {
      const L = x.leaders?.[k]; if (!L) return '';
      return `<div class="rc-card">${faceHtml(L.pid, L.name)}
        <div class="rc-info"><div class="rc-name">${esc(L.name)}</div><div class="rc-sub">${esc(x.ab)} · led in ${lab.toLowerCase()}</div></div>

    }).join('')}</div>`;
    const body = games.map(G => {
      const aWin = G.away.score > G.home.score;
      return `<div class="rg">
        <div class="rg-head">
          <span class="rg-score">
            ${logoImg(G.away.ab, 'rg-logo')}<span class="${aWin ? 'w' : ''}">${esc(G.away.ab)} ${G.away.score}</span>
            <span style="color:var(--dim)">–</span>

  }

  // ── Schedule ───────────────────────────────────────────────────────────
  // The unit is the date: the arrows step one night. Each side carries its own
  // spread and moneyline (the schedule standard); the total sits in the middle,
  // implied points in the detail. Lines are DraftKings' via ESPN, not ours.
  const regStart = () => (D.phases || []).find(p => p.key === 'reg')?.start || D.today;
  function nextGameDate() {
    const t = todayET();
    return D.dates.find(d => d >= t) || D.dates[D.dates.length - 1];
  }
  function setScheduleDate(d) { scheduleDate = d; scOpen.clear(); renderSchedule(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  function shiftScheduleDate(n) {
    const i = D.dates.indexOf(scheduleDate) + n;
    if (i >= 0 && i < D.dates.length) setScheduleDate(D.dates[i]);
  }
  const scOpen = new Set();
  function toggleGame(id) { scOpen.has(id) ? scOpen.delete(id) : scOpen.add(id); renderSchedule(); }
  function gameRow(g) {
    const open = scOpen.has(g.id);
    const final = g.state === 'post', live = g.state === 'in';
    const aWin = final && g.away.score > g.home.score;
    const L = g.lines;
    const mid = final
      ? `<div class="sc-score">${g.away.score}–${g.home.score}</div><div class="sc-when">${typeTag(g.type)} ${esc(g.detail || 'Final')}</div>`
      : live
        ? `<div class="sc-score" style="color:var(--bad)">${g.away.score ?? 0}–${g.home.score ?? 0}</div><div class="sc-when"><span class="sc-live">LIVE</span> ${esc(g.detail)}</div>`
        : `<div class="sc-score">${gameTime(g.start)}</div><div class="sc-when">${typeTag(g.type)}${L?.total != null ? ` O/U ${L.total}` : ''}</div>`;
    // his side's line: the home spread from the feed, negated for the road team
    const line = (home) => {
      if (!L || final) return '';
      const sp = L.spread == null ? null : (home ? L.spread : -L.spread), ml = home ? L.mlHome : L.mlAway;
      return `<span class="sc-side-rec">${sp != null ? sgn(sp) : ''}${ml != null ? ` · ${odds(ml)}` : ''}</span>`;
    };
    const side = (t, end, won) => `<div class="sc-side${end ? ' end' : ''}">

    const body = !open ? '' : `<div class="sc-body">

          <div class="sc-goal"><b>${esc(L.detail || '')}</b><span>total ${L.total ?? '—'}</span><span style="margin-left:auto">${esc(L.book || '')}</span></div>

    // the game's top threes pick, best at 2+ (the schedule standard: a top pick on every game)
    const tp = (D.threes?.rows || []).filter(r => r.gid === g.id).sort((a, b) => b.p[1] - a.p[1])[0];
    const pick = tp ? `<div class="t3-pick" onclick="event.stopPropagation(); t3Set('game','${g.id}'); switchNav('threes')">
        <span class="t3-pick-lbl">Top threes</span>${logoImg(tp.team, 't3-logo')}<b>${esc(tp.name)}</b>

    return `<div class="sc-game${open ? ' open' : ''}" onclick="toggleGame('${g.id}')" role="button" tabindex="0">
      <div class="sc-top">
        ${side(g.away, false, aWin)}
        <div class="sc-mid">${mid}</div>
        ${side(g.home, true, final && !aWin)}
        <span class="sc-chev">▶</span>
      </div>
      ${pick}
      ${body}
    </div>`;
  }
  function renderSchedule() {
    const el = dataGate('schedule-content'); if (!el) return;

    el.innerHTML = `<div class="rc-wknav">
        <div class="rc-wknav-center">

  // ── Stats ──────────────────────────────────────────────────────────────
  // Per-game averages. Before opening night the board is last season's, and

  const stF = { pos: 'all', team: 'all', sort: 'pts' };

    const posChip = (v, lbl) => `<button class="due-filter-chip${stF.pos === v ? ' active' : ''}" onclick="setStF('pos','${v}')">${lbl}</button>`;
    const teamOpts = ['all', ...teams].map(t => `<option value="${t}"${stF.team === t ? ' selected' : ''}>${t === 'all' ? 'All teams' : t}</option>`).join('');
    const sortOpts = Object.entries(ST_SORT).map(([k, [lbl]]) => `<option value="${k}"${stF.sort === k ? ' selected' : ''}>${lbl}</option>`).join('');
    const row = (r, i) => {

      return `<div class="rc-card st-card"><span class="st-rank">${i + 1}</span>

    };
    const lastSeason = D.leadersFrom !== D.season;
    el.innerHTML = `<div class="pairs-filter-row">
        <span class="due-filter-label">Pos</span>
        ${posChip('all', 'All')}${posChip('G', 'Guards')}${posChip('F', 'Forwards')}${posChip('C', 'Centers')}
      </div>
      <div class="pairs-filter-row">
        <span class="due-filter-label">Sort</span>
        <select class="fl-sel" onchange="setStF('sort',this.value)">${sortOpts}</select>
        <select class="fl-sel" onchange="setStF('team',this.value)">${teamOpts}</select>
      </div>
      <div class="result-meta">${rows.length} players · <b>${esc(D.leadersFrom)}</b>${lastSeason ? ' (last season, until games are played)' : ''} · per game, sorted by <b>${esc(sortLbl)}</b></div>
      <div class="rc-list">${rows.length ? rows.map(row).join('') : '<div class="empty">No players match these filters.</div>'}</div>`;
  }

  // ── Threes: the NBA's dong ─────────────────────────────────────────────
  // Every rotation player on the next slate, priced at every line from 0.5 to
  // 7.5 made threes: research/nba_threes.py — it beat Kalshi's pre-game mid on
  // 6,666 markets last season. The board is renderBoard('threes') below.
  const T3_TOP = 30;
  // under half a percent is a rounding error, and past 97% no book deals a price (-3233) — the % beside it still says it
  const fairOdds = (p) => !(p >= 0.005 && p <= 0.97) ? '—' : p >= 0.5 ? String(-Math.round(100 * p / (1 - p))) : '+' + Math.round(100 * (1 - p) / p);
  /** From a schedule card: open the threes board on that game. */
  function t3Set(k, v) { if (k === 'game') bdState('threes').game = v; }

  // ── Shared board chrome, the same as /nfl and /nhl's boards ─────────────
  const uiArg = (v) => typeof v === 'number' ? v : `'${v}'`;
  const uiChip = (setFn, k, v, lab, cur, extra = '') =>
    `<button class="pbf-chip${extra ? ' ' + extra : ''}${String(cur) === String(v) ? ' on' : ''}" onclick="${setFn}('${k}',${uiArg(v)})">${lab}</button>`;
  const uiFilters = (setFn, open, rows, changed) => `
    <div class="due-filters-card">
      <button class="due-filters-toggle" onclick="${setFn}('open',${!open})" aria-expanded="${open}">
        <span class="due-explainer-title">Filters${changed ? `<span class="due-filters-badge">${changed}</span>` : ''}</span>
        <span class="due-explainer-chevron${open ? ' open' : ''}">▶</span>
      </button>
      ${open ? `<div class="due-filter-row pbf-body">${rows.map(([l, c]) =>
        `<div class="pbf-row"><span class="pbf-lbl">${l}</span><div class="pbf-chips">${c}</div></div>`).join('')}</div>` : ''}
    </div>`;
  const uiTabs = (setFn, cur, tabs) => `
    <div class="sub-tabs u-tabs">${tabs.map(([v, l]) =>
      `<button class="sub-btn${cur === v ? ' active' : ''}" onclick="${setFn}('tab','${v}')">${l}</button>`).join('')}</div>`;
  const uiView = (setFn, cur) => `
    <div class="lb-toolbar"><div class="view-switch">${[['table', 'Table'], ['cards', 'Cards'], ['compact', 'Compact']].map(([v, l]) =>
      `<button class="view-btn${cur === v ? ' active' : ''}" onclick="${setFn}('view','${v}')">${l}</button>`).join('')}</div></div>`;
  const uiSearch = (id, setFn, q, ph) => `
      <div class="pb-search${q ? ' on' : ''}">
        <svg class="pb-search-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <input type="text" id="${id}" placeholder="${ph}" value="${esc(q)}" oninput="${setFn}('q',this.value,true)" autocomplete="off" spellcheck="false">
        <button class="pb-search-x" onclick="${setFn}('q','')" aria-label="Clear">×</button>
      </div>`;
  const matchQ = (r, q) => { const t = q.trim().toLowerCase(); return !t || r.name.toLowerCase().includes(t) || r.team.toLowerCase() === t || r.opp.toLowerCase() === t || (r.pos || '').toLowerCase() === t; };

  // ── Distributions: the same maths the build prices with ─────────────────
  // NB whose variance is a x lam^p (the stats engine) or with a fixed alpha
  // (threes), mixed over his minutes N(projected, sd) — 9-node Gauss–Hermite.
  const GH_X = [-4.512745863399783, -3.205429002856470, -2.076847978677830, -1.023255663789133, 0, 1.023255663789133, 2.076847978677830, 3.205429002856470, 4.512745863399783];
  const GH_W = [2.234584400774658e-5, 2.789141321231769e-3, 4.991640676521788e-2, 2.440975028949394e-1, 4.063492063492063e-1, 2.440975028949394e-1, 4.991640676521788e-2, 2.789141321231769e-3, 2.234584400774658e-5];
  function nbPmf(mu, alpha, K) {
    const rr = 1 / alpha, pp = rr / (rr + mu), out = [Math.pow(pp, rr)];
    for (let k = 1; k <= K; k++) out.push(out[k - 1] * (rr + k - 1) / k * (1 - pp));
    return out;
  }
  /** P(X = k), k = 0..K, for a board row: spread {alpha} or {a, p}. */
  function mixPmf(mu, mproj, sd, spread, K) {
    const out = new Array(K + 1).fill(0);
    for (let i = 0; i < GH_X.length; i++) {
      const m = Math.min(48, Math.max(1, mproj + sd * GH_X[i])), lam = Math.max(0.02, mu * m / Math.max(mproj, 1));
      const alpha = spread.alpha ?? Math.max((spread.a * Math.pow(lam, spread.p) - lam) / (lam * lam), 1e-4);
      nbPmf(lam, alpha, K).forEach((v, k) => { out[k] += GH_W[i] * v; });
    }
    return out;
  }
  const overAt = (pmf, L) => Math.min(0.995, Math.max(0.005, pmf.reduce((a, v, k) => a + (k > L ? v : 0), 0)));

  // ── The ladder card (/nhl's, which is /nfl's) ───────────────────────────
  const YD_ICON = {
    bars: '<path d="M5 20V11M12 20V5M19 20v-7"/>',
    clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
    target: '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="0.8"/>',
    trend: '<path d="M3.5 16.5l5.5-5.5 4 4 7.5-7.5"/><path d="M15 7.5h5.5V13"/>',
    team: '<circle cx="9" cy="9" r="3"/><circle cx="16.5" cy="10" r="2.4"/><path d="M3.5 19c.6-3 2.8-4.6 5.5-4.6s4.9 1.6 5.5 4.6M14.5 14.8c2.6-.3 4.8 1 5.6 3.7"/>',
    shield: '<path d="M12 3.5l7 2.5v5.5c0 4-3 7.3-7 9-4-1.7-7-5-7-9V6z"/>',
    ball: '<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5v17"/>',
    bulb: '<path d="M9 17.5h6M10 20.5h4M12 3.5a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V17h5v-.6c0-.8.4-1.5 1-2A6 6 0 0 0 12 3.5z"/>',
  };
  const ydIco = (k) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${YD_ICON[k] || ''}</svg>`;
  // One card for every market: each brings its rows, line range and words; the
  // chart, ladder and keyboard are shared.
  const LC = {
    '3pm': { rows: () => D.threes?.rows || [], spread: () => ({ alpha: D.threes?.alpha ?? 0.1 }), range: [0.5, 7.5], unit: 'threes', big: 'Projected made threes', title: 'made threes distribution', blurb: 'His minutes times his make rate, a negative binomial spread over his minutes — the nights he just shoots more carry the tail', nav: 'threes' },
    pts: { st: 'pts', range: [4.5, 45.5], unit: 'points', big: 'Projected points', title: 'points distribution', blurb: 'His minutes times his scoring rate; stars run steadier and bench scorers wilder than one fixed curve says', nav: 'points' },
    reb: { st: 'reb', range: [1.5, 18.5], unit: 'rebounds', big: 'Projected rebounds', title: 'rebounds distribution', blurb: 'His minutes times his rebounding rate, spread over his minutes', nav: 'points' },
    ast: { st: 'ast', range: [0.5, 15.5], unit: 'assists', big: 'Projected assists', title: 'assists distribution', blurb: 'His minutes times his assist rate, spread over his minutes', nav: 'points' },
    pra: { st: 'pra', range: [9.5, 60.5], unit: 'points + rebounds + assists', big: 'Projected PRA', title: 'points + rebounds + assists distribution', blurb: 'The three together, priced as one count off his minutes', nav: 'points' },
    stl: { st: 'stl', range: [0.5, 4.5], unit: 'steals', big: 'Projected steals', title: 'steals distribution', blurb: 'A rare count — mostly the question of zero or one', nav: 'stocks' },
    blk: { st: 'blk', range: [0.5, 5.5], unit: 'blocks', big: 'Projected blocks', title: 'blocks distribution', blurb: 'Rim protectors carry the tail', nav: 'stocks' },
    stk: { st: 'stk', range: [0.5, 7.5], unit: 'steals + blocks', big: 'Projected stocks', title: 'steals + blocks distribution', blurb: 'Steals and blocks together, priced as one count off his minutes', nav: 'stocks' },
  };
  const LC_GROUPS = { pts: [['pts', 'Points'], ['reb', 'Rebounds'], ['ast', 'Assists'], ['pra', 'PRA']], stl: [['stl', 'Steals'], ['blk', 'Blocks'], ['stk', 'Stocks']] };
  ['reb', 'ast', 'pra'].forEach(k => { LC_GROUPS[k] = LC_GROUPS.pts; }); ['blk', 'stk'].forEach(k => { LC_GROUPS[k] = LC_GROUPS.stl; });
  const lc = { kind: 'pts', pid: null, line: null, deck: [] };
  const lcCfg = () => LC[lc.kind];
  const lcRows = (kind = lc.kind) => LC[kind].st ? (D.stats?.boards?.[LC[kind].st]?.rows || []) : LC[kind].rows();
  const lcRow = () => lcRows().find(x => x.pid === lc.pid);
  const lcSpread = (kind = lc.kind) => LC[kind].st ? D.stats.spread[LC[kind].st] : LC[kind].spread();
  function lcPmf(r, kind = lc.kind) {
    const K = Math.ceil(LC[kind].range[1] + 4);
    return mixPmf(r.mu, r.min, r.sd ?? 6, lcSpread(kind), K);
  }
  const lcRange = () => lcCfg().range;
  function lcPick(r, pmf) {
    const [lo, hi] = lcRange(); let best = lo;
    for (let L = lo; L <= hi; L++) if (Math.abs(overAt(pmf, L) - 0.5) < Math.abs(overAt(pmf, best) - 0.5)) best = L;
    return best;
  }
  function lcChart(r, pmf) {
    const W = 560, H = 270, Lm = 46, Rr = 14, T = 40, B = 34;
    let k0 = 0;
    for (let c = 0; k0 < pmf.length - 1 && c + pmf[k0] < 0.002; k0++) c += pmf[k0];
    let kEnd = pmf.length - 1; for (let c = 0; kEnd > k0 && c + pmf[kEnd] < 0.002; kEnd--) c += pmf[kEnd];
    const K = kEnd - k0, pct = pmf.slice(k0, kEnd + 1).map(v => v * 100);
    const ymaxRaw = Math.max(...pct) * 1.15;
    const ystep = ymaxRaw > 40 ? 20 : ymaxRaw > 20 ? 10 : ymaxRaw > 8 ? 5 : 2;
    const ymax = Math.ceil(ymaxRaw / ystep) * ystep;

    const meta = `<div class="result-meta"><b>${dayLabel(D.stats.date, true)}</b> · ${rows.length} of ${R0.length} players · ${td ? 'triple' : 'double'}-double · fair odds, no vig</div>` + uiView('setDblF', dblF.view);
    if (!rows.length) { el.innerHTML = controls + meta + '<div class="empty">Nothing matches that filter.</div>'; return; }
    const open = (r) => `openDoubleCard('${r.pid}')`, started = (r) => new Date(r.start) <= new Date();
    const pk = (r) => r[dblF.sort];
    let body;
    if (dblF.view === 'table') {
      body = `<div class="rc-tablewrap"><table class="rc-table">
        <thead><tr><th></th><th>Player</th><th>Game</th><th class="num">Pts</th><th class="num">Reb</th><th class="num">Ast</th><th class="num">Last ${R0[0].l40 || 40}</th><th class="num">DD</th><th class="num">TD</th></tr></thead>
        <tbody>${rows.map(r => `
          <tr onclick="${open(r)}"${started(r) ? ' class="dim"' : ''}>

    } else {
      body = `<div class="pb-list">${rows.map(r => `
        <div class="pb-card${started(r) ? ' t3-started' : ''}" onclick="${open(r)}">
          <div class="pb-rank">${r.rank}</div>${faceHtml(r.pid, r.name)}
          <div class="pb-info">
            <div class="pb-nm">${esc(r.name)}<span class="pb-flag">${esc(r.pos || '')}</span></div>

          <div class="pb-facts">
            <span class="pb-f" title="Projected points / rebounds / assists"><b>${r.pts} · ${r.reb} · ${r.ast}</b> proj</span>
            <span class="pb-f" title="Double-doubles and triple-doubles in his last ${r.l40} games"><b>${r.dd40} DD · ${r.td40} TD</b> last ${r.l40}</span>
          </div>
          <div class="pb-price">
            <span class="pb-odds${pk(r) < 0.5 ? ' dog' : ''}">${fairOdds(pk(r))}</span>
            <span class="pb-pct">${td ? 'triple' : 'double'}-double · ${(pk(r) * 100).toFixed(pk(r) < 0.1 ? 1 : 0)}%</span>
          </div>
        </div>`).join('')}</div>`;
    }
    el.innerHTML = controls + meta + body + `<div class="t3-note">Points, rebounds and assists each priced at 10 over his minutes — they barely move together once minutes are known — with a shared big-night factor (pace, overtime), then blended with his own last-40 rate. Tap a player for each of the three. Beat each player's own rate walk-forward; on Kalshi last season triple-doubles were overpriced (an 11.4% mid on an 8.2% outcome).</div>`;
  }
  /** A player's card on the three the double-double is built from, stepping the board as shown. */
  function openDoubleCard(pid) { openLc('pts', pid, dblRows(), 9.5); }

  // ── First basket ───────────────────────────────────────────────────────
  // Who scores the game's first made field goal. The tip decides the team (its
  // winner scores first ~64%, before the line), the line adds the better offense,
  // and within a team it's each starter's own first-basket record, shrunk to his
  // position (centres score first most — the opening set, the putback). Starters
  // are projected until lineups post. research/nba_firstbasket2.py: calibrated
  // over 7,200 games walk-forward.
  const fbF = { open: false, game: 'all', q: '', view: 'cards' };
  function setFbF(k, v, typing) {
    fbF[k] = v; renderFirst();
    if (typing) { const i = document.getElementById('first-search'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }
  }
  function renderFirst() {
    const el = dataGate('first-content'); if (!el) return;
    const B = D.first;
    if (!B || !B.games?.length) { el.innerHTML = '<div class="empty">No slate to price yet — first basket fills in once the next games have lines.</div>'; return; }
    const games = [...B.games].sort((a, b) => a.start.localeCompare(b.start));
    const started = (g) => new Date(g.start) <= new Date();
    const pl = (r, rank) => `<div class="fb-pl${r.jumper ? ' fb-jump' : ''}">
        ${rank ? `<span class="st-rank">${rank}</span>` : ''}${faceHtml(r.pid, r.name)}
        <div class="fb-id"><div class="rc-name">${esc(r.name)} ${posBadge(r.pos)}${r.jumper ? ' <span class="fb-tag" title="Projected to take the opening tip">TIP</span>' : ''}</div>
          <div class="rc-sub">${logoImg(r.team, 't3-logo')} ${esc(r.team)} · ${r.fb} first baskets in ${r.starts} starts</div></div>
        <div class="fb-od"><b>${fairOdds(r.p)}</b><span>${(r.p * 100).toFixed(1)}%</span></div>
      </div>`;
    const gameCard = (g) => {
      const hp = g.pHomeFirst, tp = g.tip.pHome;
      return `<div class="fb-game${started(g) ? ' t3-started' : ''}">
        <div class="fb-head">
          <span class="rg-score">${logoImg(g.away, 'rg-logo')}${esc(g.away)} <span style="color:var(--dim)">@</span> ${esc(g.home)}${logoImg(g.home, 'rg-logo')}</span>
          <span class="fb-time">${gameTime(g.start)}${started(g) ? ' · priced before tip' : ''}</span>
        </div>
        <div class="fb-tipline">
          <span>Tip: <b>${esc(g.tip.away)}</b> ${Math.round((1 - tp) * 100)}% · <b>${esc(g.tip.home)}</b> ${Math.round(tp * 100)}%</span>
          <span>Scores first: <b>${esc(g.away)}</b> ${Math.round((1 - hp) * 100)}% · <b>${esc(g.home)}</b> ${Math.round(hp * 100)}%</span>
        </div>
        <div class="fb-bar"><i style="width:${(1 - hp) * 100}%"></i></div>
        <div class="fb-list">${g.players.map(r => pl(r)).join('')}</div>
      </div>`;
    };
    if (fbF.game !== 'all' && !games.some(g => g.gid === fbF.game)) fbF.game = 'all';
    const shown = games.filter(g => fbF.game === 'all' || g.gid === fbF.game);
    const all = shown.flatMap(g => g.players.map(r => ({ ...r, g, opp: r.team === g.home ? g.away : g.home, home: r.team === g.home })))
      .filter(r => matchQ(r, fbF.q)).sort((a, b) => b.p - a.p);
    const controls = uiFilters('setFbF', fbF.open, [
      ['Game', [['all', 'All games'], ...games.map(g => [g.gid, `${g.away} @ ${g.home}`])].map(([v, l]) => uiChip('setFbF', 'game', v, l, fbF.game)).join('')],
    ], fbF.game !== 'all') + uiSearch('first-search', 'setFbF', fbF.q, 'Search a player, team or position…');
    const meta = `<div class="result-meta"><b>${dayLabel(B.date, true)}</b> · ${shown.length} game${shown.length === 1 ? '' : 's'} · first made field goal · fair odds, no vig · updated ${timeAgo(B.generated)}</div>` + uiView('setFbF', fbF.view);
    let body;
    if (fbF.view === 'table') {
      body = `<div class="rc-tablewrap"><table class="rc-table">
        <thead><tr><th></th><th>Player</th><th>Game</th><th class="num">First baskets</th><th class="num">Team first</th><th class="num">Chance</th><th class="num">Price</th></tr></thead>
        <tbody>${all.map((r, i) => `<tr>
          <td class="num dim">${i + 1}</td><td><b>${esc(r.name)}</b> <span class="dim">${esc(r.pos || '')}${r.jumper ? ' · tip' : ''}</span></td>
          <td class="dim">${esc(r.team)} ${r.home ? 'vs' : '@'} ${esc(r.opp)}</td>
          <td class="num dim">${r.fb} in ${r.starts}</td>
          <td class="num dim">${Math.round((r.home ? r.g.pHomeFirst : 1 - r.g.pHomeFirst) * 100)}%</td>
          <td class="num">${(r.p * 100).toFixed(1)}%</td><td class="num"><b>${fairOdds(r.p)}</b></td></tr>`).join('')}</tbody></table></div>`;
    } else if (fbF.view === 'compact') {
      body = `<div class="rc-compact">${all.map((r, i) => `
        <div class="rc-crow"><span class="rc-crank">${i + 1}</span><span class="rc-cnm">${esc(r.name)}</span><span class="rc-cteam">${esc(r.team)}</span>
          <span class="rc-cproj">${(r.p * 100).toFixed(1)}%</span><span class="rc-cod">${fairOdds(r.p)}</span><span class="rc-cline">${r.jumper ? 'tip' : ''}</span></div>`).join('')}</div>`;
    } else {
      const byGame = shown.map(g => ({ ...g, players: g.players.filter(r => matchQ({ ...r, opp: r.team === g.home ? g.away : g.home }, fbF.q)) })).filter(g => g.players.length);
      body = `<div class="fb-games">${byGame.map(gameCard).join('') || '<div class="empty">Nothing matches that filter.</div>'}</div>`;
    }
    el.innerHTML = controls + meta + body + `
      <div class="t3-note"><b>Starters are projected</b> until lineups post (~30 minutes before tip): the five who've started most of his team's last ten. If a projected starter sits, his price doesn't apply. The tip winner's team scores first about 64% of the time; the betting line adds the better offense; within a team it's his own first-basket record, pulled toward his position's. Check whether a book settles on the first <i>basket</i> or the first <i>points</i> — about 8% of games start with a free throw.</div>`;
  }

  // ── Home ───────────────────────────────────────────────────────────────
  // ── Watch lists: Due, Milestones, Birthdays (scripts/nba-fun.js) ────────
  // Ported from /nhl. For fun: each says in numbers that it isn't a signal.
  const hasLc = (kind, pid) => lcRows(kind).some(r => r.pid === String(pid));
  const LC_OF = { pts: 'pts', reb: 'reb', ast: 'ast', tpm: '3pm', stl: 'stl', blk: 'blk' };
  /** A player's ladder card for a stat, when tonight's board has him. */
  function funOpen(stat, pid) {
    if ((stat === 'dd' || stat === 'td') && (D.stats?.doubles || []).some(r => r.pid === String(pid))) return openDoubleCard(pid);
    const k = LC_OF[stat] || 'pts';
    if (hasLc(k, pid)) openLc(k, pid);
  }

  // ── Due ────────────────────────────────────────────────────────────────
  // Droughts on tonight's board. research/nba_due.py graded every market by
  // drought length against the model's own walk-forward price: nobody is due.
  // First basket is dead even; threes and doubles run the other way (long
  // droughts hit LESS than priced). So the default order is the price.
  const dueF = { tab: 't1', open: false, sort: 'price', game: 'all', q: '' };
  function setDue(k, v, typing) {
    dueF[k] = v; renderDue();
    if (typing) { const i = document.getElementById('due-search'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }
  }
  const DUE_WORD = { t1: 'a made three', t3: '3+ threes', dd: 'a double-double', td: 'a triple-double', fb: 'a first basket' };
  const DUE_UNIT = (k) => k === 'fb' ? 'starts' : 'games';
  const DUE_NOTE = {
    t1: 'Graded against the threes model\'s own price over five seasons, long droughts hit <b>less</b> often than priced, never more: 72+ games without a three priced 11%, hit 1.3% — mostly players who\'ve stopped shooting them. A long drought here is a warning, not a tip.',
    t3: 'Graded against the threes model\'s own price over five seasons: 43+ games without three threes priced 7.7% and hit 6.0%. A dry spell doesn\'t make him due.',
    dd: 'Graded against the double-double model\'s own price over five seasons, every drought length lands within about 10% of its price, the middle ones a little below. Nobody\'s due.',
    td: 'Graded over five seasons (583 triple-doubles): droughts hit at or below their price. Nobody\'s due.',
    fb: 'Dead even: 46+ starts without a first basket priced 7.0% and hit 7.7%, and the drought\'s slope is zero (t +0.6). The tip and his own record are the price; the drought adds nothing.',
  };
  function dueOpen(k, pid, gid) {
    if (k === 't1' || k === 't3') return openLc('3pm', pid, undefined, k === 't1' ? 0.5 : 2.5);
    if (k === 'dd' || k === 'td') return openDoubleCard(pid);
    fbF.game = gid; switchNav('first');
  }
  function renderDue() {
    const el = dataGate('due-content'); if (!el) return;
    const F = D.fun, M = F?.dueMarkets || {};
    if (!F) { el.innerHTML = '<div class="empty">The watch lists fill in with the next build.</div>'; return; }
    const all = F.due?.[dueF.tab] || [];
    const games = [...new Map(Object.values(F.due || {}).flat().map(r => [r.gid, r])).values()];
    if (dueF.game !== 'all' && !games.some(g => g.gid === dueF.game)) dueF.game = 'all';
    const tabs = uiTabs('setDue', dueF.tab, Object.entries(M));
    const controls = uiFilters('setDue', dueF.open, [
      ['Sort', [['price', 'Tonight\'s price'], ['since', `${DUE_UNIT(dueF.tab) === 'starts' ? 'Starts' : 'Games'} since`], ['odds', 'Longest odds']].map(([v, l]) => uiChip('setDue', 'sort', v, l, dueF.sort)).join('')],
      ['Game', [['all', 'All games'], ...games.map(g => [g.gid, g.home ? `${g.opp} @ ${g.team}` : `${g.team} @ ${g.opp}`])].map(([v, l]) => uiChip('setDue', 'game', v, l, dueF.game)).join('')],
    ], (dueF.sort !== 'price') + (dueF.game !== 'all')) + uiSearch('due-search', 'setDue', dueF.q, 'Search a player, team or position…');
    // how unlikely a dry spell this long is at tonight's price: 1 in 1 / (1 - p)^n
    const dry = (r) => Math.pow(1 - r.p, r.n);
    const rows = all.filter(r => (dueF.game === 'all' || r.gid === dueF.game) && matchQ(r, dueF.q)).slice()
      .sort({ price: (a, b) => b.p - a.p, since: (a, b) => b.n - a.n || b.p - a.p, odds: (a, b) => dry(a) - dry(b) }[dueF.sort]);
    const unit = DUE_UNIT(dueF.tab);
    const meta = `<div class="result-meta"><b>${D.stats?.date ? dayLabel(D.stats.date, true) : ''}</b> · ${rows.length} player${rows.length === 1 ? '' : 's'} 3+ ${unit} without ${DUE_WORD[dueF.tab]}, and long enough that he'd have expected one · ${
      dueF.sort === 'price' ? 'ordered by <b>tonight\'s price</b>, not the drought' : dueF.sort === 'since' ? `ordered by <b>${unit} since</b>` : 'ordered by <b>the longest odds</b> of a dry spell that long'}</div>`;
    const oneIn = (r) => { const x = 1 / dry(r); return x >= 1e6 ? 'a million+' : x >= 1e4 ? Math.round(x / 1e3) + 'k' : x >= 10 ? Math.round(x).toLocaleString() : x.toFixed(1); };
    const cards = rows.map((r, i) => `
      <div class="pb-card" onclick="dueOpen('${dueF.tab}','${r.pid}','${r.gid}')">
        <div class="pb-rank">${i + 1}</div>${faceHtml(r.pid, r.name)}
        <div class="pb-info">
          <div class="pb-nm">${esc(r.name)} ${posBadge(r.pos)}</div>
          <div class="pb-line">${logoImg(r.team, 'pb-logo')} ${esc(r.team)} ${r.home ? 'vs' : '@'} ${esc(r.opp)} · <b class="due-od">${fairOdds(r.p)}</b> tonight</div>
          <div class="pb-line">${r.last ? `last: ${dayLabel(r.last)}` : ''} · a 1-in-${oneIn(r)} dry spell at tonight's price</div>
        </div>
        <div class="pb-price">
          <span class="pb-odds dog">${r.n}</span>
          <span class="pb-pct">${unit} without</span>
        </div>
      </div>`).join('');
    el.innerHTML = tabs + controls + meta + (rows.length ? `<div class="pb-list">${cards}</div>` : `<div class="empty">Nobody on the board is in a ${M[dueF.tab]?.toLowerCase() || ''} drought${dueF.q || dueF.game !== 'all' ? ' that matches' : ''}.</div>`)
      + `<div class="t3-note"><b>Is anyone due?</b> ${DUE_NOTE[dueF.tab]}</div>`;
  }

  // ── Milestones ─────────────────────────────────────────────────────────
  // Regular-season career totals vs the next round number: ESPN's career line
  // through last season plus this season's games. A watch list, not a signal.
  const msF = { tab: 'watch', open: false, stat: 'all' };
  function setMs(k, v) { msF[k] = v; renderMilestones(); }
  const MS_UNIT = { pts: 'points', reb: 'rebounds', ast: 'assists', tpm: 'threes', stl: 'steals', blk: 'blocks', dd: 'double-doubles', td: 'triple-doubles', gp: 'games' };
  const MS_WORD = { pts: 'point', reb: 'rebound', ast: 'assist', tpm: 'three', stl: 'steal', blk: 'block', dd: 'double-double', td: 'triple-double', gp: 'game' };
  const ordinal = (n) => { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n.toLocaleString() + (s[(v - 20) % 10] || s[v] || s[0]); };
  function renderMilestones() {
    const el = dataGate('milestones-content'); if (!el) return;
    const F = D.fun;
    if (!F) { el.innerHTML = '<div class="empty">The watch lists fill in with the next build.</div>'; return; }
    const R = F.rungs || {};
    const tabs = uiTabs('setMs', msF.tab, [['watch', 'Watch list'], ['results', 'Results']]);
    const controls = uiFilters('setMs', msF.open, [
      ['Stat', [['all', 'All'], ...Object.entries(R).map(([k, v]) => [k, v.label])].map(([v, l]) => uiChip('setMs', 'stat', v, l, msF.stat)).join('')],
    ], +(msF.stat !== 'all'));
    const keep = (m) => msF.stat === 'all' || m.stat === msF.stat;
    if (msF.tab === 'results') { el.innerHTML = tabs + controls + msResults(F, keep); return; }
    const ms = (F.milestones || []).filter(keep);
    const r0 = R[msF.stat];
    const meta = `<div class="result-meta">Regular-season career totals vs the next round number${r0 ? ` — every ${r0.every.toLocaleString()}, within ${r0.within}` : ''} · ${ms.length} chase${ms.length === 1 ? '' : 's'} · <b>a watch list, not a signal</b></div>`;
    // tonight's projection for the stat being chased, where the board has one
    const projOf = (m) => {
      if (m.stat === 'dd' || m.stat === 'td') { const r = (D.stats?.doubles || []).find(x => x.pid === String(m.pid)); return r ? `<b class="due-od">${fairOdds(r[m.stat])}</b> tonight` : ''; }
      const k = LC_OF[m.stat]; if (!k) return '';
      const r = lcRows(k).find(x => x.pid === String(m.pid)); return r ? `<b class="due-od">${r.mu.toFixed(1)}</b> projected tonight` : '';
    };
    const cards = ms.slice(0, 80).map((m, i) => {
      const t = projOf(m);
      return `<div class="pb-card" onclick="funOpen('${m.stat}','${m.pid}')">
        <div class="pb-rank">${i + 1}</div>${faceHtml(m.pid, m.name)}
        <div class="pb-info">
          <div class="pb-nm">${esc(m.name)} ${posBadge(m.pos)}</div>
          <div class="pb-line">${logoImg(m.team, 'pb-logo')} ${esc(m.team)} · <b>${m.career.toLocaleString()}</b> career ${MS_UNIT[m.stat]}${t ? ` · ${t}` : ''}</div>
        </div>
        <div class="pb-price">
          <span class="pb-odds${m.away <= Math.ceil((R[m.stat]?.within || 10) / 5) ? '' : ' dog'}">${m.away}</span>
          <span class="pb-pct">from ${m.next.toLocaleString()} ${MS_UNIT[m.stat]}</span>
        </div>
      </div>`;
    }).join('');
    el.innerHTML = tabs + controls + meta + (ms.length ? `<div class="pb-list">${cards}</div>` : '<div class="empty">No chases within reach.</div>');
  }
  /** Results: milestones reached this season, the night they happen (the build logs each one). */
  function msResults(F, keep) {
    const R = F.rungs || {}, cur = (F.msReached || []).filter(keep);
    const by = (k) => (F.msReached || []).filter(e => e.stat === k).length;
    const tiles = `<div class="hm-tiles" style="margin-bottom:0.6rem">
      <div class="hm-tile"><b>${(F.msReached || []).length}</b><span>Reached this season</span></div>
      ${['pts', 'reb', 'ast', 'tpm'].map(k => `<div class="hm-tile"><b>${by(k)}</b><span>${R[k]?.label || k}</span></div>`).join('')}
    </div>`;
    const row = (e) => {
      const took = e.since ? (() => { const d = Math.round((Date.parse(e.date) - Date.parse(e.since)) / 864e5); return d > 0 ? ` · ${d} day${d === 1 ? '' : 's'} on the watch list` : ''; })() : '';
      return `<div class="pb-card">
        ${faceHtml(e.pid, e.name)}
        <div class="pb-info">
          <div class="pb-nm">${esc(e.name)} ${e.pos ? posBadge(e.pos) : ''}</div>
          <div class="pb-line">${logoImg(e.team, 'pb-logo')} ${esc(e.team)}${e.opp ? ` vs ${esc(e.opp)}` : ''} · ${dayLabel(e.date)}${took}</div>
        </div>
        <div class="pb-price"><span class="pb-odds">${e.n.toLocaleString()}<small style="font-size:0.55em">${ordinal(e.n).replace(/^[\d,]+/, '')}</small></span><span class="pb-pct">career ${MS_WORD[e.stat]}</span></div>
      </div>`;
    };
    return tiles + `<div class="bd-sec">${esc(D.season)}<span>${cur.length} reached</span></div>` +
      (cur.length ? `<div class="pb-list">${cur.map(row).join('')}</div>` : '<div class="empty">Milestones reached this season land here the night they happen.</div>');
  }

  // ── Birthdays ──────────────────────────────────────────────────────────
  // (bday*, not bd*: bdState / bdSet are the boards')
  const bdayF = { tab: 'board' };
  function setBday(k, v) { bdayF[k] = v; renderBirthdays(); }
  function renderBirthdays() {
    const el = dataGate('birthdays-content'); if (!el) return;
    const F = D.fun;
    if (!F) { el.innerHTML = '<div class="empty">The watch lists fill in with the next build.</div>'; return; }
    const list = F.birthdays || [];
    const tabs = uiTabs('setBday', bdayF.tab, [['board', 'This week'], ['results', 'Results']]);
    if (bdayF.tab === 'results') { el.innerHTML = tabs + bdayResults(F, list); return; }
    if (!list.length) { el.innerHTML = tabs + '<div class="empty">No birthdays this week.</div>'; return; }
    // `off` is days from the build's date; recompute against the reader's today so a page left open overnight stays right
    const t0 = Date.parse(todayET() + 'T00:00:00Z') / 864e5;
    const off = (b) => Date.parse(b.day + 'T00:00:00Z') / 864e5 - t0;
    const offLbl = (o) => o === 0 ? 'today' : o === 1 ? 'tomorrow' : o === -1 ? 'yesterday' : o > 0 ? `in ${o} days` : `${-o} days ago`;
    const rec = (r) => r ? `<span class="bd-rec" title="Regular-season games on his birthday since 2017-18, and his points in them"><b>${(r[1] / r[0]).toFixed(1)}</b> ppg in ${r[0]} on his day</span>` : '';
    const card = (b) => {
      const o = off(b), g = b.game;
      const gm = g ? `plays ${g.home ? 'vs' : '@'} ${esc(g.opp)}${g.pre ? ' (preseason)' : ''}${g.start && o >= 0 ? ` · ${gameTime(g.start)}` : ''}` : 'no game that day';
      return `<div class="bd-card${o === 0 ? ' today' : ''}" onclick="funOpen('pts','${b.pid}')">
        <span class="bd-cake">${o === 0 ? '🎂' : '🎈'}</span>
        ${faceHtml(b.pid, b.name)}
        <div class="bd-info">
          <div class="bd-nm">${esc(b.name)} ${posBadge(b.pos)}</div>
          <div class="bd-sub">${logoImg(b.team, 'bd-logo')}${esc(b.team)} · ${dayLabel(b.day)} (${offLbl(o)}) · ${gm}</div>
        </div>
        ${rec(b.rec)}
        <div class="bd-age">${b.turning}<small>${o < 0 ? 'turned' : 'turning'}</small></div>
        ${b.mu != null ? `<div class="bd-price" title="His projected points on his birthday">${b.mu.toFixed(1)} pts</div>` : ''}
      </div>`;
    };
    const today = list.filter(b => off(b) === 0), ahead = list.filter(b => off(b) > 0), past = list.filter(b => off(b) < 0).reverse();
    const playing = list.filter(b => b.game).length;
    el.innerHTML = tabs + `
      <div class="bd-hero"><span class="bd-week">This week</span>
        <span class="bd-meta">${list.length} birthday${list.length === 1 ? '' : 's'} · ${playing} on a game day</span></div>
      ${today.length ? `<div class="bd-sec">🎂 Today<span>${today.length}</span></div><div class="bd-list">${today.map(card).join('')}</div>` : ''}
      ${ahead.length ? `<div class="bd-sec">Coming up<span>${ahead.length}</span></div><div class="bd-list">${ahead.map(card).join('')}</div>` : ''}
      ${past.length ? `<div class="bd-sec">Just had one<span>${past.length}</span></div><div class="bd-list">${past.map(card).join('')}</div>` : ''}`;
  }
  /** Results: this week's birthday games once played, then whether any of it matters. */
  function bdayResults(F, list) {
    const st = F.bdStats || {}, on = st.on || {}, near = st.near || {};
    const played = list.filter(b => b.game && !b.game.pre && b.res);
    const rows = played.map(b => {
      const r = b.res, beat = b.mu != null && r.pts > b.mu;
      return `<div class="cp-res ${b.mu == null ? '' : beat ? 'hit' : 'miss'}">
        <span class="cp-res-nm">${esc(b.name)} 🎂<span class="cp-res-tm">${esc(b.team)} ${b.game.home ? 'vs' : '@'} ${esc(b.game.opp)} · turned ${b.turning}</span></span>
        <span class="cp-res-line">${b.mu != null ? b.mu.toFixed(1) : ''}</span>
        <span class="cp-res-proj">${dayLabel(b.day)}</span>
        <span class="cp-res-act">${r.pts} PTS · ${r.reb} REB · ${r.ast} AST</span>
        <span class="cp-res-tag">${b.mu == null ? '' : beat ? 'OVER' : 'UNDER'}</span></div>`;
    }).join('');
    return `
      ${rows ? `<div class="cp-res head"><span class="cp-res-nm">Player</span><span class="cp-res-line">Proj</span><span class="cp-res-proj">Day</span><span class="cp-res-act">Line</span><span class="cp-res-tag"></span></div>${rows}`
        : '<div class="empty">Birthday games this week grade here once they\'re played.</div>'}
      <div class="bd-sec">Do birthday boys score?<span>${esc(st.seasons || '')}</span></div>
      <div class="bd-stat">
        <div class="bd-tile"><div class="bd-tile-v">${(on.pts ?? 0).toFixed(2)}</div><div class="bd-tile-l">points on his birthday</div></div>
        <div class="bd-tile"><div class="bd-tile-v">${(on.proj ?? 0).toFixed(2)}</div><div class="bd-tile-l">what we projected</div></div>
        <div class="bd-tile"><div class="bd-tile-v">${on.games ?? 0}</div><div class="bd-tile-l">birthday games</div></div>
        <div class="bd-tile"><div class="bd-tile-v">${(on.ratio ?? 1).toFixed(2)}x</div><div class="bd-tile-l">vs projection</div></div>
      </div>
      <p style="font-size:0.729rem;color:var(--muted);line-height:1.55;margin:0.6rem 0 0">
        No. Graded against the points model's own walk-forward projection, birthday boys scored <b>${(on.pts ?? 0).toFixed(2)}</b> on a
        <b>${(on.proj ?? 0).toFixed(2)}</b> projection — a z of ${on.z ?? '—'}. The days either side of it
        (${near.pts ?? '—'} on ${near.proj ?? '—'}, ${(near.games ?? 0).toLocaleString()} games) say the same. Enjoy it as trivia.</p>`;
  }

  function renderHome() {
    const el = dataGate('home-content'); if (!el) return;
    const card = (nav, title, link, body, empty) =>
      `<div class="hm-card"${nav ? ` onclick="switchNav('${nav}')"` : ''}>
        <div class="hm-head"><span class="hm-title">${title}</span>${nav ? `<span class="hm-link">${link} →</span>` : ''}</div>
        ${body || `<div class="hm-subtle">${empty}</div>`}
      </div>`;

    // ── Opening-night countdown, until the first regular-season tip ───────
    const opener = regStart();
    const days = Math.ceil((new Date(opener + 'T23:30:00Z') - Date.now()) / 86400000);
    const openers = D.schedule.filter(g => g.date === opener && g.type === 2);
    const countdown = days >= 0 ? `<div class="cd">
        <span class="cd-n">${days}</span>
        <div class="cd-t"><b>${days === 0 ? 'Opening night' : days === 1 ? 'day to opening night' : 'days to opening night'}</b>
          <span>${dayLabel(opener, true)} · ${esc(D.season)}${D.phase === 'pre' ? ' · preseason under way' : ''}</span></div>
        ${openers[0] ? `<div class="cd-g">${logoImg(openers[0].away.ab, '')}<span style="color:var(--dim)">@</span>${logoImg(openers[0].home.ab, '')}</div>` : ''}
      </div>` : '';

    // ── Last night ─────────────────────────────────────────────────────────
    const ds = recapDates(), lastNight = ds[ds.length - 1];
    const last = lastNight ? D.recap.filter(g => g.date === lastNight) : [];
    const top = last.flatMap(g => [g.away, g.home].map(x => x.leaders?.points && { ...x.leaders.points, team: x.ab }).filter(Boolean))
      .sort((a, b) => (+b.v || 0) - (+a.v || 0)).slice(0, 4);
    const totalPts = last.reduce((n, g) => n + (g.away.score || 0) + (g.home.score || 0), 0);
    const lastNightCard = last.length ? `
      <div class="hm-tiles">
        <div class="hm-tile"><b>${last.length}</b><span>Games</span></div>
        <div class="hm-tile"><b>${(totalPts / last.length).toFixed(0)}</b><span>Points / Game</span></div>
        <div class="hm-tile"><b>${top[0] ? esc(top[0].v) : '—'}</b><span>Top Scorer</span></div>
      </div>
      <div class="hm-chips">${top.map(m => `<span class="hm-chip">${esc(m.name)} ${esc(m.v)}</span>`).join('')}</div>` : '';

    // ── Next slate ─────────────────────────────────────────────────────────
    const nd = nextGameDate();
    const next = nd ? D.schedule.filter(g => g.date === nd) : [];
    const gameRows = next.slice(0, 6).map(g => `
      <div class="hm-row">
        ${logoImg(g.away.ab, 'hm-glogo')}
        <span class="hm-name hm-matchup">${esc(g.away.ab)} <span class="hm-at">@</span> ${esc(g.home.ab)}${g.lines?.detail ? ` <span class="hm-subtle">${esc(g.lines.detail)} · O/U ${g.lines.total}</span>` : g.type === 1 ? ' <span class="hm-subtle">preseason</span>' : ''}</span>
        ${logoImg(g.home.ab, 'hm-glogo')}
        <span class="hm-score" style="font-size:0.84rem;color:var(--muted)">${gameTime(g.start)}</span></div>`).join('');

    // ── Leader mini-boards ─────────────────────────────────────────────────
    const leaderRow = (r, i, v, unit) => `
      <div class="hm-row"><span class="hm-subtle" style="width:0.9rem">${i + 1}</span>
        ${faceHtml(r.pid, r.name, 'hm-photo')}
        <span class="hm-name">${esc(r.name)}<span class="hm-subtle">${esc(r.pos || '')} ${esc(r.team)}</span></span>
        <span class="hm-score hot">${v}<span class="hm-subtle" style="font-size:0.766rem"> ${unit}</span></span></div>`;
    const by = (k, unit) => [...(D.leaders || [])].sort((a, b) => b[k] - a[k]).slice(0, 5).map((r, i) => leaderRow(r, i, r[k].toFixed(1), unit)).join('');

    // ── Standings, by conference ─────────────────────────────────────────
    const conf = (c) => Object.values(D.teams || {}).filter(t => t.conf === c)
      .sort((a, b) => (b.w - b.l) - (a.w - a.l) || b.w - a.w || a.name.localeCompare(b.name)).slice(0, 5).map((t, i) => `
      <div class="hm-row"><span class="hm-subtle" style="width:0.9rem">${i + 1}</span>
        ${logoImg(t.ab, 'hm-glogo')}
        <span class="hm-name">${esc(t.name)}<span class="hm-subtle">${t.streak && t.streak !== '-' ? esc(t.streak) : ''}</span></span>
        <span class="hm-score hot">${t.w}-${t.l}</span></div>`).join('');
    const played = Object.values(D.teams || {}).some(t => t.w || t.l);

    const t3 = D.threes?.rows?.length ? [...D.threes.rows].sort((a, b) => b.p[1] - a.p[1]).slice(0, 5).map((r, i) => `
      <div class="hm-row"><span class="hm-subtle" style="width:0.9rem">${i + 1}</span>
        ${faceHtml(r.pid, r.name, 'hm-photo')}
        <span class="hm-name">${esc(r.name)}<span class="hm-subtle">${esc(r.team)} ${r.home ? 'vs' : '@'} ${esc(r.opp)} · ${r.mu.toFixed(1)} x3PM</span></span>
        <span class="hm-score hot">${fairOdds(r.p[1])}<span class="hm-subtle" style="font-size:0.766rem"> 2+</span></span></div>`).join('') : '';
    // ── Watch lists: Due, Milestones, Birthdays ──────────────────────────
    const FUN = D.fun || {};
    const dueHome = (FUN.due?.t1 || []).slice(0, 3).map(r => `
      <div class="hm-row" onclick="event.stopPropagation(); switchNav('due'); dueOpen('t1','${r.pid}','${r.gid}')">
        ${faceHtml(r.pid, r.name, 'hm-photo')}
        <span class="hm-name">${esc(r.name)}<span class="hm-subtle">${esc(r.team)} · no three since ${r.last ? dayLabel(r.last) : '—'} · ${fairOdds(r.p)}</span></span>
        <span class="hm-score warm">${r.n}<span class="hm-subtle" style="font-size:0.766rem"> gms</span></span></div>`).join('');
    const msHome = (FUN.milestones || []).slice(0, 3).map(m => `
      <div class="hm-row" onclick="event.stopPropagation(); switchNav('milestones')">
        ${faceHtml(m.pid, m.name, 'hm-photo')}
        <span class="hm-name">${esc(m.name)}<span class="hm-subtle">${esc(m.team)} · ${m.career.toLocaleString()} career ${MS_UNIT[m.stat]}</span></span>
        <span class="hm-score hot">${m.away}<span class="hm-subtle" style="font-size:0.766rem"> from ${m.next.toLocaleString()}</span></span></div>`).join('');
    const bdT0 = Date.parse(todayET() + 'T00:00:00Z') / 864e5;
    const bdHome = (FUN.birthdays || []).map(b => ({ ...b, o: Date.parse(b.day + 'T00:00:00Z') / 864e5 - bdT0 }))
      .filter(b => b.o >= 0).slice(0, 3).map(b => `
      <div class="hm-row" onclick="event.stopPropagation(); switchNav('birthdays')">
        ${faceHtml(b.pid, b.name, 'hm-photo')}
        <span class="hm-name">${esc(b.name)}<span class="hm-subtle">${esc(b.team)} · turns ${b.turning}${b.game ? ' · game day' : ''}</span></span>
        <span class="hm-score ${b.o === 0 ? 'hot' : 'warm'}">${b.o === 0 ? 'today' : `${b.o}d`}</span></div>`).join('');
    const lead = esc(D.leadersFrom);
    el.innerHTML = countdown + `
      <div class="hm-cols">
        <div class="hm-col">
          ${t3 ? card('threes', `${dayLabel(D.threes.date)} · Threes (2+)`, 'Threes', t3, '') : ''}
          ${card('recap', lastNight ? `${dayLabel(lastNight)} Recap` : 'Recap', 'Recap', lastNightCard, 'No games played yet.')}
          ${card('stats', `${lead} Scoring Leaders`, 'Stats', by('pts', 'PPG'), 'No leaders yet.')}
          ${card('stats', `${lead} Threes Leaders`, 'Stats', by('tpm', '3PM'), 'No leaders yet.')}
        </div>
        <div class="hm-col">
          ${card('schedule', nd ? `${dayLabel(nd)} · ${next.length} Game${next.length === 1 ? '' : 's'}` : 'Schedule', 'Schedule', gameRows, 'No games in the next ten days.')}
          ${played ? card(null, 'East', '', conf('East'), '') + card(null, 'West', '', conf('West'), '') : ''}
          ${card('stats', `${lead} Rebounds Leaders`, 'Stats', by('reb', 'RPG'), 'No leaders yet.')}
          ${card('stats', `${lead} Assists Leaders`, 'Stats', by('ast', 'APG'), 'No leaders yet.')}
          ${card('due', 'Due', 'Due', dueHome, 'Nobody on the board is in a drought.')}
          ${card('milestones', 'Milestone Watch 🏆', 'Milestones', msHome, 'No chases within reach.')}
          ${card('birthdays', 'Birthdays 🎂', 'Birthdays', bdHome, 'No birthdays this week.')}
        </div>
      </div>`;
  }

  document.addEventListener('DOMContentLoaded', () => { updateThemeToggleIcon(); applyRouteState(); loadNba(); });
</script>
</body>
</html>
