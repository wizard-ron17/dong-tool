<script>
  const APP_BASE = '/nba';

  // ── Theme, sport switcher, tools menu: /chrome.js ─────────────────────────
  // ESPN ships a dark-background cut of every mark; repaint on the flip.
  RonChrome.onTheme(() => document.querySelectorAll('img[data-team]').forEach(img => { img.src = teamLogo(img.dataset.team); }));


  // ── Nav + routing ──────────────────────────────────────────────────────
  const NBA_NAVS = ['home', 'stats', 'recap', 'threes', 'first', 'points', 'stocks', 'doubles', 'due', 'milestones', 'birthdays', 'schedule'];   // tools added here as they ship
  const PAGE_TITLES = { home: "Ron's Hoop Tool", stats: "Stats · Ron's Hoop Tool", recap: "Recap · Ron's Hoop Tool", threes: "Threes · Ron's Hoop Tool", first: "First Basket · Ron's Hoop Tool", points: "Points · Ron's Hoop Tool", stocks: "Steals & Blocks · Ron's Hoop Tool", doubles: "Double & Triple-Doubles · Ron's Hoop Tool", due: "Due · Ron's Hoop Tool", milestones: "Milestones · Ron's Hoop Tool", birthdays: "Birthdays · Ron's Hoop Tool", schedule: "Schedule · Ron's Hoop Tool" };
  let activeNav = 'home', applyingRoute = false;
  function switchNav(nav) {
    activeNav = nav;
    RonChrome.show(nav, { title: PAGE_TITLES[nav] });
    renderPanel(nav);
    if (!applyingRoute) commitRoute();
  }
  function currentPath() { return activeNav === 'home' ? APP_BASE + '/' : APP_BASE + '/' + activeNav; }
  function commitRoute() { const p = currentPath(); if (location.pathname !== p) history.pushState(null, '', p); }
  function parsePath() { const rel = location.pathname.startsWith(APP_BASE) ? location.pathname.slice(APP_BASE.length) : location.pathname; return rel.replace(/^\/+|\/+$/g, '').split('/')[0] || 'home'; }
  function applyRouteState() {
    applyingRoute = true;
    let nav = parsePath();
    if (nav === 'pra') { bdState('points').tab = 'pra'; nav = 'points'; }   // PRA moved into Points; old links still land
    switchNav(NBA_NAVS.includes(nav) ? nav : 'home');
    history.replaceState(history.state, '', currentPath());
    applyingRoute = false;
  }
  window.addEventListener('popstate', applyRouteState);

  function renderPanel(nav) {
    if (nav === 'home') renderHome();
    else if (nav === 'stats') renderStats();
    else if (nav === 'recap') renderRecap();
    else if (nav === 'schedule') renderSchedule();
    else if (nav === 'threes') renderThrees();
    else if (nav === 'first') renderFirst();
    else if (BD[nav]) renderBoard(nav);
    else if (nav === 'doubles') renderDoubles();
    else if (nav === 'due') renderDue();
    else if (nav === 'milestones') renderMilestones();
    else if (nav === 'birthdays') renderBirthdays();
  }

  // ── Data ───────────────────────────────────────────────────────────────
  let D = null, recapDate = null, scheduleDate = null;
  function timeAgo(iso) {
    const mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
    if (mins < 1)  return 'just now';
    if (mins < 60) return `${mins}m ago`;
    const hrs = Math.round(mins / 60);
    if (hrs < 24) return `${hrs}h ago`;
    return `${Math.round(hrs / 24)}d ago`;
  }
  function setStatus(type, text) {
    const labels = { fetching: 'Loading', error: 'Error' };
    const badge = document.getElementById('status-badge');
    badge.className = 'status-badge ' + type;
    badge.textContent = text ?? labels[type] ?? type;
  }
  // Coverage · volume · freshness, the same shape as the other sports' badges.
  function statusSummary(d) {
    const nights = new Set((d.recap || []).map(g => g.date)).size;
    return `${nights}n · ${(d.recap || []).length} gm · upd ${timeAgo(d.generated)}`;
  }
  async function loadNba() {
    setStatus('fetching');
    try {
      const r = await dataFetch('data.json', { cache: 'no-store' });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      D = await r.json();
      D.dates = [...new Set(D.schedule.map(g => g.date))].sort();
      const el = document.getElementById('eyebrow-season');
      if (el && D.season) el.textContent = D.season;
      setStatus('ready', statusSummary(D));
      RonChrome.fresh(D.generated, { starts: (D.schedule || []).filter(g => g.state !== 'post').map(g => g.start) });
    } catch (e) { D = 'error'; setStatus('error'); }
    renderPanel(activeNav);
  }
  function dataGate(id) {
    const el = document.getElementById(id); if (!el) return null;
    if (!D) { el.innerHTML = '<div class="empty">Loading…</div>'; return null; }
    if (D === 'error') { el.innerHTML = '<div class="empty">Couldn\'t load NBA data. <a href="javascript:void(0)" onclick="loadNba()">Retry</a></div>'; return null; }
    return el;
  }

  // ── Helpers ────────────────────────────────────────────────────────────
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  // ESPN labels each club's marks; the dark cut is the one for dark backgrounds.
  const teamLogo = (ab) => { const t = D?.teams?.[ab]; return (currentTheme() === 'dark' ? t?.logoDark : null) || t?.logo || ''; };
  const logoImg = (ab, cls) => `<img class="${cls}" data-team="${ab}" src="${teamLogo(ab)}" alt="${ab}" loading="lazy">`;
  const teamName = (ab) => D.teams?.[ab]?.name || ab;
  const record = (ab) => { const t = D.teams?.[ab]; return t && (t.w || t.l) ? `${t.w}-${t.l}` : ''; };
  // Positions are categories, not ratings: their own hues, none from the good/bad ramp.
  const POS_FAM = { PG: 'G', SG: 'G', G: 'G', SF: 'F', PF: 'F', F: 'F', C: 'C', GF: 'F', FC: 'C' };
  const posBadge = (p) => { const f = POS_FAM[p] || 'F'; return `<span class="posb p-${f}">${esc(p || f)}</span>`; };
  const pct = (v, d = 1) => v == null ? '—' : (v * 100).toFixed(d) + '%';
  const odds = (v) => v == null ? '' : (v > 0 ? '+' : '') + v;
  const sgn = (v) => v == null ? '' : v > 0 ? '+' + v : v === 0 ? 'PK' : String(v);

  /** A date string the feed keys on (yyyy-mm-dd) as a label in the reader's words. */
  function dayLabel(ymd, long) {
    const d = new Date(ymd + 'T12:00:00Z');
    const opt = long ? { weekday: 'long', month: 'short', day: 'numeric' } : { weekday: 'short', month: 'short', day: 'numeric' };
    return new Intl.DateTimeFormat('en-US', { ...opt, timeZone: 'UTC' }).format(d);
  }
  /** Tip-off in the reader's own timezone — the feed publishes UTC. */
  const gameTime = (iso) => iso ? new Intl.DateTimeFormat('en-US', { hour: 'numeric', minute: '2-digit' }).format(new Date(iso)) : '';
  /** Today, on the NBA's clock: its day boundary is US Eastern, and so are its date keys. */
  const todayET = () => new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());

  // ESPN has no headshot for this prospect; don't request its known-404 URL.
  const NO_ESPN_HEADSHOT = new Set(['5176420']);
  /** ESPN headshots; fall back to initials when a player has no image. */
  // ── Share cards (share.js): each board's top 10 as an image ──
  const shareRow = (r, p, tag, extra = '') => ({ name: r.name, p, tag,
    img: r.pid && !NO_ESPN_HEADSHOT.has(String(r.pid)) ? `https://a.espncdn.com/i/headshots/nba/players/full/${r.pid}.png` : null,
    logo: D?.teams?.[r.team]?.logoDark || D?.teams?.[r.team]?.logo || null,
    line: `${r.team} ${r.home ? 'vs' : '@'} ${r.opp}${extra ? ' · ' + extra : ''}` });
  function faceHtml(pid, name, cls) {
    const ini = (name || '').split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
    if (!pid || NO_ESPN_HEADSHOT.has(String(pid))) return `<div class="rc-photo rc-noface ${cls || ''}">${esc(ini)}</div>`;
    return `<img class="rc-photo ${cls || ''}" src="https://a.espncdn.com/i/headshots/nba/players/full/${esc(pid)}.png" alt="" loading="lazy"
      onerror="this.outerHTML='&lt;div class=\\'rc-photo rc-noface ${cls || ''}\\'&gt;${esc(ini)}&lt;/div&gt;'">`;
  }
  const typeTag = (t) => t === 1 ? '<span class="sc-pre">PRE</span>' : t === 5 ? '<span class="sc-pre">PLAY-IN</span>' : t === 3 ? '<span class="sc-pre">PLAYOFFS</span>' : '';

  // ── Recap ──────────────────────────────────────────────────────────────
  // One night at a time, built around what the tool prices: the first basket,
  // every three, the double/triple-doubles — each graded against our last
  // pre-tip price (nba/prices-history.json). No NBA clips exist to show, so
  // the shots are drawn: ESPN logs where every field goal was taken
  // (scripts/nba-recap.js — x 0-50 ft across, y out from the rim at (25, 1)).
  let RC = null, PH = null, rcState = 'idle';
  function loadRecap() {
    if (rcState !== 'idle') return;
    rcState = 'loading';
    Promise.all([dataFetch('recap.json', { cache: 'no-store' }).then(r => r.json()),
                 dataFetch('prices-history.json', { cache: 'no-store' }).then(r => r.json()).catch(() => ({ days: {} }))])
      .then(([r, h]) => { RC = r; PH = h; rcState = 'ready'; })
      .catch(() => { rcState = 'error'; })
      .finally(() => { if (activeNav === 'recap') renderRecap(); });
  }
  const rcGames = () => Object.values(RC?.games || {});
  const recapDates = () => [...new Set((RC ? rcGames() : D.recap || []).map(g => g.date))].sort();
  function setRecapDate(d) { recapDate = d; renderRecap(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  function shiftRecapDate(n) {
    const ds = recapDates(), i = ds.indexOf(recapDate) + n;
    if (i >= 0 && i < ds.length) setRecapDate(ds[i]);
  }
  function recapToLatest() { const ds = recapDates(); setRecapDate(ds[ds.length - 1]); }

  // box: pid -> [name, team, starter, min, pts, reb, ast, stl, blk, tpm, tpa]
  const BX = { name: 0, team: 1, st: 2, min: 3, pts: 4, reb: 5, ast: 6, stl: 7, blk: 8, tpm: 9, tpa: 10 };
  const cats10 = (b) => [b[BX.pts], b[BX.reb], b[BX.ast], b[BX.stl], b[BX.blk]].filter(v => v >= 10).length;
  const shortName = (n) => { const w = (n || '').split(' '); return w.length > 1 ? `${w[0][0]}. ${w.slice(1).join(' ')}` : n; };
  const fbKind = (fb) => fb.v === 3 ? (fb.kind || 'jumper').replace(/jumper$|shot$/, '') .trim() + ' three' : (fb.kind || '');
  const clockLbl = (per, sec) => `${per > 4 ? (per === 5 ? 'OT' : `${per - 4}OT`) : `Q${per}`} ${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
  // the board's "best line": the rung closest to even. p = P(1+) .. P(5+)
  const bestRung = (p) => p.reduce((k, v, i) => Math.abs(v - 0.5) < Math.abs(p[k] - 0.5) ? i : k, 0);
  const gradeChip = (hit, txt) => `<span class="rx-grade ${hit ? 'hit' : 'miss'}">${hit ? '✓' : '✗'} ${txt}</span>`;
  const teamCol = (ab) => D.teams?.[ab]?.color || 'var(--muted)';
  /** The two sides' dot colours: the home side takes its alternate when the primaries are too alike (MEM navy vs PHI blue). */
  function gameCols(G) {
    const rgb = (h) => (h || '#888888').match(/[0-9a-f]{2}/gi).map(x => parseInt(x, 16));
    const far = (a, b) => { const [x, y] = [rgb(a), rgb(b)]; return Math.hypot(x[0] - y[0], x[1] - y[1], x[2] - y[2]) > 120; };
    const a = D.teams?.[G.away]?.color, h = D.teams?.[G.home]?.color, h2 = D.teams?.[G.home]?.alt;
    return { [G.away]: a || '#8a94a6', [G.home]: !a || !h || far(a, h) ? (h || '#8a94a6') : (h2 && far(a, h2) ? h2 : h) };
  }

  // ── The court: a half court, the basket at the top, 10 px a foot ──────
  const CX = (x) => x * 10, CY = (y) => (Math.min(y, 44) + 4.25) * 10;
  function courtSvg(G) {
    const ln = 'class="rx-line"';
    const arcY = 1 + Math.sqrt(23.75 ** 2 - 22 ** 2);
    const TC = gameCols(G);
    const dots = G.threes.map((t, i) => {
      const c = TC[G.box[t[0]]?.[BX.team]] || 'var(--muted)';
      return `<circle class="rx-dot ${t[3] ? 'made' : 'miss'}" data-i="${i}" cx="${CX(t[1])}" cy="${CY(t[2])}" r="7" style="--tc:${c}" onclick="event.stopPropagation();rxPlay('${G.gid}',[${i}])"/>`;
    }).join('');
    const fb = G.fb && G.fb.x != null ? `<path class="rx-fb" d="M${CX(G.fb.x)},${CY(G.fb.y) - 11}l11,11l-11,11l-11,-11z" onclick="event.stopPropagation();rxFirst('${G.gid}')"/>` : '';
    return `<svg class="rx-court" viewBox="0 0 500 490" role="img" aria-label="Every three of the game on a half court">
      <rect x="0" y="0" width="500" height="490" class="rx-floor"/>
      <image href="${teamLogo(G.home)}" x="195" y="270" width="110" height="110" class="rx-logo" preserveAspectRatio="xMidYMid meet"/>
      <rect x="170" y="0" width="160" height="190" class="rx-paint"/>
      <circle cx="250" cy="190" r="60" ${ln}/>
      <path d="M210,${CY(1)} A40,40 0 0 0 290,${CY(1)}" ${ln}/>
      <line x1="30" y1="0" x2="30" y2="${CY(arcY)}" ${ln}/><line x1="470" y1="0" x2="470" y2="${CY(arcY)}" ${ln}/>
      <path d="M30,${CY(arcY)} A237.5,237.5 0 0 0 470,${CY(arcY)}" ${ln}/>
      <line x1="220" y1="${CY(-0.25)}" x2="280" y2="${CY(-0.25)}" class="rx-board"/>
      <circle cx="250" cy="${CY(1)}" r="7.5" class="rx-rim"/>
      <circle cx="250" cy="${CY(1)}" r="7.5" class="rx-flash"/>
      <path d="M190,470 A60,60 0 0 1 310,470" ${ln}/><line x1="0" y1="470" x2="500" y2="470" ${ln}/>
      <g class="rx-dots">${dots}</g>${fb}
      <ellipse class="rx-shadow" cx="-99" cy="-99" rx="9" ry="4"/>
      <circle class="rx-ball" cx="-99" cy="-99" r="8"/>
    </svg>`;
  }

  // ── Animation: plan position along the floor, height faked with the ball's size ──
  const rxAnim = {};
  const rxReduce = () => window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
  function rxEls(gid) { const w = document.getElementById('rx-' + gid); return w && { w, svg: w.querySelector('.rx-court'), ball: w.querySelector('.rx-ball'), sh: w.querySelector('.rx-shadow'), flash: w.querySelector('.rx-flash'), cap: w.querySelector('.rx-cap') }; }
  function rxPlace(E, x, y, h) {
    E.ball.setAttribute('cx', CX(x)); E.ball.setAttribute('cy', CY(y) - h * 30); E.ball.setAttribute('r', 8 + h * 5);
    E.sh.setAttribute('cx', CX(x)); E.sh.setAttribute('cy', CY(y) + 4); E.sh.style.opacity = 0.5 - h * 0.3;
  }
  /** Run steps in order: each is { dur, frame(f) } — one requestAnimationFrame chain per game card. */
  function rxRun(gid, steps, done) {
    cancelAnimationFrame(rxAnim[gid]);
    const E = rxEls(gid); if (!E) return;
    let i = 0, t0 = null;
    const tick = (ts) => {
      if (t0 == null) t0 = ts;
      const s = steps[i], f = Math.min(1, (ts - t0) / s.dur);
      s.frame(f, E);
      if (f >= 1) { i++; t0 = ts; if (i >= steps.length) { done?.(E); return; } }
      rxAnim[gid] = requestAnimationFrame(tick);
    };
    rxAnim[gid] = requestAnimationFrame(tick);
  }
  const ease = (f) => f < 0.5 ? 2 * f * f : 1 - (-2 * f + 2) ** 2 / 2;
  /** One shot: the flight from his spot to the rim, then the swish or the bounce off. */
  function shotSteps(x, y, made, seed, fast) {
    const d = Math.hypot(x - 25, y - 1), dur = (fast ? 380 : 620) + d * (fast ? 6 : 14);
    const ang = (seed * 2.399) % (2 * Math.PI), bx = 25 + Math.cos(ang) * 4, by = Math.max(-2, 1 + Math.abs(Math.sin(ang)) * 5);
    return [
      { dur, frame: (f, E) => { const e = ease(f); rxPlace(E, x + (25 - x) * e, y + (1 - y) * e, Math.sin(Math.PI * f) * Math.min(1, d / 22)); } },
      made ? { dur: fast ? 160 : 320, frame: (f, E) => { rxPlace(E, 25, 1, 0); E.ball.setAttribute('r', 8 * (1 - f * 0.6)); E.flash.style.opacity = 1 - f; E.flash.setAttribute('r', 7.5 + f * 22); } }
           : { dur: fast ? 220 : 420, frame: (f, E) => rxPlace(E, 25 + (bx - 25) * f, 1 + (by - 1) * f, Math.sin(Math.PI * f) * 0.35) },
    ];
  }
  function rxCaption(E, html) { if (E?.cap) E.cap.innerHTML = html; }
  function rxHighlight(E, idx) { E.svg.querySelectorAll('.rx-dot').forEach(el => el.classList.toggle('dim', idx != null && !idx.includes(+el.dataset.i))); }
  /** Play threes of a game, one after another; a single one is slower and captioned. */
  function rxPlay(gid, idx) {
    const G = RC?.games?.[gid], E = rxEls(gid); if (!G || !E) return;
    idx = idx || G.threes.map((_, i) => i);
    rxHighlight(E, idx);
    const cap = (t) => { const b = G.box[t[0]] || [], a = t[6] ? G.box[t[6]] : null, ft = Math.round(Math.hypot(t[1] - 25, t[2] - 1));
      return `<b>${esc(shortName(b[BX.name]))}</b> · ${ft}-ft ${esc(t[7] || 'three')} · ${clockLbl(t[4], t[5])} · <span class="${t[3] ? 'rx-made' : 'rx-missed'}">${t[3] ? 'made' : 'missed'}</span>${a ? ` <span class="dim">(${esc(shortName(a[BX.name]))} assist)</span>` : ''}`; };
    if (rxReduce()) { if (idx.length === 1) rxCaption(E, cap(G.threes[idx[0]])); return; }
    const fast = idx.length > 3, steps = [];
    idx.forEach((i, n) => {
      const t = G.threes[i];
      steps.push({ dur: 1, frame: (f, E2) => { rxCaption(E2, cap(t) + (idx.length > 1 ? ` <span class="dim">· ${n + 1}/${idx.length}</span>` : '')); E2.svg.querySelectorAll('.rx-dot').forEach(el => el.classList.toggle('now', +el.dataset.i === i)); } });
      steps.push(...shotSteps(t[1], t[2], t[3], i, fast));
    });
    rxRun(gid, steps, (E2) => { rxPlace(E2, -99, -99, 0); E2.svg.querySelectorAll('.rx-dot.now').forEach(el => el.classList.remove('now')); });
  }
  /** The opening tip to the winning side, then the first basket from where it was taken. */
  function rxFirst(gid) {
    const G = RC?.games?.[gid], E = rxEls(gid); if (!G?.fb || !E) return;
    const fb = G.fb, who = G.box[fb.pid]?.[BX.name] || '', a = fb.ast ? G.box[fb.ast]?.[BX.name] : null;
    const ft = fb.x != null ? Math.round(Math.hypot(fb.x - 25, fb.y - 1)) : null;
    const tip = G.tip ? `${esc(G.tip.won)} win the tip` : '';
    rxHighlight(E, []);
    rxCaption(E, `${tip ? tip + ' · ' : ''}<b>${esc(shortName(who))}</b> scores first · ${ft != null ? `${ft}-ft ` : ''}${esc(fbKind(fb))} · ${clockLbl(fb.per, fb.sec)}${a ? ` <span class="dim">(${esc(shortName(a))} assist)</span>` : ''}`);
    if (rxReduce() || fb.x == null) return;
    const toX = fb.x, toY = fb.y;
    rxRun(gid, [
      { dur: 700, frame: (f, E2) => rxPlace(E2, 25, 42.75, Math.sin(Math.PI * f) * 1.3) },                       // the jump ball
      { dur: 900, frame: (f, E2) => { const e = ease(f); rxPlace(E2, 25 + (toX - 25) * e, 42.75 + (toY - 42.75) * e, 0.15 * Math.abs(Math.sin(Math.PI * 4 * f))); } },   // brought up
      ...shotSteps(toX, toY, 1, 0, false),
    ], (E2) => rxPlace(E2, -99, -99, 0));
  }

  function renderRecap() {
    const el = dataGate('recap-content'); if (!el) return;
    loadRecap();
    if (rcState === 'loading' || rcState === 'idle') { el.innerHTML = '<div class="empty">Loading…</div>'; return; }
    const ds = recapDates();
    if (!ds.length) { el.innerHTML = `<div class="empty">No games have been played yet${D.phase === 'pre' || D.phase === 'off' ? ' — opening night is ' + dayLabel(regStart(), true) : ''}.</div>`; return; }
    if (recapDate == null || !ds.includes(recapDate)) recapDate = ds[ds.length - 1];
    const i = ds.indexOf(recapDate), atFirst = i <= 0, atLast = i >= ds.length - 1;
    const games = rcGames().filter(g => g.date === recapDate).sort((a, b) => a.gid.localeCompare(b.gid));
    const P = PH?.days?.[recapDate] || null;
    // ── the night, graded ──
    let fbPicked = 0, fbHit = 0, t3Made = 0, t3Att = 0, dd = 0, td = 0, t3Priced = 0, t3Hit = 0;
    for (const G of games) {
      t3Att += G.threes.length; t3Made += G.threes.filter(t => t[3]).length;
      for (const b of Object.values(G.box)) { const c = cats10(b); if (c >= 2) dd++; if (c >= 3) td++; }
      const fp = P?.fb?.[G.gid];
      if (fp && G.fb) { const top = Object.entries(fp).sort((a, b) => b[1] - a[1])[0]; fbPicked++; if (top?.[0] === G.fb.pid) fbHit++; }
      if (P?.t3) for (const [pid, b] of Object.entries(G.box)) { const e = P.t3[pid]; if (!e) continue; const k = bestRung(e.slice(1)); t3Priced++; if (b[BX.tpm] >= k + 1) t3Hit++; }
    }
    const tiles = `<div class="hm-tiles rx-tiles">
      <div class="hm-tile"><b>${t3Made}/${t3Att}</b><span>Threes made</span></div>
      <div class="hm-tile"><b>${fbPicked ? `${fbHit}/${fbPicked}` : '—'}</b><span>First basket · our pick</span></div>
      <div class="hm-tile"><b>${t3Priced ? `${t3Hit}/${t3Priced}` : '—'}</b><span>Threes · over his best line</span></div>
      <div class="hm-tile"><b>${dd}${td ? ` · ${td} TD` : ''}</b><span>Double-doubles</span></div>
    </div>`;
    const body = games.map(G => {
      const aWin = G.as > G.hs, fp = P?.fb?.[G.gid];
      // first basket
      let fbHtml = '<div class="rx-none">No first basket logged.</div>';
      if (G.fb) {
        const b = G.box[G.fb.pid] || [], mine = fp?.[G.fb.pid];
        const top = fp ? Object.entries(fp).sort((a, b2) => b2[1] - a[1])[0] : null;
        const hit = top && top[0] === G.fb.pid;
        const ft = G.fb.x != null ? `${Math.round(Math.hypot(G.fb.x - 25, G.fb.y - 1))}-ft ` : '';
        fbHtml = `<div class="rx-row" onclick="rxFirst('${G.gid}')">
          ${faceHtml(G.fb.pid, b[BX.name])}
          <div class="rx-info"><div class="rx-nm">${esc(b[BX.name] || '')} <span class="dim">${esc(G.fb.team || '')}</span></div>
            <div class="rx-sub">${ft}${esc(fbKind(G.fb))} · ${clockLbl(G.fb.per, G.fb.sec)}${G.tip ? ` · ${esc(G.tip.won)} won the tip` : ''}</div></div>
          <div class="rx-right">${mine != null ? `<span class="rx-odds">${Odds.inline(mine)}</span>` : ''}
            ${top ? hit ? gradeChip(true, 'our pick') : `<span class="rx-grade miss">our pick: ${esc((G.box[top[0]]?.[BX.name] || '').split(' ').slice(-1)[0])} ${Odds.inline(top[1])}</span>` : ''}</div>
        </div>`;
      }
      // threes, by player
      const by = {};
      G.threes.forEach((t, j) => { (by[t[0]] ||= []).push(j); });
      const T3 = P?.t3 || {};
      const shooters = Object.entries(by).map(([pid, idx]) => ({ pid, idx, b: G.box[pid] || [], m: idx.filter(j => G.threes[j][3]).length }))
        .sort((a, b) => b.m - a.m || a.idx.length - b.idx.length).slice(0, 6);
      const TC = gameCols(G);
      const team3 = (ab) => { const s = G.threes.filter(t => G.box[t[0]]?.[BX.team] === ab); return `<span class="rx-team3"><i class="rx-sw" style="background:${TC[ab]}" title="${esc(ab)}'s shots on the court"></i>${logoImg(ab, 'rx-tlogo')}<b>${s.filter(t => t[3]).length}/${s.length}</b></span>`; };
      const t3Rows = shooters.map(s => {
        const e = T3[s.pid]; let g = '';
        if (e) { const k = bestRung(e.slice(1)); g = gradeChip(s.m >= k + 1, `o${k + 0.5} ${Odds.inline(e[k + 1])}`); }
        return `<div class="rx-row" onclick="rxPlay('${G.gid}',[${s.idx.join(',')}])">
          ${faceHtml(s.pid, s.b[BX.name])}
          <div class="rx-info"><div class="rx-nm">${esc(s.b[BX.name] || '')} <span class="dim">${esc(s.b[BX.team] || '')}</span></div>
            <div class="rx-sub">${e ? `proj ${e[0].toFixed(1)} · ` : ''}${s.b[BX.min] ?? 0} min</div></div>
          <div class="rx-right"><span class="rx-stat">${s.m}<small>/${s.idx.length}</small></span>${g}</div>
        </div>`;
      }).join('');
      // double / triple-doubles
      const dbl = Object.entries(G.box).filter(([, b]) => cats10(b) >= 2).sort((a, b) => cats10(b[1]) - cats10(a[1]) || b[1][BX.pts] - a[1][BX.pts]);
      const dblRowsH = dbl.map(([pid, b]) => {
        const t = cats10(b) >= 3, e = P?.dbl?.[pid];
        const line = [['pts', 'PTS'], ['reb', 'REB'], ['ast', 'AST'], ['stl', 'STL'], ['blk', 'BLK']].filter(([k]) => b[BX[k]] >= 10 || ['pts', 'reb', 'ast'].includes(k)).map(([k, l]) => `${b[BX[k]]} ${l}`).join(' · ');
        return `<div class="rx-row" onclick="funOpen('${t ? 'td' : 'dd'}','${pid}')">
          ${faceHtml(pid, b[BX.name])}
          <div class="rx-info"><div class="rx-nm">${esc(b[BX.name])} <span class="dim">${esc(b[BX.team])}</span>${t ? ' <span class="rx-td">TRIPLE-DOUBLE</span>' : ''}</div>
            <div class="rx-sub">${line}</div></div>
          <div class="rx-right">${e ? `<span class="rx-odds">${Odds.inline(t ? e[1] : e[0])}</span><span class="rx-sub">we priced ${t ? 'TD' : 'DD'}</span>` : ''}</div>
        </div>`;
      }).join('');
      return `<div class="rg rx" id="rx-${G.gid}">
        <div class="rg-head">
          <span class="rg-score">
            ${logoImg(G.away, 'rg-logo')}<span class="${aWin ? 'w' : ''}">${esc(G.away)} ${G.as}</span>
            <span style="color:var(--dim)">–</span>
            <span class="${!aWin ? 'w' : ''}">${G.hs} ${esc(G.home)}</span>${logoImg(G.home, 'rg-logo')}
          </span>${G.ot ? `<span class="rg-end">${G.ot > 1 ? G.ot : ''}OT</span>` : ''}${typeTag(G.type)}
        </div>
        <div class="rx-grid">
          <div class="rx-courtwrap">
            ${courtSvg(G)}
            <div class="rx-cap">Every three of the game — filled made, hollow missed. Tap a shot or a player to replay it.</div>
            <div class="rx-btns">
              <button class="rx-btn" onclick="rxFirst('${G.gid}')" ${G.fb ? '' : 'disabled'}>◆ First basket</button>
              <button class="rx-btn" onclick="rxPlay('${G.gid}')" ${G.threes.length ? '' : 'disabled'}>▶ Every three</button>
            </div>
          </div>
          <div class="rx-side">
            <div class="rx-sec">First basket</div>${fbHtml}
            <div class="rx-sec">Threes ${team3(G.away)}${team3(G.home)}</div>${t3Rows || '<div class="rx-none">No threes attempted.</div>'}
            <div class="rx-sec">Double-doubles</div>${dblRowsH || '<div class="rx-none">None tonight.</div>'}
          </div>
        </div>
      </div>`;
    }).join('');
    el.innerHTML = `<div class="rc-wknav">
        <div class="rc-wknav-center">
          <button class="rc-arrow" onclick="shiftRecapDate(-1)" ${atFirst ? 'disabled' : ''} aria-label="Previous night">‹</button>
          <span class="rc-wklabel">${dayLabel(recapDate)}</span>
          <button class="rc-arrow" onclick="shiftRecapDate(1)" ${atLast ? 'disabled' : ''} aria-label="Next night">›</button>
        </div>
        ${atLast ? '' : `<button class="rc-latest" onclick="recapToLatest()">Latest night →</button>`}
      </div>
      <div class="result-meta"><b>${dayLabel(recapDate, true)}</b> · ${games.length} game${games.length === 1 ? '' : 's'}${P ? ' · graded against our last pre-tip prices' : ' · not priced'}</div>
      ${tiles}
      ${body || '<div class="empty">Nothing final on this date.</div>'}`;
  }

  // ── Schedule ───────────────────────────────────────────────────────────
  // The unit is the date: the arrows step one night. Each side carries its own
  // spread and moneyline (the schedule standard); the total sits in the middle,
  // implied points in the detail. Lines are DraftKings' via ESPN, not ours.
  const regStart = () => (D.phases || []).find(p => p.key === 'reg')?.start || D.today;
  function nextGameDate() {
    const t = todayET();
    return D.dates.find(d => d >= t) || D.dates[D.dates.length - 1];
  }
  function setScheduleDate(d) { scheduleDate = d; renderSchedule(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  function shiftScheduleDate(n) {
    const i = D.dates.indexOf(scheduleDate) + n;
    if (i >= 0 && i < D.dates.length) setScheduleDate(D.dates[i]);
  }
  function gameRow(g) {
    const final = g.state === 'post', live = g.state === 'in';
    const aWin = final && g.away.score > g.home.score;
    const L = g.lines;
    const mid = final
      ? `<div class="sc-score">${g.away.score}–${g.home.score}</div><div class="sc-when">${typeTag(g.type)} ${esc(g.detail || 'Final')}</div>`
      : live
        ? `<div class="sc-score" style="color:var(--bad)">${g.away.score ?? 0}–${g.home.score ?? 0}</div><div class="sc-when"><span class="sc-live">LIVE</span> ${esc(g.detail)}</div>`
        : `<div class="sc-score">${gameTime(g.start)}</div><div class="sc-when">${typeTag(g.type)}${L?.total != null ? ` O/U ${L.total}` : ''}</div>`;
    // his side's line: the home spread from the feed, negated for the road team
    const line = (home) => {
      if (!L || final) return '';
      const sp = L.spread == null ? null : (home ? L.spread : -L.spread), ml = home ? L.mlHome : L.mlAway;
      return `<span class="sc-side-rec">${sp != null ? sgn(sp) : ''}${ml != null ? ` · ${odds(ml)}` : ''}</span>`;
    };
    const side = (t, end, won) => `<div class="sc-side${end ? ' end' : ''}">
        ${end ? '' : logoImg(t.ab, 'sc-logo')}
        <div class="sc-side-id">
          <span class="sc-side-ab"${won ? ' style="color:var(--accent)"' : ''}>${esc(t.ab)}</span>
          <span class="sc-side-rec">${esc(record(t.ab) || t.rec || '')}</span>
          ${line(end)}
        </div>
        ${end ? logoImg(t.ab, 'sc-logo') : ''}
      </div>`;
    // the game's top threes pick, best at 2+ (the schedule standard: a top pick on every game)
    const tp = (D.threes?.rows || []).filter(r => r.gid === g.id).sort((a, b) => b.p[1] - a.p[1])[0];
    const pick = tp ? `<div class="t3-pick" onclick="event.stopPropagation(); t3Set('game','${g.id}'); switchNav('threes')">
        <span class="t3-pick-lbl">Top threes</span>${logoImg(tp.team, 't3-logo')}<b>${esc(tp.name)}</b>
        <span class="t3-pick-od">2+ ${fairOdds(tp.p[1])} <small>${(tp.p[1] * 100).toFixed(0)}%</small></span></div>` : '';
    return `<div class="sc-game" data-gid="${g.id}" onclick="openGame('${g.id}')" role="button" tabindex="0">
      <div class="sc-top">
        ${side(g.away, false, aWin)}
        <div class="sc-mid">${mid}</div>
        ${side(g.home, true, final && !aWin)}
        <span class="sc-chev">▶</span>
      </div>
      ${pick}
    </div>`;
  }
  // ── The game card and the split view (/slate.js) ──────────────────────
  // Desktop: the night down the left, the picked game on the right; phone: a
  // pop-up. Either way it opens on the box score: every priced player, a column
  // per market, projection big with the even-money line and our fair odds under it.
  /** A game by id: off the schedule, or (opening night, past the schedule's ten days) off the boards. */
  function nbaGameOf(gid) {
    gid = String(gid);
    const s = D.schedule.find(g => g.id === gid); if (s) return s;
    const r = [...(D.stats?.boards?.pts?.rows || []), ...(D.threes?.rows || [])].find(x => x.gid === gid); if (!r) return null;
    const home = r.home ? r.team : r.opp, away = r.home ? r.opp : r.team;
    return { id: gid, start: r.start, date: new Date(r.start).toLocaleDateString('en-CA', { timeZone: 'America/New_York' }), type: 2, state: 'pre', home: { ab: home }, away: { ab: away }, lines: null };
  }
  const BX_NBA = [{ k: 'pts', lab: 'PTS', title: 'Points' }, { k: 'reb', lab: 'REB', title: 'Rebounds' }, { k: 'ast', lab: 'AST', title: 'Assists' },
    { k: '3pm', lab: '3PM', title: 'Made threes' }, { k: 'pra', lab: 'PRA', title: 'Points + rebounds + assists' }, { k: 'stl', lab: 'STL', title: 'Steals' },
    { k: 'blk', lab: 'BLK', title: 'Blocks' }, { k: 'dd', lab: 'DD', title: 'Double-double', yes: true }, { k: 'td', lab: 'TD', title: 'Triple-double', yes: true },
    { k: 'fb', lab: '1st', title: 'First basket', yes: true }];
  function nbaBox(g) {
    const P = new Map();
    const row = (r) => { if (!P.has(r.pid)) P.set(r.pid, { pid: r.pid, name: r.name, team: r.team, pos: r.pos, min: r.min, cells: {} }); return P.get(r.pid); };
    for (const k of ['pts', 'reb', 'ast', '3pm', 'pra', 'stl', 'blk']) for (const r of lcRows(k).filter(x => x.gid === g.id)) {
      const pmf = lcPmf(r, k), [lo, hi] = LC[k].range; let L = lo;
      for (let x = lo; x <= hi; x++) if (Math.abs(overAt(pmf, x) - 0.5) < Math.abs(overAt(pmf, L) - 0.5)) L = x;
      const p = overAt(pmf, L);
      row(r).cells[k] = { proj: r.mu, dp: 1, line: L, p, leg: bdLeg(k, r, L, p), open: `openLc('${k}','${r.pid}')` };
    }
    for (const r of (D.stats?.doubles || []).filter(x => x.gid === g.id))
      for (const m of ['dd', 'td']) if (r[m] != null) row(r).cells[m] = { p: r[m], leg: dblLeg(r, m), open: `openDoubleCard('${r.pid}')` };
    const fg = (D.first?.games || []).find(x => x.gid === g.id);
    for (const r of fg?.players || []) row(r).cells.fb = { p: r.p, leg: fbLeg(r, fg), open: `fbF.game='${g.id}';switchNav('first')` };
    const teams = [g.away.ab, g.home.ab].map(t => ({ abbr: t, logo: logoImg(t, ''), sub: esc(teamName(t)), groups: [{ name: 'Players', cols: BX_NBA,
      rows: [...P.values()].filter(r => r.team === t).sort((a, b) => (b.cells.pts?.proj ?? 0) - (a.cells.pts?.proj ?? 0))
        .map(r => ({ name: r.name, pos: r.pos, sub: r.min ? `${r.min.toFixed(0)} min` : '', face: faceHtml(r.pid, r.name), open: `openLc('pts','${r.pid}')`, cells: r.cells })) }] }));
    const done = g.state === 'post' || g.state === 'in';
    return RonSlate.box({ state: 'pre', teams,
      note: 'Our projection for every priced player, with the even-money line and our fair odds under it (DD, TD and 1st are yes/no prices). Tap a number for its full ladder, a header to sort. In parlay mode a tap adds it to the slip.',
      empty: done ? 'This one tipped off before it was priced — box scores are graded from the regular season on.' : 'Prices post once the game is inside the build\'s window — usually a couple of days out.' });
  }
  function nbaGameHtml(g) {
    const L = g.lines, final = g.state === 'post', live = g.state === 'in';
    const side = (home) => {
      if (!L || final || live) return '';
      const sp = L.spread == null ? null : (home ? L.spread : -L.spread), ml = home ? L.mlHome : L.mlAway;
      return `<span class="sl-hodds"><b>${sp != null ? sgn(sp) : ''}</b><span>${ml != null ? odds(ml) : ''}</span></span>`;
    };
    const as = g.away.score, hs = g.home.score;
    const mid = final || live
      ? `<div class="gm-score"><span${as > hs ? ' class="win"' : ''}>${as ?? 0}</span><i>–</i><span${hs > as ? ' class="win"' : ''}>${hs ?? 0}</span></div>
         <div class="gm-when">${live ? `<b class="gm-live">${esc(g.detail || 'Live')}</b>` : esc(g.detail || 'Final')}</div>`
      : `${L?.total != null ? `<div class="gm-lines"><span>O/U ${L.total}</span></div>` : ''}<div class="gm-when">${typeTag(g.type)} ${dayLabel(g.date)} · ${gameTime(g.start)}</div>`;
    const deck = D.schedule.filter(x => x.date === g.date), at = deck.findIndex(x => x.id === g.id);
    return `<header class="gm-hero">
        <div class="gm-team">${logoImg(g.away.ab, '')}<b>${esc(g.away.ab)}</b>${side(false)}</div>
        <div class="gm-mid">${mid}<div class="gm-wx">${esc(g.venue || '')}${at >= 0 ? ` · ${at + 1} / ${deck.length}` : ''}</div></div>
        <div class="gm-team end">${side(true)}<b>${esc(g.home.ab)}</b>${logoImg(g.home.ab, '')}</div>
      </header>
      ${L?.impAway != null && !final ? `<div class="sl-facts">Implied <b>${esc(g.away.ab)} ${L.impAway}</b> · <b>${esc(g.home.ab)} ${L.impHome}</b>${L.book ? ` · ${esc(L.book)}` : ''}</div>` : ''}
      <div class="sub-tabs u-tabs"><button class="sub-btn active">Box score</button></div>
      ${nbaBox(g)}`;
  }
  let nbaGid = null;
  /** Open a game: in place in the split view, else as the pop-up (/modal.js). */
  function openGame(gid) {
    if (RonSlate.select(gid)) return;
    const g = nbaGameOf(gid); if (!g) return;
    nbaGid = g.id;
    const dlg = RonModal.open('gm-back', { cls: 'pm ydm gmm', nav: { prev: 'nbaGameStep(-1)', next: 'nbaGameStep(1)' }, onClose: () => { nbaGid = null; } });
    dlg.innerHTML = `<button class="pm-x" onclick="RonModal.close('gm-back')" aria-label="Close">×</button>` + nbaGameHtml(g);
    const deck = D.schedule.filter(x => x.date === g.date);
    RonModal.navState('gm-back', deck.findIndex(x => x.id === g.id), deck.length);
  }
  function nbaGameStep(d) {
    const g = nbaGameOf(nbaGid); if (!g) return;
    const deck = D.schedule.filter(x => x.date === g.date), nx = deck[deck.findIndex(x => x.id === g.id) + d];
    if (nx) openGame(nx.id);
  }
  RonSlate.onSort(() => { if (nbaGid && document.getElementById('gm-back')) openGame(nbaGid); });
  /** The split view's rail: the night's games, stacked like a scoreboard. */
  function nbaRail(games) {
    return [{ label: '', games: games.map(g => {
      const L = g.lines, final = g.state === 'post', live = g.state === 'in';
      const tp = (D.threes?.rows || []).filter(r => r.gid === g.id).sort((a, b) => b.p[1] - a.p[1])[0];
      const team = (t, home) => ({ abbr: t.ab, logo: logoImg(t.ab, ''), rec: esc(record(t.ab) || t.rec || ''),
        score: final || live ? t.score ?? 0 : null, lost: final && (home ? g.home.score < g.away.score : g.away.score < g.home.score),
        line: L?.spread == null ? '' : sgn(home ? L.spread : -L.spread), odds: L ? odds(home ? L.mlHome : L.mlAway) : '' });
      return { id: g.id, live,
        when: final ? esc(g.detail || 'Final') : live ? `Live · ${esc(g.detail || '')}` : `${g.type === 1 ? 'Pre · ' : ''}${gameTime(g.start)}`,
        note: !final && !live && L?.total != null ? `O/U ${L.total}` : '',
        teams: [team(g.away, false), team(g.home, true)],
        pick: tp ? `★ <b>${esc(tp.name)}</b> 2+ threes<span class="sl-od${tp.p[1] >= 0.5 ? ' fav' : ''}">${Odds.am(tp.p[1])}</span>` : '' };
    }) }];
  }
  function renderSchedule() {
    const el = dataGate('schedule-content'); if (!el) return;
    if (!D.dates.length) { el.innerHTML = `<div class="empty">No games in the next ten days. Opening night is ${dayLabel(regStart(), true)}.</div>`; return; }
    if (scheduleDate == null || !D.dates.includes(scheduleDate)) scheduleDate = nextGameDate();
    const i = D.dates.indexOf(scheduleDate), atFirst = i <= 0, atLast = i >= D.dates.length - 1;
    const games = D.schedule.filter(g => g.date === scheduleDate);
    const pre = games.filter(g => g.type === 1).length;
    const top = `<div class="rc-wknav">
        <div class="rc-wknav-center">
          <button class="rc-arrow" onclick="shiftScheduleDate(-1)" ${atFirst ? 'disabled' : ''} aria-label="Previous date">‹</button>
          <span class="rc-wklabel">${dayLabel(scheduleDate)}</span>
          <button class="rc-arrow" onclick="shiftScheduleDate(1)" ${atLast ? 'disabled' : ''} aria-label="Next date">›</button>
        </div>

        const row = { ...r, L, pAt: overAt(pmf, L) };
        return sided ? parSideRow(row, nav, 'pAt') : row;
      });
    rows.sort(F.sort === 'odds' ? (a, b) => b.pAt - a.pAt : (a, b) => b.mu - a.mu);
    rows.forEach((r, i) => { r.rank = i + 1; });
    return rows;
  }
  // ── Parlay legs (the slip itself is /parlay.js) ──
  /** A line-board leg; the line is in the key, so o1.5 and o2.5 replace each other. A board row carries its tool's side (parSideRow). */
  const bdLeg = (kind, r, L, p) => parSideTag({ k: `${kind}|${r.pid}|${L}`, n: r.name, t: r.team, g: parGame(r), m: kind, s: `Over ${L} ${LC[kind].unit}`, p, i: r.pid, L }, r.side, false);
  const BD_TOOL = (kind) => Object.keys(BD).find(nav => BD[nav].tabs.some(([k]) => k === kind)) || kind;
  const dblLeg = (r, m, side = 'over') => parSideLeg({ k: `${m}|${r.pid}`, n: r.name, t: r.team, g: parGame(r), m, s: m === 'td' ? 'Triple-double' : 'Double-double', p: r[m], i: r.pid }, side, true);
  const fbLeg = (r, g) => ({ k: `fb|${r.pid}`, n: r.name, t: r.team, g: `${g.away}@${g.home}`, m: 'fb', s: 'First basket', p: r.p, i: r.pid });
  function renderBoard(nav) {

    const changed = (F.line !== 'auto') + (F.pos !== 'ALL') + (F.game !== 'all') + (F.sort !== 'proj');

      ['Sort', [['proj', 'Projection'], ['odds', 'Shortest price']].map(([v, l]) => uiChip(set, 'sort', v, l, F.sort)).join('')],
    ], changed) + uiSearch(nav + '-search', set, F.q, 'Search a player, team or position…');
    const meta = `<div class="result-meta"><b>${dayLabel(src.date, true)}</b> · ${rows.length} of ${lcRows(kind).length} players · ${esc(C.unit)} · fair odds, no vig</div>` + uiView(set, F.view, parSideToggleHtml(nav, false, `renderBoard('${nav}')`));
    if (!rows.length) { el.innerHTML = tabs + controls + meta + '<div class="empty">Nothing matches that filter.</div>'; return; }
    const open = (r) => `openBoardCard('${nav}','${r.pid}')`;
    const started = (r) => new Date(r.start) <= new Date();
    const f = (r) => r.f || {};
    let body;
    if (F.view === 'table') {
      body = `<div class="rc-tablewrap"><table class="rc-table">
        <thead><tr><th></th><th>Player</th><th>Game</th><th class="num">Proj</th><th class="num">Min</th><th class="num">${kind === '3pm' ? '3PA/g' : 'L10'}</th><th class="num">Opp</th><th class="num">Line</th><th class="num">Price</th></tr></thead>
        <tbody>${rows.map(r => `
          <tr onclick="${open(r)}"${started(r) ? ' class="dim"' : ''}${parAttr(bdLeg(kind, r, r.L, r.pAt))}>
            <td class="num dim">${r.rank}</td>

            <td class="dim">${esc(r.team)} ${r.home ? 'vs' : '@'} ${esc(r.opp)}</td>

            <td class="num dim">${r.min.toFixed(1)}</td>
            <td class="num dim">${(kind === '3pm' ? f(r).tpa : f(r).l10) ?? '—'}</td>
            <td class="num dim">×${(f(r).opp ?? 1).toFixed(2)}</td>
            <td class="num dim">${parSideLine(r)}</td>
            <td class="num"><b>${Odds.inline(r.pAt)}</b></td>
          </tr>`).join('')}</tbody></table></div>`;
    } else if (F.view === 'compact') {
      body = `<div class="rc-compact">${rows.map(r => `
        <div class="rc-crow" onclick="${open(r)}"${parAttr(bdLeg(kind, r, r.L, r.pAt))}>
          <span class="rc-crank">${r.rank}</span>
          <span class="rc-cnm">${esc(r.name)}</span>

  function openBoardCard(nav, pid) {

  }
  const renderThrees = () => renderBoard('threes');

  // ── Double & triple-doubles ────────────────────────────────────────────
  // Points, rebounds and assists barely move together once minutes are known
  // (residual r <= .07), so each is priced at the 10 line over his minutes with
  // a shared "big night" factor (pace, overtime), then blended with his own
  // last-40 rate — the reliable rebounders are steadier than rates alone say.
  // Kalshi overpriced triple-doubles last season (11.4% mid vs 8.2% hit).
  const dblF = { open: false, sort: 'dd', game: 'all', q: '', view: 'cards' };
  function setDblF(k, v, typing) {
    dblF[k] = v; renderDoubles();
    if (typing) { const i = document.getElementById('doubles-search'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }
  }
  function dblRows() {
    const rows = (D.stats?.doubles || []).filter(r => (dblF.game === 'all' || r.gid === dblF.game) && matchQ(r, dblF.q)).slice().sort((a, b) => b[dblF.sort] - a[dblF.sort]);
    rows.forEach((r, i) => { r.rank = i + 1; });
    return rows;
  }
  function renderDoubles() {
    const el = dataGate('doubles-content'); if (!el) return;
    const R0 = D.stats?.doubles;
    if (!R0?.length) { el.innerHTML = '<div class="empty">No slate to price yet — the board fills in once the next games have lines.</div>'; return; }
    const games = [...new Map(R0.map(r => [r.gid, r])).values()].sort((a, b) => a.start.localeCompare(b.start));
    if (dblF.game !== 'all' && !games.some(g => g.gid === dblF.game)) dblF.game = 'all';
    const rows = dblRows(), td = dblF.sort === 'td';
    RonShare.set('setDblF', () => {
      const no = parSideGet('doubles') === 'under';
      return { title: `${no ? 'No ' : ''}${td ? 'Triple-double' : 'Double-double'}`, sub: dayLabel(D.stats.date, true),
        rows: rows.map(r => shareRow(r, parSidePrice(r[dblF.sort], parSideGet('doubles')), '', `${r.pts} · ${r.reb} · ${r.ast} proj`)) };
    });
    const controls = uiFilters('setDblF', dblF.open, [
      ['Market', [['dd', 'Double-double'], ['td', 'Triple-double']].map(([v, l]) => uiChip('setDblF', 'sort', v, l, dblF.sort)).join('')],
      ['Game', [['all', 'All games'], ...games.map(g => [g.gid, `${g.home ? g.opp : g.team} @ ${g.home ? g.team : g.opp}`])].map(([v, l]) => uiChip('setDblF', 'game', v, l, dblF.game)).join('')],
    ], (dblF.sort !== 'dd') + (dblF.game !== 'all')) + uiSearch('doubles-search', 'setDblF', dblF.q, 'Search a player, team or position…');
    const meta = `<div class="result-meta"><b>${dayLabel(D.stats.date, true)}</b> · ${rows.length} of ${R0.length} players · ${td ? 'triple' : 'double'}-double · fair odds, no vig</div>` + uiView('setDblF', dblF.view, parSideToggleHtml('doubles', true, 'renderDoubles()'));

        <thead><tr><th></th><th>Player</th><th>Game</th><th class="num">Pts</th><th class="num">Reb</th><th class="num">Ast</th><th class="num">Last ${R0[0].l40 || 40}</th><th class="num">DD</th><th class="num">TD</th></tr></thead>
        <tbody>${rows.map(r => `
          <tr onclick="${open(r)}"${started(r) ? ' class="dim"' : ''}${parAttr(dblLeg(r, dblF.sort, side))}>
            <td class="num dim">${r.rank}</td>
            <td><b>${esc(r.name)}</b> <span class="dim">${esc(r.pos || '')}</span></td>
            <td class="dim">${esc(r.team)} ${r.home ? 'vs' : '@'} ${esc(r.opp)}</td>
            <td class="num">${r.pts}</td><td class="num">${r.reb}</td><td class="num">${r.ast}</td>
            <td class="num dim">${r.dd40} DD · ${r.td40} TD</td>
            <td class="num"><b>${Odds.inline(parSidePrice(r.dd, side))}</b></td><td class="num"><b>${Odds.inline(parSidePrice(r.td, side))}</b></td>

  /** A player's card on the three the double-double is built from, stepping the board as shown. */
  function openDoubleCard(pid) { openLc('pts', pid, dblRows(), 9.5); }

  // ── First basket ───────────────────────────────────────────────────────
  // Who scores the game's first made field goal. The tip decides the team (its
  // winner scores first ~64%, before the line), the line adds the better offense,
  // and within a team it's each starter's own first-basket record, shrunk to his
  // position (centres score first most — the opening set, the putback). Starters
  // are projected until lineups post. research/nba_firstbasket2.py: calibrated
  // over 7,200 games walk-forward.
  const fbF = { open: false, game: 'all', q: '', view: 'cards' };
  function setFbF(k, v, typing) {
    fbF[k] = v; renderFirst();
    if (typing) { const i = document.getElementById('first-search'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }
  }
  function renderFirst() {
    const el = dataGate('first-content'); if (!el) return;
    const B = D.first;
    if (!B || !B.games?.length) { el.innerHTML = '<div class="empty">No slate to price yet — first basket fills in once the next games have lines.</div>'; return; }
    const games = [...B.games].sort((a, b) => a.start.localeCompare(b.start));
    const started = (g) => new Date(g.start) <= new Date();
    const pl = (r, g) => `<div class="fb-pl${r.jumper ? ' fb-jump' : ''}"${parAttr(fbLeg(r, g))}>

        <div class="fb-id"><div class="rc-name">${esc(r.name)} ${posBadge(r.pos)}${r.jumper ? ' <span class="fb-tag" title="Projected to take the opening tip">TIP</span>' : ''}</div>
          <div class="rc-sub">${logoImg(r.team, 't3-logo')} ${esc(r.team)} · ${r.fb} first baskets in ${r.starts} starts</div></div>

    const gameCard = (g) => {

          <span>Scores first: <b>${esc(g.away)}</b> ${Math.round((1 - hp) * 100)}% · <b>${esc(g.home)}</b> ${Math.round(hp * 100)}%</span>
        </div>
        <div class="fb-bar"><i style="width:${(1 - hp) * 100}%"></i></div>
        <div class="fb-list">${g.players.map(r => pl(r, g)).join('')}</div>
      </div>`;
    };
    if (fbF.game !== 'all' && !games.some(g => g.gid === fbF.game)) fbF.game = 'all';
    const shown = games.filter(g => fbF.game === 'all' || g.gid === fbF.game);
    const all = shown.flatMap(g => g.players.map(r => ({ ...r, g, opp: r.team === g.home ? g.away : g.home, home: r.team === g.home })))
      .filter(r => matchQ(r, fbF.q)).sort((a, b) => b.p - a.p);
    RonShare.set('setFbF', () => ({ title: 'First basket', sub: dayLabel(B.date, true), rows: all.map(r => shareRow(r, r.p, '', r.jumper ? 'takes the tip' : '')) }));
    const controls = uiFilters('setFbF', fbF.open, [
      ['Game', [['all', 'All games'], ...games.map(g => [g.gid, `${g.away} @ ${g.home}`])].map(([v, l]) => uiChip('setFbF', 'game', v, l, fbF.game)).join('')],
    ], fbF.game !== 'all') + uiSearch('first-search', 'setFbF', fbF.q, 'Search a player, team or position…');
    const meta = `<div class="result-meta"><b>${dayLabel(B.date, true)}</b> · ${shown.length} game${shown.length === 1 ? '' : 's'} · first made field goal · fair odds, no vig · updated ${timeAgo(B.generated)}</div>` + uiView('setFbF', fbF.view);
    let body;
    if (fbF.view === 'table') {
      body = `<div class="rc-tablewrap"><table class="rc-table">
        <thead><tr><th></th><th>Player</th><th>Game</th><th class="num">First baskets</th><th class="num">Team first</th><th class="num">Chance</th><th class="num">Price</th></tr></thead>
        <tbody>${all.map((r, i) => `<tr${parAttr(fbLeg(r, r.g))}>
          <td class="num dim">${i + 1}</td><td><b>${esc(r.name)}</b> <span class="dim">${esc(r.pos || '')}${r.jumper ? ' · tip' : ''}</span></td>
          <td class="dim">${esc(r.team)} ${r.home ? 'vs' : '@'} ${esc(r.opp)}</td>
          <td class="num dim">${r.fb} in ${r.starts}</td>
          <td class="num dim">${Math.round((r.home ? r.g.pHomeFirst : 1 - r.g.pHomeFirst) * 100)}%</td>
          <td class="num">${(r.p * 100).toFixed(1)}%</td><td class="num"><b>${fairOdds(r.p)}</b></td></tr>`).join('')}</tbody></table></div>`;

        <div class="rc-crow"${parAttr(fbLeg(r, r.g))}><span class="rc-crank">${i + 1}</span><span class="rc-cnm">${esc(r.name)}</span><span class="rc-cteam">${esc(r.team)}</span>
          <span class="rc-cproj">${(r.p * 100).toFixed(1)}%</span><span class="rc-cod">${fairOdds(r.p)}</span><span class="rc-cline">${r.jumper ? 'tip' : ''}</span></div>`).join('')}</div>`;
    } else {
      const byGame = shown.map(g => ({ ...g, players: g.players.filter(r => matchQ({ ...r, opp: r.team === g.home ? g.away : g.home }, fbF.q)) })).filter(g => g.players.length);
      body = `<div class="fb-games">${byGame.map(gameCard).join('') || '<div class="empty">Nothing matches that filter.</div>'}</div>`;

      <div class="t3-note"><b>Starters are projected</b> until lineups post (~30 minutes before tip): the five who've started most of his team's last ten. If a projected starter sits, his price doesn't apply. The tip winner's team scores first about 64% of the time; the betting line adds the better offense; within a team it's his own first-basket record, pulled toward his position's. Check whether a book settles on the first <i>basket</i> or the first <i>points</i> — about 8% of games start with a free throw.</div>`;
  }

  // ── Home ───────────────────────────────────────────────────────────────
  // ── Watch lists: Due, Milestones, Birthdays (scripts/nba-fun.js) ────────
  // Ported from /nhl. For fun: each says in numbers that it isn't a signal.
  const hasLc = (kind, pid) => lcRows(kind).some(r => r.pid === String(pid));
  const LC_OF = { pts: 'pts', reb: 'reb', ast: 'ast', tpm: '3pm', stl: 'stl', blk: 'blk' };
  /** A player's ladder card for a stat, when tonight's board has him. */
  function funOpen(stat, pid) {
    if ((stat === 'dd' || stat === 'td') && (D.stats?.doubles || []).some(r => r.pid === String(pid))) return openDoubleCard(pid);
    const k = LC_OF[stat] || 'pts';
    if (hasLc(k, pid)) openLc(k, pid);
  }

  // ── Due ────────────────────────────────────────────────────────────────
  // Droughts on tonight's board. research/nba_due.py graded every market by
  // drought length against the model's own walk-forward price: nobody is due.
  // First basket is dead even; threes and doubles run the other way (long
  // droughts hit LESS than priced). So the default order is the price.
  const dueF = { tab: 't1', open: false, sort: 'price', game: 'all', q: '' };
  function setDue(k, v, typing) {
    dueF[k] = v; renderDue();
    if (typing) { const i = document.getElementById('due-search'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }
  }
  const DUE_WORD = { t1: 'a made three', t3: '3+ threes', dd: 'a double-double', td: 'a triple-double', fb: 'a first basket' };
  const DUE_UNIT = (k) => k === 'fb' ? 'starts' : 'games';
  const DUE_NOTE = {
    t1: 'Graded against the threes model\'s own price over five seasons, long droughts hit <b>less</b> often than priced, never more: 72+ games without a three priced 11%, hit 1.3% — mostly players who\'ve stopped shooting them. A long drought here is a warning, not a tip.',
    t3: 'Graded against the threes model\'s own price over five seasons: 43+ games without three threes priced 7.7% and hit 6.0%. A dry spell doesn\'t make him due.',
    dd: 'Graded against the double-double model\'s own price over five seasons, every drought length lands within about 10% of its price, the middle ones a little below. Nobody\'s due.',
    td: 'Graded over five seasons (583 triple-doubles): droughts hit at or below their price. Nobody\'s due.',
    fb: 'Dead even: 46+ starts without a first basket priced 7.0% and hit 7.7%, and the drought\'s slope is zero (t +0.6). The tip and his own record are the price; the drought adds nothing.',
  };
  function dueOpen(k, pid, gid) {
    if (k === 't1' || k === 't3') return openLc('3pm', pid, undefined, k === 't1' ? 0.5 : 2.5);
    if (k === 'dd' || k === 'td') return openDoubleCard(pid);
    fbF.game = gid; switchNav('first');
  }
  function renderDue() {
    const el = dataGate('due-content'); if (!el) return;
    const F = D.fun, M = F?.dueMarkets || {};
    if (!F) { el.innerHTML = '<div class="empty">The watch lists fill in with the next build.</div>'; return; }
    const all = F.due?.[dueF.tab] || [];
    const games = [...new Map(Object.values(F.due || {}).flat().map(r => [r.gid, r])).values()];
    if (dueF.game !== 'all' && !games.some(g => g.gid === dueF.game)) dueF.game = 'all';
    const tabs = uiTabs('setDue', dueF.tab, Object.entries(M));
    const controls = uiFilters('setDue', dueF.open, [
      ['Sort', [['price', 'Tonight\'s price'], ['since', `${DUE_UNIT(dueF.tab) === 'starts' ? 'Starts' : 'Games'} since`], ['odds', 'Longest odds']].map(([v, l]) => uiChip('setDue', 'sort', v, l, dueF.sort)).join('')],
      ['Game', [['all', 'All games'], ...games.map(g => [g.gid, g.home ? `${g.opp} @ ${g.team}` : `${g.team} @ ${g.opp}`])].map(([v, l]) => uiChip('setDue', 'game', v, l, dueF.game)).join('')],
    ], (dueF.sort !== 'price') + (dueF.game !== 'all')) + uiSearch('due-search', 'setDue', dueF.q, 'Search a player, team or position…');
    // how unlikely a dry spell this long is at tonight's price: 1 in 1 / (1 - p)^n
    const dry = (r) => Math.pow(1 - r.p, r.n);
    const rows = all.filter(r => (dueF.game === 'all' || r.gid === dueF.game) && matchQ(r, dueF.q)).slice()
      .sort({ price: (a, b) => b.p - a.p, since: (a, b) => b.n - a.n || b.p - a.p, odds: (a, b) => dry(a) - dry(b) }[dueF.sort]);

    const meta = `<div class="result-meta"><b>${D.stats?.date ? dayLabel(D.stats.date, true) : ''}</b> · ${rows.length} player${rows.length === 1 ? '' : 's'} 3+ ${unit} without ${DUE_WORD[dueF.tab]}, and long enough that he'd have expected one · ${

          <div class="pb-line">${r.last ? `last: ${dayLabel(r.last)}` : ''} · a 1-in-${oneIn(r)} dry spell at tonight's price</div>

    el.innerHTML = tabs + controls + meta + (rows.length ? `<div class="pb-list">${cards}</div>` : `<div class="empty">Nobody on the board is in a ${M[dueF.tab]?.toLowerCase() || ''} drought${dueF.q || dueF.game !== 'all' ? ' that matches' : ''}.</div>`)
      + `<div class="t3-note"><b>Is anyone due?</b> ${DUE_NOTE[dueF.tab]}</div>`;
  }

  // ── Milestones ─────────────────────────────────────────────────────────
  // Regular-season career totals vs the next round number: ESPN's career line
  // through last season plus this season's games. A watch list, not a signal.
  const msF = { tab: 'watch', open: false, stat: 'all' };
  function setMs(k, v) { msF[k] = v; renderMilestones(); }
  const MS_UNIT = { pts: 'points', reb: 'rebounds', ast: 'assists', tpm: 'threes', stl: 'steals', blk: 'blocks', dd: 'double-doubles', td: 'triple-doubles', gp: 'games' };
  const MS_WORD = { pts: 'point', reb: 'rebound', ast: 'assist', tpm: 'three', stl: 'steal', blk: 'block', dd: 'double-double', td: 'triple-double', gp: 'game' };
  const ordinal = (n) => { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n.toLocaleString() + (s[(v - 20) % 10] || s[v] || s[0]); };
  function renderMilestones() {
    const el = dataGate('milestones-content'); if (!el) return;
    const F = D.fun;
    if (!F) { el.innerHTML = '<div class="empty">The watch lists fill in with the next build.</div>'; return; }
    const R = F.rungs || {};
    const tabs = uiTabs('setMs', msF.tab, [['watch', 'Watch list'], ['results', 'Results']]);
    const controls = uiFilters('setMs', msF.open, [
      ['Stat', [['all', 'All'], ...Object.entries(R).map(([k, v]) => [k, v.label])].map(([v, l]) => uiChip('setMs', 'stat', v, l, msF.stat)).join('')],
    ], +(msF.stat !== 'all'));
    const keep = (m) => msF.stat === 'all' || m.stat === msF.stat;
    if (msF.tab === 'results') { el.innerHTML = tabs + controls + msResults(F, keep); return; }
    const ms = (F.milestones || []).filter(keep);
    const r0 = R[msF.stat];
    const meta = `<div class="result-meta">Regular-season career totals vs the next round number${r0 ? ` — every ${r0.every.toLocaleString()}, within ${r0.within}` : ''} · ${ms.length} chase${ms.length === 1 ? '' : 's'} · <b>a watch list, not a signal</b></div>`;
    // tonight's projection for the stat being chased, where the board has one
    const projOf = (m) => {
      if (m.stat === 'dd' || m.stat === 'td') { const r = (D.stats?.doubles || []).find(x => x.pid === String(m.pid)); return r ? `<b class="due-od">${Odds.inline(r[m.stat])}</b> tonight` : ''; }
      const k = LC_OF[m.stat]; if (!k) return '';

    };
    const cards = ms.slice(0, 80).map((m, i) => {

          <div class="pb-line">${logoImg(m.team, 'pb-logo')} ${esc(m.team)} · <b>${m.career.toLocaleString()}</b> career ${MS_UNIT[m.stat]}${t ? ` · ${t}` : ''}</div>
        </div>

    }).join('');
    el.innerHTML = tabs + controls + meta + (ms.length ? `<div class="pb-list">${cards}</div>` : '<div class="empty">No chases within reach.</div>');
  }
  /** Results: milestones reached this season, the night they happen (the build logs each one). */
  function msResults(F, keep) {

  // ── Birthdays ──────────────────────────────────────────────────────────

  const bdayF = { tab: 'board' };

  function renderBirthdays() {
    const el = dataGate('birthdays-content'); if (!el) return;

    // `off` is days from the build's date; recompute against the reader's today so a page left open overnight stays right
    const t0 = Date.parse(todayET() + 'T00:00:00Z') / 864e5;
    const off = (b) => Date.parse(b.day + 'T00:00:00Z') / 864e5 - t0;
    const offLbl = (o) => o === 0 ? 'today' : o === 1 ? 'tomorrow' : o === -1 ? 'yesterday' : o > 0 ? `in ${o} days` : `${-o} days ago`;

      ${ahead.length ? `<div class="bd-sec">Coming up<span>${ahead.length}</span></div><div class="bd-list">${ahead.map(card).join('')}</div>` : ''}
      ${past.length ? `<div class="bd-sec">Just had one<span>${past.length}</span></div><div class="bd-list">${past.map(card).join('')}</div>` : ''}`;

  /** Results: this week's birthday games once played, then whether any of it matters. */
  function bdayResults(F, list) {

  function renderHome() {
    const el = dataGate('home-content'); if (!el) return;
    const card = (nav, title, link, body, empty) =>
      `<div class="hm-card"${nav ? ` onclick="switchNav('${nav}')"` : ''}>

        ${body || `<div class="hm-subtle">${empty}</div>`}
      </div>`;

    // ── Opening-night countdown, until the first regular-season tip ───────
    const opener = regStart();
    const days = Math.ceil((new Date(opener + 'T23:30:00Z') - Date.now()) / 86400000);
    const openers = D.schedule.filter(g => g.date === opener && g.type === 2);
    const countdown = days >= 0 ? `<div class="cd">
        <span class="cd-n">${days}</span>

      </div>` : '';

    // ── Last night ─────────────────────────────────────────────────────────

    const last = lastNight ? D.recap.filter(g => g.date === lastNight) : [];
    const top = last.flatMap(g => [g.away, g.home].map(x => x.leaders?.points && { ...x.leaders.points, team: x.ab }).filter(Boolean))
      .sort((a, b) => (+b.v || 0) - (+a.v || 0)).slice(0, 4);
    const totalPts = last.reduce((n, g) => n + (g.away.score || 0) + (g.home.score || 0), 0);
    const lastNightCard = last.length ? `

        <div class="hm-tile"><b>${(totalPts / last.length).toFixed(0)}</b><span>Points / Game</span></div>
        <div class="hm-tile"><b>${top[0] ? esc(top[0].v) : '—'}</b><span>Top Scorer</span></div>
      </div>
      <div class="hm-chips">${top.map(m => `<span class="hm-chip">${esc(m.name)} ${esc(m.v)}</span>`).join('')}</div>` : '';

    // ── Next slate ─────────────────────────────────────────────────────────
    const nd = nextGameDate();
    const next = nd ? D.schedule.filter(g => g.date === nd) : [];
    const gameRows = next.slice(0, 6).map(g => `
      <div class="hm-row">
        ${logoImg(g.away.ab, 'hm-glogo')}
        <span class="hm-name hm-matchup">${esc(g.away.ab)} <span class="hm-at">@</span> ${esc(g.home.ab)}${g.lines?.detail ? ` <span class="hm-subtle">${esc(g.lines.detail)} · O/U ${g.lines.total}</span>` : g.type === 1 ? ' <span class="hm-subtle">preseason</span>' : ''}</span>
        ${logoImg(g.home.ab, 'hm-glogo')}
        <span class="hm-score" style="font-size:0.84rem;color:var(--muted)">${gameTime(g.start)}</span></div>`).join('');

    // ── One leaderboard, like the other apps' home pages — the full set lives on Stats ──
    const leaders = [...(D.leaders || [])].sort((a, b) => b.pts - a.pts).slice(0, 5).map((r, i) => `
      <div class="hm-row"><span class="hm-subtle" style="width:0.9rem">${i + 1}</span>
        ${faceHtml(r.pid, r.name, 'hm-photo')}
        <span class="hm-name">${esc(r.name)}<span class="hm-subtle">${esc(r.pos || '')} ${esc(r.team)} · ${r.reb.toFixed(1)} reb · ${r.ast.toFixed(1)} ast · ${r.tpm.toFixed(1)} 3pm</span></span>
        <span class="hm-score hot">${r.pts.toFixed(1)}<span class="hm-subtle" style="font-size:0.766rem"> PPG</span></span></div>`).join('');

    // ── The tools: the top of tonight's boards (as /nhl's home) ──────────
    const bet = (L, p) => `<span class="hm-score hm-bet"><small>${L}</small><b class="${p >= 0.5 ? 'odfav' : 'oddog'}">${Odds.inline(p)}</b></span>`;
    // his line closest to even, as the boards' "best line"
    const evenLine = (r, kind) => { const pmf = lcPmf(r, kind), [lo, hi] = LC[kind].range; let L = lo;
      for (let x = lo; x <= hi; x++) if (Math.abs(overAt(pmf, x) - 0.5) < Math.abs(overAt(pmf, L) - 0.5)) L = x; return [L, overAt(pmf, L)]; };
    const boardHome = (kind, nav, word) => [...lcRows(kind)].sort((a, b) => b.mu - a.mu).slice(0, 3).map(r => {
      const [L, p] = evenLine(r, kind);
      return `<div class="hm-row">
        ${faceHtml(r.pid, r.name, 'hm-photo')}
        <span class="hm-name">${esc(r.name)}<span class="hm-subtle">${esc(r.team)} ${r.home ? 'vs' : '@'} ${esc(r.opp)} · proj ${r.mu.toFixed(1)} ${word}</span></span>
        ${bet('o' + L, p)}</div>`;
    }).join('');
    const t3Home = boardHome('3pm', 'threes', '3PM'), ptHome = boardHome('pts', 'points', 'pts'), stkHome = boardHome('stk', 'stocks', 'stl+blk');
    const fbHome = (D.first?.games || []).flatMap(g => g.players.map(x => ({ ...x, g }))).sort((a, b) => b.p - a.p).slice(0, 3).map(x => `
      <div class="hm-row" onclick="event.stopPropagation(); fbF.game = '${x.g.gid}'; switchNav('first')">
        ${faceHtml(x.pid, x.name, 'hm-photo')}
        <span class="hm-name">${esc(x.name)}<span class="hm-subtle">${esc(x.team)} ${x.team === x.g.home ? 'vs' : '@'} ${esc(x.team === x.g.home ? x.g.away : x.g.home)}${x.jumper ? ' · takes the tip' : ''}</span></span>
        ${bet('1st', x.p)}</div>`).join('');
    const dblHome = [...(D.stats?.doubles || [])].sort((a, b) => b.dd - a.dd).slice(0, 3).map(r => `
      <div class="hm-row">
        ${faceHtml(r.pid, r.name, 'hm-photo')}
        <span class="hm-name">${esc(r.name)}<span class="hm-subtle">${esc(r.team)} ${r.home ? 'vs' : '@'} ${esc(r.opp)} · ${r.pts} · ${r.reb} · ${r.ast} proj</span></span>
        ${bet('DD', r.dd)}</div>`).join('');
    const slate = (b) => b?.date ? ` · ${dayLabel(b.date)}` : '';
    const soon = 'The board fills in once the slate is set.';

    // ── Watch lists: Due, Milestones, Birthdays ──────────────────────────
    const FUN = D.fun || {};
    const dueHome = (FUN.due?.t1 || []).slice(0, 3).map(r => `
      <div class="hm-row">
        ${faceHtml(r.pid, r.name, 'hm-photo')}
        <span class="hm-name">${esc(r.name)}<span class="hm-subtle">${esc(r.team)} · no three since ${r.last ? dayLabel(r.last) : '—'} · ${Odds.inline(r.p)}</span></span>
        <span class="hm-score warm">${r.n}<span class="hm-subtle" style="font-size:0.766rem"> gms</span></span></div>`).join('');
    const msHome = (FUN.milestones || []).slice(0, 3).map(m => `
      <div class="hm-row" onclick="event.stopPropagation(); switchNav('milestones')">
        ${faceHtml(m.pid, m.name, 'hm-photo')}
        <span class="hm-name">${esc(m.name)}<span class="hm-subtle">${esc(m.team)} · ${m.career.toLocaleString()} career ${MS_UNIT[m.stat]}</span></span>
        <span class="hm-score hot">${m.away}<span class="hm-subtle" style="font-size:0.766rem"> from ${m.next.toLocaleString()}</span></span></div>`).join('');
    const bdT0 = Date.parse(todayET() + 'T00:00:00Z') / 864e5;
    const bdHome = (FUN.birthdays || []).map(b => ({ ...b, o: Date.parse(b.day + 'T00:00:00Z') / 864e5 - bdT0 }))
      .filter(b => b.o >= 0).slice(0, 3).map(b => `
      <div class="hm-row" onclick="event.stopPropagation(); switchNav('birthdays')">
        ${faceHtml(b.pid, b.name, 'hm-photo')}
        <span class="hm-name">${esc(b.name)}<span class="hm-subtle">${esc(b.team)} · turns ${b.turning}${b.game ? ' · game day' : ''}</span></span>
        <span class="hm-score ${b.o === 0 ? 'hot' : 'warm'}">${b.o === 0 ? 'today' : `${b.o}d`}</span></div>`).join('');
    const lead = esc(D.leadersFrom);
    el.innerHTML = countdown + `
      <div class="hm-cols">
        <div class="hm-col">
          ${card('recap', lastNight ? `${dayLabel(lastNight)} Recap` : 'Recap', 'Recap', lastNightCard, 'No games played yet.')}
          ${card('threes', `Threes${slate(D.threes)}`, 'Threes', t3Home, soon)}
          ${card('points', `Points${slate(D.stats)}`, 'Points', ptHome, soon)}
          ${card('stocks', `Steals &amp; Blocks${slate(D.stats)}`, 'Steals &amp; Blocks', stkHome, soon)}
          ${card('stats', `${lead} Leaders`, 'Stats', leaders, 'No leaders yet.')}
        </div>
        <div class="hm-col">
          ${card('schedule', nd ? `${dayLabel(nd)} · ${next.length} Game${next.length === 1 ? '' : 's'}` : 'Schedule', 'Schedule', gameRows, 'No games in the next ten days.')}
          ${card('first', `First Basket${slate(D.first)}`, 'First Basket', fbHome, soon)}
          ${card('doubles', `Double &amp; Triple-Doubles${slate(D.stats)}`, 'Doubles', dblHome, soon)}
          ${card('due', 'Due', 'Due', dueHome, 'Nobody on the board is in a drought.')}
          ${card('milestones', 'Milestone Watch 🏆', 'Milestones', msHome, 'No chases within reach.')}
          ${card('birthdays', 'Birthdays 🎂', 'Birthdays', bdHome, 'No birthdays this week.')}
        </div>
      </div>`;
  }

  document.addEventListener('DOMContentLoaded', () => { updateThemeToggleIcon(); applyRouteState(); loadNba(); });
</script>
<script src="/welcome.js?v=5" defer></script>
</body>
</html>
