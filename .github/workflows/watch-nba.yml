name: Watch nba lineups

# The pre-game window in one long run (scripts/pregame-watch.mjs): rebuild every 5 minutes from 90
# minutes before each tip through the last one, so prices carry confirmed starting fives. GitHub drops
# and delays scheduled runs, so several crons start it; one runs, the rest find nothing left to do.
# Public repo: Actions minutes are free. Times UTC (ET is UTC-4 until November, UTC-5 after).
on:
  schedule:
    - cron: '7 15,17,19 * * *'     # weekend afternoon tips (a window more than a run away just exits)
    - cron: '7 21,22,23 * * *'
    - cron: '7 0,1 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write      # the run hands on to the next (gh workflow run) when games outlast it
  issues: write        # build alerts (scripts/build-alert.sh)

concurrency:
  group: watch-nba
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Anything to build?
        id: gate
        run: node scripts/should-build.mjs nba schedule >> "$GITHUB_OUTPUT"

      - name: Rebuild through the pre-game window
        if: steps.gate.outputs.run == 'true'
        id: watch
        run: node scripts/pregame-watch.mjs nba

      - name: Hand on to the next run
        if: steps.watch.outputs.more == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # rate limit: a healthy chain hands on once per ~5.5h run; 3+ dispatched runs in 3 hours is a loop (11/02), so stop
        # and alert. Then retried: one GitHub 500 on the dispatch ended the chain (11/02).
        run: |
          n=$(gh run list --workflow watch-nba.yml --event workflow_dispatch --created ">=$(date -u -d '3 hours ago' +%FT%TZ)" --limit 50 --json databaseId --jq length)
          if [ "$n" -ge 3 ]; then echo "::error::$n dispatched watch-nba runs in 3 hours: refusing to hand on (loop guard)"; exit 1; fi
          for i in 1 2 3 4 5; do gh workflow run watch-nba.yml --ref main && exit 0; sleep 30; done; exit 1

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/build-alert.sh fail "nba lineup watch"
