name: Build nfl/data.json

on:
  schedule:
    # Daily baseline: 11:07 UTC ≈ 6-7am ET, after nflverse's overnight refresh
    # (snap counts, play-by-play) has landed.
    - cron: '7 11 * * *'
    # Game windows, hourly (all times UTC; ET is UTC-4 in-season, UTC-5 after
    # the November clock change). Each run re-logs the board for every game
    # not yet started — so a game keeps the last board before its kickoff,
    # inactives included — and grades any game ESPN has called final.
    #   Sunday: 1pm ET slate through Sunday Night Football's finish
    - cron: '7 12-23 * * 0'
    - cron: '7 0-5 * * 1'
    #   Thursday / Monday nights (and Saturday late season): pre-kick + finish
    - cron: '7 20-23 * * 1,4,6'
    - cron: '7 0-5 * * 2,5,0'
    #   Saturday afternoon games (December)
    - cron: '7 16-19 * * 6'
  workflow_dispatch: {}      # manual trigger from the Actions tab

permissions:
  contents: write

concurrency:
  group: build-nfl
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build nfl/data.json
        run: node scripts/build-nfl.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nfl/data.json nfl/results.json nfl/plays.json
          git diff --staged --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "Update nfl/data.json"
          # nfl/data.json is a whole-file regenerate — same replay-onto-main
          # strategy as build-data.yml so a racing push can't wedge a rebase.
          for attempt in 1 2 3 4 5; do
            if git push; then echo "Pushed on attempt $attempt"; exit 0; fi
            echo "Push rejected (attempt $attempt) — replaying onto latest main"
            git fetch origin main
            git reset FETCH_HEAD
            git add nfl/data.json nfl/results.json nfl/plays.json
            git diff --staged --quiet && { echo "Already current with main"; exit 0; }
            git commit -m "Update nfl/data.json"
          done
          echo "Failed to push after 5 attempts"; exit 1
