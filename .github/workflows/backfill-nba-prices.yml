name: Backfill NBA stat-board prices (one-off)

# The stat boards' Results need each night's pre-tip line, saved since Oct 31; this fills the earlier nights from
# nba/data.json's git history (scripts/nba-backfill-prices.mjs). Manual only. Delete once it has run.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-nba            # never alongside a build: both rewrite nba/prices-history.json
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0      # the whole history: each night's board is an old nba/data.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Backfill
        run: node scripts/nba-backfill-prices.mjs
      - name: Commit and push if changed
        run: bash scripts/commit-data.sh nba
