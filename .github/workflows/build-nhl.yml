name: Build nhl/data.json

on:
  schedule:
    # Hockey is a nightly sport, so the shape here is "morning baseline, then
    # hourly through the games" rather than the NFL's Sunday-shaped windows.
    # All times UTC; ET is UTC-4 until November, UTC-5 after.
    #   Morning: the night's finals are in, the schedule and standings are settled.
    - cron: '27 11 * * *'
    #   Pre-game: after morning skate and goalie news (~11:30am ET), mid-afternoon,
    #   and the last look before a 7pm puck. Boards freeze game by game at puck drop.
    - cron: '27 15,19,21 * * *'
    #   Game windows: 7pm ET first puck through the last western finish (~1:30am ET).
    - cron: '27 23 * * *'
    - cron: '27 0-6 * * *'
  workflow_dispatch: {}      # manual trigger from the Actions tab

permissions:
  contents: write
  issues: write        # build alerts (scripts/build-alert.sh)

concurrency:
  group: build-nhl
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to 26 on 2026-10-19
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Game days build on every tick; off days only the morning run; the
      # offseason only Monday mornings (scripts/should-build.mjs).
      - name: Anything to build?
        id: gate
        run: node scripts/should-build.mjs nhl ${{ github.event_name }} >> "$GITHUB_OUTPUT"

      - name: Build nhl/data.json
        if: steps.gate.outputs.run == 'true'
        run: node scripts/build-nhl.js

      - name: Commit and push if changed
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nhl/data.json nhl/news.json nhl/picks-history.json nhl/shots-history.json nhl/saves-history.json nhl/points-history.json nhl/players.json nhl/milestones-history.json nhl/phys-history.json
          git diff --staged --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "Update nhl/data.json"
          # nhl/data.json is a whole-file regenerate — same replay-onto-main
          # strategy as build-nfl.yml so a racing push can't wedge a rebase.
          for attempt in 1 2 3 4 5; do
            if git push; then echo "Pushed on attempt $attempt"; exit 0; fi
            echo "Push rejected (attempt $attempt) — replaying onto latest main"
            git fetch origin main
            git reset FETCH_HEAD
            git add nhl/data.json nhl/news.json nhl/picks-history.json nhl/shots-history.json nhl/saves-history.json nhl/points-history.json nhl/players.json nhl/milestones-history.json nhl/phys-history.json
            git diff --staged --quiet && { echo "Already current with main"; exit 0; }
            git commit -m "Update nhl/data.json"
          done
          echo "Failed to push after 5 attempts"; exit 1

      # One issue per failing build, closed by the next green run (scripts/build-alert.sh)
      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/build-alert.sh fail "nhl data"

      - name: Clear the alert
        if: success() && steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/build-alert.sh ok "nhl data"
