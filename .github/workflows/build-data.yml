name: Build data.json

on:
  schedule:
    # Hourly from 7am to 2am ET (no baseball 3-6am). Data commits no longer
    # redeploy the site (netlify.toml skips data-only commits; pages read data
    # from the repo), and the gate below skips runs on days without games.
    # Off-round minutes (:13) are less contended than :00/:30 on GitHub runners.
    - cron: '13 11-23,0-6 * * *'
  workflow_dispatch: {}      # lets us trigger it manually from the Actions tab

permissions:
  contents: write

# Serialize runs so two builds (e.g. a cron tick overlapping a manual trigger)
# can never race to push data.json to main — the classic "fetch first" rejection.
# cancel-in-progress:false lets the running build finish and push; the newer run
# queues and then checks out the just-pushed main, so it rebases cleanly.
concurrency:
  group: build-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Game days build on every tick; off days only the morning run; the
      # offseason only Monday mornings (scripts/should-build.mjs).
      - name: Anything to build?
        id: gate
        run: node scripts/should-build.mjs mlb ${{ github.event_name }} >> "$GITHUB_OUTPUT"

      - name: Build data.json
        if: steps.gate.outputs.run == 'true'
        run: node scripts/build-data.js

      - name: Commit and push if changed
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mlb/data.json mlb/news.json mlb/groups.json mlb/matchup-cards.json mlb/pitch-arsenal.json research/logs/mlb-slate mlb/sw.js
          git diff --staged --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "Update data.json"
          # main can move under us if a cron tick or a code push lands during the
          # ~3-min build. We only (re)generate WHOLE files — data.json,
          # matchup-cards.json, sw.js — so a rebase can't merge two full rewrites
          # and conflicts ("could not apply … Update data.json"). Instead, on
          # rejection, replay our freshly built files ON TOP of the latest main:
          # mixed-reset to it (keeping our built files in the worktree), re-stage
          # only the generated files, re-commit, retry. Ours wins by design —
          # this is a complete rebuild, and the
          # degraded-build guards abort bad builds before this step. Files we
          # didn't touch (index.html, etc.) stay at whatever latest main has.
          for attempt in 1 2 3 4 5; do
            if git push; then echo "Pushed on attempt $attempt"; exit 0; fi
            echo "Push rejected (attempt $attempt) — replaying generated files onto latest main"
            git fetch origin main
            # Mixed reset: HEAD + index move to latest main, but our freshly built
            # files stay in the working tree. Re-staging only the pure-DATA files
            # commits just those on top of main. sw.js is deliberately NOT replayed
            # here: it's stamped from index.html, so if a code push raced this
            # build, main already has the correct sw.js — replaying our stale copy
            # would revert it and desync sw.js from index.html. Keep main's.
            git reset FETCH_HEAD
            git add mlb/data.json mlb/news.json mlb/groups.json mlb/matchup-cards.json mlb/pitch-arsenal.json research/logs/mlb-slate
            git diff --staged --quiet && { echo "Already current with main"; exit 0; }
            git commit -m "Update data.json"
          done
          echo "Failed to push after 5 attempts"; exit 1
