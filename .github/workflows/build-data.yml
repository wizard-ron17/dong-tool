name: Build data.json

on:
  schedule:
    # Target: every 30 minutes around the clock.
    # GitHub's scheduler doesn't reliably fire comma-list entries (13,43 * * * *)
    # at both times — in practice only one fires per hour. Using separate cron
    # entries is more reliable: each is an independent trigger that GitHub tracks
    # individually, so a missed :13 doesn't prevent the :43 from running.
    # Off-round minutes (:13/:43) are less contended than :00/:30 on GH runners.
    - cron: '13 * * * *'
    - cron: '43 * * * *'
  workflow_dispatch: {}      # lets us trigger it manually from the Actions tab

permissions:
  contents: write

# Serialize runs so two builds (e.g. a cron tick overlapping a manual trigger)
# can never race to push data.json to main — the classic "fetch first" rejection.
# cancel-in-progress:false lets the running build finish and push; the newer run
# queues and then checks out the just-pushed main, so it rebases cleanly.
concurrency:
  group: build-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build data.json
        run: node scripts/build-data.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json matchup-cards.json pitch-arsenal.json sw.js
          git diff --staged --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "Update data.json"
          # main can move under us if a cron tick or a code push lands during the
          # ~3-min build. We only (re)generate WHOLE files — data.json,
          # matchup-cards.json, sw.js — so a rebase can't merge two full rewrites
          # and conflicts ("could not apply … Update data.json"). Instead, on
          # rejection, replay our freshly built files ON TOP of the latest main:
          # mixed-reset to it (keeping our built files in the worktree), re-stage
          # only the generated files, re-commit, retry. Ours wins by design —
          # this is a complete rebuild, and the
          # degraded-build guards abort bad builds before this step. Files we
          # didn't touch (index.html, etc.) stay at whatever latest main has.
          for attempt in 1 2 3 4 5; do
            if git push; then echo "Pushed on attempt $attempt"; exit 0; fi
            echo "Push rejected (attempt $attempt) — replaying generated files onto latest main"
            git fetch origin main
            # Mixed reset: HEAD + index move to latest main, but our freshly built
            # files stay in the working tree. Re-staging only the generated files
            # then commits JUST those on top of main — any code files main changed
            # (index.html, …) keep main's version, never our stale copy.
            git reset FETCH_HEAD
            git add data.json matchup-cards.json pitch-arsenal.json sw.js
            git diff --staged --quiet && { echo "Already current with main"; exit 0; }
            git commit -m "Update data.json"
          done
          echo "Failed to push after 5 attempts"; exit 1
