    {"nav": "shots", "g": "g1", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"8.5\"/><circle cx=\"12\" cy=\"12\" r=\"3.8\"/><path d=\"M12 1.5v3.5M12 19v3.5M1.5 12H5M19 12h3.5\"/></svg>", "name": "Shots", "desc": "Shots and shots on target for every player, priced at every line &mdash; his role, his shooting and the opponent."}
  ] });

  <div id="panel-home" class="panel visible"><div id="home-content"><div class="empty">Loading…</div></div></div>

<!-- Body level, beside their backdrops: inside .wrap (z-index 1) they paint under the blur. -->
<div class="nav-tools-menu" id="nav-tools-menu"></div>
<script>RonChrome.mount()</script>
<div class="nav-tools-backdrop" id="nav-tools-backdrop" onclick="closeNavTools()"></div>
<script>
  const APP_BASE = '/soccer';

  // ── Theme, sport switcher, tools menu: /chrome.js ─────────────────────────
  // ESPN ships a dark-background cut of every crest; repaint on the flip.
  RonChrome.onTheme(() => document.querySelectorAll('img[data-team]').forEach(img => { img.src = teamLogo(img.dataset.team); }));

  // ── Nav + routing ──────────────────────────────────────────────────────
  const SOC_NAVS = ['home', 'stats', 'recap', 'goals', 'shots', 'schedule'];   // tools added here as they ship
  const PAGE_TITLES = { home: "Ron's Goal Tool", stats: "Stats · Ron's Goal Tool", recap: "Recap · Ron's Goal Tool", goals: "Goals · Ron's Goal Tool", shots: "Shots · Ron's Goal Tool", schedule: "Schedule · Ron's Goal Tool" };
  let activeNav = 'home', applyingRoute = false;
  function switchNav(nav) {
    activeNav = nav;
    RonChrome.show(nav, { title: PAGE_TITLES[nav] });
    if (!applyingRoute) commitRoute();        // the address first: a panel that fails to draw mustn't strand the nav
    renderPanel(nav);
  }
  function currentPath() { return activeNav === 'home' ? APP_BASE + '/' : APP_BASE + '/' + activeNav; }
  function commitRoute() { const p = currentPath(); if (location.pathname !== p) history.pushState(null, '', p); }
  function parsePath() { const rel = location.pathname.startsWith(APP_BASE) ? location.pathname.slice(APP_BASE.length) : location.pathname; return rel.replace(/^\/+|\/+$/g, '').split('/')[0] || 'home'; }
  function applyRouteState() {
    applyingRoute = true;
    const nav = parsePath();
    switchNav(SOC_NAVS.includes(nav) ? nav : 'home');
    history.replaceState(history.state, '', currentPath());
    applyingRoute = false;
  }
  window.addEventListener('popstate', applyRouteState);

  function renderPanel(nav) {
    try { drawPanel(nav); }
    catch (e) {
      console.error(e);
      const el = document.getElementById(nav + '-content');
      if (el) el.innerHTML = `<div class="empty">Something on this page didn't draw (${esc(e.message)}). The data may be mid-update: <a href="javascript:void(0)" onclick="loadSoccer()">reload it</a>.</div>`;
    }
  }
  function drawPanel(nav) {
    if (nav === 'home') renderHome();
    else if (nav === 'stats') renderStats();
    else if (nav === 'recap') renderRecap();
    else if (nav === 'schedule') renderSchedule();
    else if (nav === 'goals') renderGoals();
    else if (nav === 'shots') renderShots();
  }

  // ── Data ───────────────────────────────────────────────────────────────
  let D = null, recapDate = null, scheduleDate = null;
  function timeAgo(iso) {
    const mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
    if (mins < 1)  return 'just now';
    if (mins < 60) return `${mins}m ago`;
    const hrs = Math.round(mins / 60);
    if (hrs < 24) return `${hrs}h ago`;
    return `${Math.round(hrs / 24)}d ago`;
  }
  function setStatus(type, text) {
    const labels = { fetching: 'Loading', error: 'Error' };
    const badge = document.getElementById('status-badge');
    badge.className = 'status-badge ' + type;
    badge.textContent = text ?? labels[type] ?? type;
  }
  // Coverage · volume · freshness, the same shape as the other sports' badges.
  function statusSummary(d) {
    const days = new Set((d.recap || []).map(g => g.date)).size;
    return `${days}d · ${(d.recap || []).length} gm · upd ${timeAgo(d.generated)}`;
  }
  async function loadSoccer() {
    setStatus('fetching');
    try {
      const r = await dataFetch('data.json', { cache: 'no-store' });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      D = await r.json();
      D.dates = [...new Set(D.schedule.map(g => g.date))].sort();
      HS = new Map((D.leaders || []).map(l => [l.pid, l.hs]));
      for (const r of D.goals?.rows || []) for (const k of ['sh', 'sot']) if (r[k] != null && !Array.isArray(r[k]?.pmf)) delete r[k];
      const el = document.getElementById('eyebrow-season');
      if (el && D.season) el.textContent = String(D.season).replace(/\s*MLS$/, '');
      setStatus('ready', statusSummary(D));
      RonChrome.fresh(D.generated, { starts: (D.schedule || []).filter(g => g.state !== 'post').map(g => g.start) });
    } catch (e) { D = 'error'; setStatus('error'); }
    renderPanel(activeNav);
    if (D && D !== 'error') socLiveStart();
  }
  function dataGate(id) {
    const el = document.getElementById(id); if (!el) return null;
    if (!D) { el.innerHTML = '<div class="empty">Loading…</div>'; return null; }
    if (D === 'error') { el.innerHTML = '<div class="empty">Couldn\'t load MLS data. <a href="javascript:void(0)" onclick="loadSoccer()">Retry</a></div>'; return null; }
    return el;
  }

  // ── Helpers ────────────────────────────────────────────────────────────
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  // ESPN labels each club's crests; the dark cut is the one for dark backgrounds.
  const teamLogo = (ab) => { const t = D?.teams?.[ab]; return (currentTheme() === 'dark' ? t?.logoDark : null) || t?.logo || ''; };
  const logoImg = (ab, cls) => `<img class="${cls}" data-team="${ab}" src="${teamLogo(ab)}" alt="${ab}" loading="lazy">`;
  const teamName = (ab) => D.teams?.[ab]?.name || ab;
  /** The table's W-D-L, else the feed's own record string (it's W-D-L too). */
  const record = (ab, fallback) => { const t = D.teams?.[ab]; return t && t.gp ? `${t.w}-${t.d}-${t.l}` : fallback || ''; };
  // Positions are categories, not ratings: their own hues, none from the good/bad ramp.
  const posBadge = (p) => p ? `<span class="posb p-${p}">${esc(p)}</span>` : '';
  /** ESPN's game positions (CD-L, CM-R, AM, CF-L…) to the four families; scripts/soccer-state.js posFam. */
  function posFam(p) {
    const x = String(p || '').toUpperCase().replace(/-[LR]$/, '');
    if (!x || x === 'SUB') return null;
    if (x === 'G' || x === 'GK') return 'GK';
    if (x === 'D' || /^(CD|CB|LB|RB|LWB|RWB|SW|DEF)$/.test(x)) return 'DEF';
    if (x === 'F' || /^(CF|ST|LW|RW|LF|RF|FW)$/.test(x)) return 'FWD';
    return 'MID';
  }
  const odds = (v) => v == null ? '' : (v > 0 ? '+' : '') + v;
  /** A date string the feed keys on (yyyy-mm-dd) as a label in the reader's words. */
  function dayLabel(ymd, long) {
    const d = new Date(ymd + 'T12:00:00Z');
    const opt = long ? { weekday: 'long', month: 'short', day: 'numeric' } : { weekday: 'short', month: 'short', day: 'numeric' };
    return new Intl.DateTimeFormat('en-US', { ...opt, timeZone: 'UTC' }).format(d);
  }
  /** Kickoff in the reader's own timezone — the feed publishes UTC. */
  const gameTime = (iso) => iso ? new Intl.DateTimeFormat('en-US', { hour: 'numeric', minute: '2-digit' }).format(new Date(iso)) : '';
  /** Today, on MLS's clock: the date keys are US Eastern. */
  /** A kickoff's date on the feed's clock (US Eastern), yyyy-mm-dd. */
  const etDay = (iso) => new Date(iso).toLocaleDateString('en-CA', { timeZone: 'America/New_York' });
  const todayET = () => new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
  // Who has an ESPN headshot (about half the league): the rest get initials without a known-404 request.
  let HS = new Map();
  function faceHtml(pid, name, hs, cls) {
    const ini = (name || '').split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
    if (!pid || !(hs ?? HS.get(String(pid)))) return `<div class="rc-photo rc-noface ${cls || ''}">${esc(ini)}</div>`;
    return `<img class="rc-photo ${cls || ''}" src="https://a.espncdn.com/i/headshots/soccer/players/full/${esc(pid)}.png" alt="" loading="lazy"
      onerror="this.outerHTML='&lt;div class=\\'rc-photo rc-noface ${cls || ''}\\'&gt;${esc(ini)}&lt;/div&gt;'">`;
  }
  const shortName = (n) => { const w = (n || '').split(' '); return w.length > 1 ? `${w[0][0]}. ${w.slice(1).join(' ')}` : n; };
  // Regular season says nothing; a playoff round says its name.
  const slugTag = (s) => !s || s === 'regular-season' ? '' : `<span class="sc-pre">${esc(s.replace(/-/g, ' ').toUpperCase())}</span>`;
  const minLbl = (x) => `${x.m}'${x.add ? `<small>+${x.add}</small>` : ''}`;
  /** Last five results, all competitions: ESPN sends newest first; drawn oldest first, latest on the right. */
  const formHtml = (f) => f ? `<span class="fm" title="Last five, all competitions — latest on the right">${[...f].reverse().map(c => `<i class="fm-${c}">${c}</i>`).join('')}</span>` : '';

  // ── Recap ──────────────────────────────────────────────────────────────
  // One day at a time: every goal in order (scorer, assist, the running score),
  // the team box, and who shot. data.json carries the goals and team box;
  // soccer/recap.json the per-player box, loaded the first time it's needed.
  let RX = null, rxState = 'idle';
  function loadRecapBox() {
    if (rxState !== 'idle') return;
    rxState = 'loading';
    dataFetch('recap.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : Promise.reject())
      .then(j => { RX = j; rxState = 'ready'; for (const g of Object.values(j.games || {})) for (const p of g.players) if (p[12]) HS.set(p[0], 1); })
      .catch(() => { rxState = 'error'; })
      .finally(() => { if (activeNav === 'recap') renderRecap(); if (activeNav === 'schedule') RonSlate.refresh(); if (socGid && document.getElementById('gm-back')) openGame(socGid); });
  }
  // [pid, name, team, gamePos, starter, min, g, a, sh, sot, yc, rc, headshot]
  const boxRows = (gid) => (RX?.games?.[gid]?.players || []).map(([pid, name, team, gpos, st, min, g, a, sh, sot, yc, rc, hs]) => ({ pid, name, team, gpos, st, min, g, a, sh, sot, yc, rc, hs }));
  const recapDates = () => [...new Set((D.recap || []).map(g => g.date))].sort();
  /** Match days in rounds: back-to-back days are one round (Saturday + Sunday); a midweek day stands alone. Keyed by the first day. */
  function recapRounds() {
    const out = [];
    for (const d of recapDates()) { const r = out[out.length - 1]; if (r && Date.parse(d) - Date.parse(r[r.length - 1]) <= 864e5) r.push(d); else out.push([d]); }
    return out;
  }
  const roundLabel = (r, long) => {
    if (r.length === 1) return dayLabel(r[0], long);
    const f = (d, o) => new Intl.DateTimeFormat('en-US', { ...o, timeZone: 'UTC' }).format(new Date(d + 'T12:00:00Z'));
    const a = r[0], b = r[r.length - 1], wd = { weekday: long ? 'long' : 'short' };
    return `${f(a, wd)}–${f(b, wd)}, ${f(a, { month: 'short', day: 'numeric' })}–${f(b, a.slice(0, 7) === b.slice(0, 7) ? { day: 'numeric' } : { month: 'short', day: 'numeric' })}`;
  };
  function setRecapDate(d) { recapDate = d; renderRecap(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  function shiftRecapDate(n) {
    const rs = recapRounds(), i = rs.findIndex(r => r[0] === recapDate) + n;
    if (i >= 0 && i < rs.length) setRecapDate(rs[i][0]);
  }
  function recapToLatest() { const rs = recapRounds(); setRecapDate(rs[rs.length - 1][0]); }
  /** One goal: the minute, who scored (an own goal is credited to the other side), the assist, the score after it (away–home). */
  function goalRow(x, G) {
    const own = x.kind === 'Own goal';
    const p = !own && G ? ghP(ghGame(G.date, G.id)?.[x.pid]) : null;     // our last price before kickoff
    const how = [own ? `own goal, for ${esc(x.team)}` : x.kind ? esc(x.kind.toLowerCase()) : '', x.ast ? `assist ${esc(shortName(x.ast.name))}` : ''].filter(Boolean).join(' · ');
    return `<div class="rx-row">
      <span class="gl-min">${minLbl(x)}</span>
      ${faceHtml(x.pid, x.name)}
      <div class="rx-info"><div class="rx-nm">${esc(x.name)} <span class="dim">${own ? '' : esc(x.team)}</span>${x.kind === 'Penalty' ? '<span class="gl-tag">PK</span>' : ''}</div>
        <div class="rx-sub">${how || 'goal'}</div></div>
      <div class="rx-right"><span class="gl-score">${x.a}–${x.h}</span>${p != null ? `<span class="rx-sub" title="Our last price before kickoff for him to score">we had ${Odds.am(p)}</span>` : ''}</div>
    </div>`;
  }
  /** The two sides' bar colours: the home side takes its alternate when the primaries are too alike (CLB black vs CIN navy). */
  function gameCols(G) {
    const rgb = (h) => (h || '#888888').match(/[0-9a-f]{2}/gi).map(x => parseInt(x, 16));
    const far = (a, b) => { const [x, y] = [rgb(a), rgb(b)]; return Math.hypot(x[0] - y[0], x[1] - y[1], x[2] - y[2]) > 120; };
    const a = D.teams?.[G.away.ab]?.color, h = D.teams?.[G.home.ab]?.color, h2 = D.teams?.[G.home.ab]?.alt;
    return { [G.away.ab]: a || '#8a94a6', [G.home.ab]: !a || !h || far(a, h) ? (h || '#8a94a6') : (h2 && far(a, h2) ? h2 : h) };
  }
  /** The two teams side by side (away left, as the score reads): shots, on target, possession, corners. */
  function teamStats(G) {
    const A = G.box?.[G.away.ab], H = G.box?.[G.home.ab]; if (!A || !H) return '<div class="rx-none">No team box.</div>';
    const C = gameCols(G), ca = C[G.away.ab], ch = C[G.home.ab];
    const row = (lbl, a, h, pct) => { const t = a + h || 1;
      return `<div class="ss-row"><b>${a}${pct ? '%' : ''}</b><div class="ss-mid">${lbl}<div class="ss-bar"><i style="width:${a / t * 100}%;background:${ca}"></i><i style="width:${h / t * 100}%;background:${ch}"></i></div></div><b>${h}${pct ? '%' : ''}</b></div>`; };
    return row('Shots', A.sh, H.sh) + row('On target', A.sot, H.sot) + row('Possession', Math.round(A.poss), Math.round(H.poss), true) + row('Corners', A.cor, H.cor);
  }
  function renderRecap() {
    const el = dataGate('recap-content'); if (!el) return;
    loadRecapBox(); loadGoalHist();
    const rs = recapRounds();
    if (!rs.length) { el.innerHTML = '<div class="empty">No games in the last four weeks.</div>'; return; }
    let i = rs.findIndex(r => r[0] === recapDate);
    if (i < 0) { i = rs.length - 1; recapDate = rs[i][0]; }
    const round = rs[i], atFirst = i <= 0, atLast = i >= rs.length - 1;
    const games = D.recap.filter(g => round.includes(g.date));
    // ── the day in numbers ──
    const goals = games.reduce((n, G) => n + G.home.score + G.away.score, 0);
    const shots = games.reduce((n, G) => n + Object.values(G.box || {}).reduce((m, b) => m + b.sh, 0), 0);
    const sot = games.reduce((n, G) => n + Object.values(G.box || {}).reduce((m, b) => m + b.sot, 0), 0);
    const by = {};
    for (const G of games) for (const x of G.goals) if (x.kind !== 'Own goal' && x.pid) (by[x.pid] ||= { name: x.name, n: 0 }).n++;
    const top = Object.values(by).sort((a, b) => b.n - a.n)[0];
    const picks = games.map(G => topPick({ ...G, state: 'post' })).filter(Boolean);
    const tiles = `<div class="hm-tiles rx-tiles">
      <div class="hm-tile"><b>${goals}</b><span>Goals · ${(goals / games.length).toFixed(1)} a game</span></div>
      <div class="hm-tile"><b>${sot}/${shots}</b><span>On target / shots</span></div>
      ${picks.length ? `<div class="hm-tile" title="Each game's shortest price to score, our last before kickoff"><b>${picks.filter(t => t.scored).length}/${picks.length}</b><span>Top picks scored · ${picks.reduce((a, t) => a + t.p, 0).toFixed(1)} expected</span></div>`
        : `<div class="hm-tile"><b>${top && top.n > 1 ? top.n : games.length}</b><span>${top && top.n > 1 ? `Goals · ${esc(shortName(top.name))}` : games.length === 1 ? 'Game' : 'Games'}</span></div>`}
    </div>`;
    const body = games.map((G, k) => {
      const aWin = G.away.score > G.home.score, hWin = G.home.score > G.away.score;
      const P = boxRows(G.id);
      const shooters = P.filter(p => p.sh > 0).sort((a, b) => b.sh - a.sh || b.sot - a.sot || b.g - a.g).slice(0, 6).map(p => `<div class="rx-row" onclick="openGame('${G.id}')">
          ${faceHtml(p.pid, p.name, p.hs)}
          <div class="rx-info"><div class="rx-nm">${esc(p.name)} <span class="dim">${esc(p.team)}</span></div>
            <div class="rx-sub">${posFam(p.gpos) || 'SUB'} · ${p.min}'${p.g ? ` · ${p.g === 1 ? 'scored' : p.g + ' goals'}` : ''}</div></div>
          <div class="rx-right"><span class="rx-stat">${p.sh}<small> sh</small></span><span class="rx-sub">${p.sot} on target</span>${(() => { const c = loggedShots(ghGame(G.date, G.id)?.[p.pid], p).sh; return c ? `<span class="rx-grade ${p.sh > c.line ? 'hit' : 'miss'}">${p.sh > c.line ? '✓' : '✗'} o${c.line} ${Odds.am(c.p)}</span>` : ''; })()}</div>
        </div>`).join('');
      const shotsHtml = rxState === 'ready' ? shooters || '<div class="rx-none">No shots logged.</div>'
        : rxState === 'error' ? '<div class="rx-none">Couldn\'t load the player box.</div>' : '<div class="rx-none">Loading…</div>';
      // a round of two days: each day under its own heading
      const day = round.length > 1 && (k === 0 || games[k - 1].date !== G.date)
        ? `<div class="gl-day">${dayLabel(G.date, true)} · ${games.filter(x => x.date === G.date).length} game${games.filter(x => x.date === G.date).length === 1 ? '' : 's'}</div>` : '';
      const tp = topPick({ ...G, state: 'post' });
      const tpHtml = tp ? `<span class="rx-grade ${tp.scored ? 'hit' : 'miss'}" title="Our shortest price to score in this game, the last before kickoff">${tp.scored ? '✓' : '✗'} top pick ${esc(shortName(tp.name))} ${Odds.am(tp.p)}</span>` : '';
      return `${day}<div class="rg">
        <div class="rg-head">
          <span class="rg-score">
            ${logoImg(G.away.ab, 'rg-logo')}<span class="${aWin ? 'w' : ''}">${esc(G.away.ab)} ${G.away.score}</span>
            <span style="color:var(--dim)">–</span>
            <span class="${hWin ? 'w' : ''}">${G.home.score} ${esc(G.home.ab)}</span>${logoImg(G.home.ab, 'rg-logo')}
          </span>${G.len > 90 ? '<span class="rg-end">AET</span>' : ''}${slugTag(G.slug)}${tpHtml}
          <button class="rx-btn" onclick="openGame('${G.id}')">Box score</button>
        </div>
        <div class="rx-grid">
          <div>
            <div class="rx-sec">Goals</div>${G.goals.map(x => goalRow(x, G)).join('') || '<div class="rx-none">Goalless.</div>'}
            <div class="rx-sec">${esc(G.away.ab)} · team · ${esc(G.home.ab)}</div>${teamStats(G)}
          </div>
          <div><div class="rx-sec">Shots</div>${shotsHtml}</div>
        </div>
      </div>`;
    }).join('');
    el.innerHTML = `<div class="rc-wknav">
        <div class="rc-wknav-center">
          <button class="rc-arrow" onclick="shiftRecapDate(-1)" ${atFirst ? 'disabled' : ''} aria-label="Previous round">‹</button>
          <span class="rc-wklabel">${roundLabel(round)}</span>
          <button class="rc-arrow" onclick="shiftRecapDate(1)" ${atLast ? 'disabled' : ''} aria-label="Next round">›</button>
        </div>
        ${atLast ? '' : `<button class="rc-latest" onclick="recapToLatest()">Latest →</button>`}
      </div>
      <div class="result-meta"><b>${roundLabel(round, true)}</b> · ${games.length} game${games.length === 1 ? '' : 's'} · scores read away–home</div>
      ${tiles}
      ${body || '<div class="empty">Nothing final on this date.</div>'}`;
  }

  // ── Schedule ───────────────────────────────────────────────────────────
  // The unit is the date: the arrows step one match day. Each side carries its
  // own moneyline (soccer's is three-way: the draw sits in the middle with the
  // total). Lines are DraftKings' via ESPN, not ours; the goals each side is
  // expected to score are read off them (the 1X2 and the total, devigged, fitted
  // with two Poisson means: scripts/build-soccer.js).
  function nextGameDate() {
    const t = todayET();
    return D.dates.find(d => d >= t) || D.dates[D.dates.length - 1];
  }
  function setScheduleDate(d) { scheduleDate = d; renderSchedule(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  function shiftScheduleDate(n) {
    const i = D.dates.indexOf(scheduleDate) + n;
    if (i >= 0 && i < D.dates.length) setScheduleDate(D.dates[i]);
  }
  function gameRow(g) {

        <select class="fl-sel" onchange="setStF('team',this.value)">${teamOpts}</select>
      </div>
      <div class="result-meta">${rows.length} players${rows.length > ST_SHOW ? ` · top ${ST_SHOW} shown` : ''} · <b>${esc(D.leadersFrom)}</b>${lastSeason ? ' (last season, until games are played)' : ''} · sorted by <b>${esc(sortLbl)}</b>${rate ? ' · 450+ minutes' : ''}</div>
      <div class="rc-list">${rows.length ? rows.slice(0, ST_SHOW).map(row).join('') : '<div class="empty">No players match these filters.</div>'}</div>`;
  }

  // ── Day by day (as /nfl's boards) ─────────────────────────────────────
  // The boards hold each team's next game, which can span a midweek day and a
  // weekend. Each board shows one day, defaulting to the next with a game still
  // to kick off, and drops players whose game has started: you can still open a
  // finished day, or show the started games, from the bar.
  const dayF = { day: null, started: false };
  function setDay(day) { dayF.day = day; dayF.started = false; gF.game = 'all'; sF.game = 'all'; renderPanel(activeNav); }
  function setDayStarted(v) { dayF.started = v; renderPanel(activeNav); }
  const gameStarted = (r) => Date.parse(r.start) <= Date.now();
  function slateDays() {
    const by = new Map();
    for (const g of goalGames()) {
      const day = etDay(g.start), d = by.get(day) ?? by.set(day, { day, ids: new Set(), total: 0, started: 0 }).get(day);
      d.ids.add(g.gid); d.total++; if (gameStarted(g)) d.started++;
    }
    return [...by.values()].sort((a, b) => a.day.localeCompare(b.day)).map(d => ({ ...d,
      label: new Date(d.day + 'T12:00:00Z').toLocaleDateString('en-US', { weekday: 'short', month: 'numeric', day: 'numeric', timeZone: 'UTC' }).replace(',', '') }));
  }
  function activeDay(days = slateDays()) {
    if (dayF.day === 'all') return null;
    return days.find(d => d.day === dayF.day) ?? days.find(d => d.started < d.total) ?? days[days.length - 1] ?? null;
  }
  /** Rows for the selected day, minus players whose game already started. */
  function dayScope(rows) {
    const days = slateDays();
    if (days.length < 2 && !days.some(d => d.started)) return rows;
    const d = activeDay(days);
    let out = d ? rows.filter(r => d.ids.has(r.gid)) : rows;
    if (!dayF.started && (!d || d.started < d.total)) out = out.filter(r => !gameStarted(r));
    return out;
  }
  function dayBar() {
    const days = slateDays();
    if (!days.length) return '';
    const d = activeDay(days);
    const chips = days.map(x => {
      const done = x.started === x.total, tag = done ? '✓' : x.started ? 'live' : `${x.total}`;
      return `<button class="pbf-chip${d?.day === x.day ? ' on' : ''}${done ? ' done' : ''}" onclick="setDay('${x.day}')">${x.label}<small>${tag}</small></button>`;
    }).join('') + `<button class="pbf-chip${!d ? ' on' : ''}" onclick="setDay('all')">All games</button>`;
    const scope = d ? [d] : days;
    const hidden = scope.filter(x => x.started < x.total || !d).reduce((a, x) => a + x.started, 0);
    const note = dayF.started
      ? `<span class="day-note">showing started games · <a onclick="setDayStarted(false)">hide</a></span>`
      : hidden && (!d || d.started < d.total)
        ? `<span class="day-note">${hidden} game${hidden > 1 ? 's' : ''} already started · <a onclick="setDayStarted(true)">show</a></span>` : '';
    return `<div class="day-bar">${chips}${note}</div>`;
  }
  /** The Game filter's chips: the selected day's games only. */
  const dayGames = () => { const d = activeDay(); return goalGames().filter(g => !d || d.ids.has(g.gid)); };

  // ── Goals: anytime goalscorer ──────────────────────────────────────────
  // Every player in a rotation over the next few days, priced to score
  // (scripts/soccer-goals.js; fitted walk-forward in research/soccer_goals.py):
  // his expected minutes, his shooting and scoring rates shrunk to his
  // position's, his team's goals off the line, and his share of its penalties.
  // Prices are pre-lineup; once a lineup posts (about an hour out) a player
  // outside the matchday squad drops off and the rest carry XI / bench.
  const GOAL_MIN = 0.02;            // the board's floor: a 1-in-50 defender is noise on a list (the box score keeps him)
  const gF = { open: false, game: 'all', pos: 'ALL', sort: 'p', q: '', view: 'cards' };
  function setGoalsF(k, v) { gF[k] = v; renderGoals(); }
  const goalGames = () => [...new Map((D.goals?.rows || []).map(r => [r.gid, r])).values()].sort((a, b) => a.start.localeCompare(b.start));
  const gameLbl = (r) => `${r.home ? r.opp : r.team} @ ${r.home ? r.team : r.opp}`;
  function goalRows() {
    const S = { p: (r) => r.p, em: (r) => r.em, sh90: (r) => r.sh90, imp: (r) => r.imp ?? 0 }[gF.sort] || ((r) => r.p);
    return dayScope(D.goals?.rows || []).filter(r => (r.p >= GOAL_MIN || gF.q) && (gF.game === 'all' || r.gid === gF.game)
        && (gF.pos === 'ALL' || r.pos === gF.pos) && matchQ(r, gF.q))
      .sort((a, b) => S(b) - S(a) || b.p - a.p).map((r, i) => ({ ...r, rank: i + 1 }));
  }
  const xiTag = (r) => r.xi ? `<span class="pb-flag gl-xi${r.xi === 'XI' ? '' : ' bench'}">${r.xi === 'XI' ? 'XI' : 'BENCH'}</span>` : '';
  const shareGoal = (r) => ({ name: r.name, p: r.p, tag: 'Yes',
    img: r.hs ? `https://a.espncdn.com/i/headshots/soccer/players/full/${r.pid}.png` : null,
    logo: D?.teams?.[r.team]?.logoDark || D?.teams?.[r.team]?.logo || null,
    line: `${r.team} ${r.home ? 'vs' : '@'} ${r.opp} · ${r.em.toFixed(0)}' expected` });
  function renderGoals() {
    const el = dataGate('goals-content'); if (!el) return;
    const G = D.goals;
    if (!G?.rows?.length) { el.innerHTML = '<div class="empty">No games to price yet. The board fills in once the next games are on the schedule.</div>'; return; }
    const games = dayGames();
    if (gF.game !== 'all' && !games.some(g => g.gid === gF.game)) gF.game = 'all';
    const rows = goalRows();
    RonShare.set('setGoalsF', () => ({ title: 'Anytime goal', sub: `${dayLabel(G.from)}${G.to && G.to !== G.from ? ' – ' + dayLabel(G.to) : ''} · fair odds`, rows: rows.map(shareGoal) }));
    const changed = (gF.game !== 'all') + (gF.pos !== 'ALL') + (gF.sort !== 'p');
    const controls = uiFilters('setGoalsF', gF.open, [
      ['Game', [['all', 'All games'], ...games.map(g => [g.gid, `${gameLbl(g)} · ${gameTime(g.start)}`])].map(([v, l]) => uiChip('setGoalsF', 'game', v, l, gF.game)).join('')],
      ['Position', [['ALL', 'All'], ['FWD', 'Forwards'], ['MID', 'Midfield'], ['DEF', 'Defenders']].map(([v, l]) => uiChip('setGoalsF', 'pos', v, l, gF.pos)).join('')],
      ['Sort', [['p', 'Shortest price'], ['em', 'Expected minutes'], ['sh90', 'Shots / 90'], ['imp', 'Team goals']].map(([v, l]) => uiChip('setGoalsF', 'sort', v, l, gF.sort)).join('')],
    ], changed) + uiSearch('goals-search', 'setGoalsF', gF.q, 'Search a player, team or position…');
    const ad = activeDay();
    const meta = `<div class="result-meta"><b>${ad ? dayLabel(ad.day, true) : "Each team's next game"}</b> · ${rows.length} players${gF.q ? '' : ` at ${Math.round(GOAL_MIN * 100)}%+`} · ${games.length} game${games.length === 1 ? '' : 's'} · anytime goal if he plays, fair odds, no vig</div>` + uiView('setGoalsF', gF.view);
    if (!rows.length) { el.innerHTML = dayBar() + controls + meta + '<div class="empty">Nothing matches that filter.</div>'; return; }
    const open = (r) => `openGoalCard('${r.pid}','${r.gid}')`;
    const started = (r) => new Date(r.start) <= new Date();
    const facts = (r) => `<span class="pb-f" title="Expected minutes: his last five games for this team, the latest weighted most"><b>${r.em.toFixed(0)}'</b> MIN</span>
      <span class="pb-f" title="Shots per 90, shrunk toward his position's rate"><b>${r.sh90.toFixed(1)}</b> SH/90</span>
      <span class="pb-f" title="Goals the line expects from his team"><b>${r.imp != null ? r.imp.toFixed(2) : '—'}</b> TEAM</span>
      ${r.pk >= 0.2 ? `<span class="pb-f" title="His share of his team's recent penalties"><b>${Math.round(r.pk * 100)}%</b> PENS</span>` : ''}`;
    let body;
    if (gF.view === 'table') {
      body = `<div class="rc-tablewrap"><table class="rc-table">
        <thead><tr><th></th><th>Player</th><th>Game</th><th class="num">Min</th><th class="num">SH/90</th><th class="num">G/90</th><th class="num">Pens</th><th class="num">Team</th><th class="num">Price</th></tr></thead>
        <tbody>${rows.map(r => `
          <tr onclick="${open(r)}"${started(r) ? ' class="dim"' : ''}>
            <td class="num dim">${r.rank}</td>
            <td><b>${esc(r.name)}</b> <span class="dim">${esc(r.pos || '')}</span> ${xiTag(r)}</td>
            <td class="dim">${esc(r.team)} ${r.home ? 'vs' : '@'} ${esc(r.opp)} · ${dayLabel(etDay(r.start))}</td>
            <td class="num dim">${r.em.toFixed(0)}'</td>
            <td class="num dim">${r.sh90.toFixed(2)}</td>
            <td class="num dim">${r.g90.toFixed(2)}</td>
            <td class="num dim">${r.pk ? Math.round(r.pk * 100) + '%' : '—'}</td>
            <td class="num dim">${r.imp != null ? r.imp.toFixed(2) : '—'}</td>
            <td class="num"><b>${Odds.inline(r.p)}</b></td>
          </tr>`).join('')}</tbody></table></div>`;
    } else {
      body = `<div class="pb-list">${rows.map(r => `
        <div class="pb-card${started(r) ? ' t3-started' : ''}" onclick="${open(r)}">
          <div class="pb-rank">${r.rank}</div>${faceHtml(r.pid, r.name, r.hs)}
          <div class="pb-info">
            <div class="pb-nm">${esc(r.name)}${posBadge(r.pos)}${xiTag(r)}</div>
            <div class="pb-line">${logoImg(r.team, 'pb-logo')} ${esc(r.team)} ${r.home ? 'vs' : '@'} ${esc(r.opp)} · ${dayLabel(etDay(r.start))} ${gameTime(r.start)}${r.noLine ? ' · <i>no line yet</i>' : ''}</div>
          </div>
          <div class="pb-facts">${facts(r)}</div>
          <div class="pb-price">
            <span class="pb-odds${r.p < 0.5 ? ' dog' : ''}">${Odds.am(r.p)}</span>
            <span class="pb-pct">to score · ${Odds.pct(r.p)}</span>
          </div>
        </div>`).join('')}</div>`;
    }
    const M = G.model;
    el.innerHTML = dayBar() + controls + meta + body + `<div class="t3-note">Priced off his expected minutes (his last five games for this team), his shots, shots on target and goals per 90 (shrunk toward his position's, so a hot month counts for a little), the goals the line expects from his team, and his share of its penalties. Every price is <b>if he plays</b>: books void a player prop when he doesn't take part, so his chance of sitting is taken out. It's a mix of the two ways he plays: he starts, or comes off the bench. When lineups post, about an hour before kickoff, the role is known: a player outside the matchday squad drops off, the rest are tagged XI or bench, and every price sharpens.${M ? ` Walk-forward over ${M.seasons[0]}–${M.seasons[M.seasons.length - 1]} (each season priced by a model fitted only on the seasons before it): AUC ${M.auc.toFixed(3)} before the lineups${M.aucKnown ? `, ${M.aucKnown.toFixed(3)} once they post` : ''}, calibrated within a point or two from 1% to 50%.` : ''}</div>`;
  }
  // ── What moves a goal price: the tornado (as /nhl's goal card) ─────────
  // Each factor is a multiplier on his expected goals against a reference
  // player (his position's league rates, 80 expected minutes, four starts in
  // five, the league's team goals, away, no penalties): scripts/soccer-goals.js
  // goalFactors, so the bars multiply out to the price exactly. Ranks mode
  // places him among the board's players at his position on each factor.
  const GFX = [
    ['min', 'Minutes', (r) => `${r.em.toFixed(0)}' expected · ${r.st5}/5 starts`, 'His expected minutes and recent starts, against a regular starter (80 minutes, four starts in five)'],
    ['shoot', 'Shooting', (r) => `${r.sh90.toFixed(1)} shots · ${r.sot90.toFixed(1)} on target / 90`, "His shots and shots on target per 90 (shrunk toward his position's), against his position's league rate"],
    ['finish', 'Finishing', (r) => `${r.g90.toFixed(2)} non-penalty goals / 90`, "His non-penalty goals per 90 (shrunk hard toward his position's: finishing is mostly noise), against the league"],
    ['team', 'Team goals', (r) => r.imp != null ? `${r.imp.toFixed(2)} off the line` : 'no line yet', 'The goals the line (1X2 + total, devigged) expects his team to score, against the league average'],
    ['pens', 'Penalties', (r) => r.pk ? `${Math.round(r.pk * 100)}% of his team's last ${r.pkN}` : 'not his', "His share of his team's recent penalties"],
    ['role', 'Role', (r) => r.ps != null ? `${Math.round(r.ps / (r.ps + (r.pb || 0)) * 100)}% of the time he plays, he starts` : 'start or bench', 'If he plays, how often it is as a starter rather than off the bench (known once the lineups post), and the calibration: everything above is his goals if he starts'],
    ['home', 'Home', (r) => r.home ? 'at home' : 'away', 'Home teams score a touch more'],
  ];
  const fxTone = (m) => m >= 1.03 ? 'pos' : m <= 0.97 ? 'neg' : 'mid';
  const pcTone = (pc) => pc >= 0.6 ? 'pos' : pc <= 0.4 ? 'neg' : 'mid';
  const TONE_VAR = { pos: 'var(--good)', neg: 'var(--bad)', mid: 'var(--gold)' };
  const ordinal = (n) => n + (n % 100 >= 11 && n % 100 <= 13 ? 'th' : ({ 1: 'st', 2: 'nd', 3: 'rd' })[n % 10] || 'th');
  let gcMode = 'pct';
  function setGcMode(m) { gcMode = m; const r = gcDeck[gcAt]; if (r) openGoalCard(r.pid, r.gid); }
  function goalTornado(r) {
    if (!r.fx) return '';
    const parts = GFX.map(([k, lab, det, tip]) => ({ k, lab, det: det(r), tip, d: r.fx.d[k] || 0 }));
    const pool = (D.goals?.rows || []).filter(x => x.fx && x.pos === r.pos);
    const rank = (k, v) => { let lo = 0, hi = 0; for (const x of pool) { const y = x.fx.d[k] || 0; if (y < v - 1e-9) lo++; if (y <= v + 1e-9) hi++; } return pool.length ? (lo + hi) / 2 / pool.length : 0.5; };
    const roleNames = { FWD: 'forwards', MID: 'midfielders', DEF: 'defenders', GK: 'keepers' }[r.pos] || 'players';
    const pctOk = pool.length >= 20, mode = pctOk ? gcMode : 'x';
    const muCal = r.fx.base * Math.exp(parts.reduce((a, x) => a + x.d, 0));
    const toggle = pctOk ? `<div class="fbar-mode">${[['pct', 'Rank on the board'], ['x', 'Multipliers']].map(([v, l]) =>
      `<button class="due-filter-chip${mode === v ? ' active' : ''}" onclick="setGcMode('${v}')">${l}</button>`).join('')}</div>` : '';
    const foot = `A ${{ FWD: 'forward', MID: 'midfielder', DEF: 'defender', GK: 'keeper' }[r.pos] || 'player'} at his position's league rates, starting in a neutral spot, is expected <b>${r.fx.base.toFixed(2)}</b> goals, <b>${Odds.pct(1 - Math.exp(-r.fx.base))}</b> to score; these take him to <b>${muCal.toFixed(2)}</b>, <b>${Odds.pct(r.p)}</b>.`;
    if (mode === 'pct') {
      const bars = parts.filter(x => x.k !== 'home').map(x => {
        const pc = rank(x.k, x.d), t = (pc - 0.5) * 2, n = Math.max(1, Math.min(99, Math.round(pc * 100)));
        return `<div class="fbar"><span class="fbar-label" title="${esc(x.tip)} (${esc(x.det)})">${x.lab}</span>
          <div class="fbar-track"><div class="fbar-fill ${pcTone(pc)}" style="${t >= 0 ? 'left:50%' : 'right:50%'};width:${Math.abs(t) * 50}%"></div></div>
          <span class="fbar-val" style="color:${TONE_VAR[pcTone(pc)]}">${ordinal(n)}<small>${Math.exp(x.d).toFixed(2)}×</small></span></div>`;
      }).join('');
      const chips = parts.filter(x => x.k === 'home' && Math.abs(x.d) >= 0.015)
        .map(x => `<span class="fbar-chip ${x.d >= 0 ? 'pos' : 'neg'}" title="${esc(x.tip)}">${x.lab} ${Math.exp(x.d).toFixed(2)}×</span>`).join('');
      const muRank = (() => { let lo = 0; for (const x of pool) if (x.p < r.p) lo++; return Math.max(1, Math.min(99, Math.round(lo / pool.length * 100))); })();
      return `${toggle}<div class="fbar-head"><span>Expected goals</span><b>${muCal.toFixed(2)}</b><em>${ordinal(muRank)} of ${pool.length} ${roleNames} on the board</em></div>
        <div class="fbar-legend">← below the board's ${roleNames} · middle · above →</div>
        <div class="fbars pct"><div class="fbar-baseline"></div>${bars}</div>
        ${chips ? `<div class="fbar-chips">${chips}</div>` : ''}
        <div class="fbar-note">Each bar ranks him against the board's <b>${pool.length}</b> ${roleNames} on that factor; the grey number is what it does to his expected goals. ${foot}</div>`;
    }
    const shown = parts.filter(x => Math.abs(x.d) >= 0.015).sort((a, b) => Math.abs(b.d) - Math.abs(a.d));
    const maxAbs = Math.max(0.4, ...shown.map(x => Math.abs(x.d)));
    const bars = shown.map(x => {
      const w = Math.min(50, Math.abs(x.d) / maxAbs * 50), m = Math.exp(x.d);
      return `<div class="fbar"><span class="fbar-label" title="${esc(x.tip)} (${esc(x.det)})">${x.lab}</span>
        <div class="fbar-track"><div class="fbar-fill ${fxTone(m)}" style="${x.d > 0 ? 'left:50%' : 'right:50%'};width:${w}%"></div></div>
        <span class="fbar-val" style="color:${TONE_VAR[fxTone(m)]}">${m.toFixed(2)}×</span></div>`;
    }).join('');
    return `${toggle}<div class="fbar-legend">← tougher · 1.0× neutral · juicier →</div>
      <div class="fbars"><div class="fbar-baseline"></div>${bars}</div>
      <div class="fbar-note">Each bar multiplies his expected goals (hover a factor for the detail). ${foot}</div>`;
  }

  /** One player's price, taken apart. ‹ › step through the board as it's filtered. */
  let gcDeck = [], gcAt = -1;
  function openGoalCard(pid, gid) {
    const all = D.goals?.rows || [];
    const r = all.find(x => x.pid === String(pid) && (!gid || x.gid === String(gid))); if (!r) return;
    gcDeck = activeNav === 'goals' ? goalRows() : all.filter(x => x.gid === r.gid).sort((a, b) => b.p - a.p);
    gcAt = gcDeck.findIndex(x => x.pid === r.pid && x.gid === r.gid);
    const dlg = RonModal.open('gc-back', { cls: 'pm', nav: { prev: 'goalCardStep(-1)', next: 'goalCardStep(1)' } });
    const stat = (v, l, tip) => `<div class="pm-stat" title="${tip}"><div class="pm-stat-v">${v}</div><div class="pm-stat-l">${l}</div></div>`;
    const sharePk = r.mu ? r.muPk / r.mu : 0;
    dlg.innerHTML = `<button class="pm-x" onclick="RonModal.close('gc-back')" aria-label="Close">×</button>
      <div class="pm-hero">${faceHtml(r.pid, r.name, r.hs)}
        <div class="pm-id"><div class="pm-nm">${esc(r.name)}</div>
          <div class="pm-meta">${posBadge(r.pos)} ${xiTag(r)} <b>${esc(r.team)}</b> ${r.home ? 'vs' : '@'} ${esc(r.opp)} · ${dayLabel(etDay(r.start))} ${gameTime(r.start)}</div></div>
        <div class="pm-hero-price"><div class="pm-hero-od${r.p < 0.5 ? ' dog' : ''}">${Odds.am(r.p)}</div><div class="pm-hero-lbl">to score if he plays · ${Odds.pct(r.p)}</div></div>
      </div>
      <div class="pm-body">
        ${r.fx ? `<div class="pm-sec">What moves the price</div>${goalTornado(r)}` : ''}
        <div class="pm-sec">The numbers</div>
        <div class="pm-stats">
          ${stat(`${r.em.toFixed(0)}'`, 'Exp. minutes', 'His last five games for this team, the latest weighted most')}
          ${stat(`${r.st5}/5`, 'Starts L5', 'Starts in his team\'s last five games')}
          ${stat(r.sh90.toFixed(2), 'Shots / 90', 'Shrunk toward his position\'s rate')}
          ${stat(r.sot90.toFixed(2), 'On target / 90', 'Shrunk toward his position\'s rate')}
          ${stat(r.g90.toFixed(2), 'Goals / 90', 'Non-penalty, shrunk toward his position\'s rate')}
          ${stat(r.imp != null ? r.imp.toFixed(2) : '—', 'Team goals', 'What the line (1X2 + total, devigged) expects his team to score')}
          ${stat(r.pk ? Math.round(r.pk * 100) + '%' : '—', 'Pen share', `His share of his team's last ${r.pkN} penalties`)}
          ${stat(r.mu.toFixed(2), 'Exp. goals', 'The model\'s goal count for him in this game')}
        </div>
        <p class="pm-foot">Over his last ${r.apps} appearances: <b>${r.np}</b> non-penalty goal${r.np === 1 ? '' : 's'} and <b>${r.shots ?? '—'}</b> shots in ${r.min.toLocaleString()} minutes.
          ${r.play != null ? ` He plays in <b>${Math.round(r.play * 100)}%</b> of games like this; the price is if he does (a book voids the bet if he doesn't).` : ''}${sharePk >= 0.05 ? ` About ${Math.round(sharePk * 100)}% of his price is penalties.` : ''}${r.noLine ? ' No line on this game yet: his team is priced at the league\'s average goals.' : ''}
          ${r.xi ? ` Lineups are out: he's ${r.xi === 'XI' ? 'in the starting XI' : 'on the bench'}, and the price knows it.` : ''}</p>
      </div>`;
    RonModal.navState('gc-back', gcAt, gcDeck.length);
  }
  function goalCardStep(d) { const r = gcDeck[gcAt + d]; if (r) openGoalCard(r.pid, r.gid); }

  // ── Shots and shots on target ──────────────────────────────────────────
  // Every player in a rotation for his team's next game, priced at every line
  // (scripts/soccer-shots.js; fitted walk-forward in research/soccer_shots.py).
  // A shot count is a mixture over his role — he starts, comes off the bench,
  // or doesn't play — and given the role, his shooting per 90 over the minutes
  // that role gets him, against what the opponent allows. Once lineups post the
  // role is known and the price sharpens (XI, or a named sub).
  const SK = { sh: { lab: 'Shots', unit: 'shots', lines: [0.5, 1.5, 2.5, 3.5, 4.5, 5.5], big: 'Projected shots', title: 'Shots distribution',
                     blurb: 'Whether he starts, comes on or sits, then his shots per 90 over the minutes that role gets him, against what the opponent allows' },
              sot: { lab: 'On target', unit: 'shots on target', lines: [0.5, 1.5, 2.5, 3.5], big: 'Projected on target', title: 'Shots on target distribution',
                     blurb: 'The same role mixture, on his shots on target per 90 (his shots per 90 carries most of it)' } };

        ${faceHtml(r.pid, r.name, r.hs, 'hm-photo')}
        <span class="hm-name">${esc(r.name)}<span class="hm-subtle">${esc(r.pos || '')} ${esc(r.team)} · ${per90(r.sot, r).toFixed(2)} on target / 90</span></span>
        <span class="hm-score warm">${per90(r.sh, r).toFixed(2)}<span class="hm-subtle" style="font-size:0.766rem"> SH/90</span></span></div>`).join('');
    // ── Goals: the shortest prices still to play ─────────────────────────
    const goalsHome = (D.goals?.rows || []).filter(r => new Date(r.start) > new Date()).slice(0, 5).map(r => `
      <div class="hm-row" onclick="event.stopPropagation(); openGoalCard('${r.pid}','${r.gid}')">
        ${faceHtml(r.pid, r.name, r.hs, 'hm-photo')}
        <span class="hm-name">${esc(r.name)}<span class="hm-subtle">${esc(r.team)} ${r.home ? 'vs' : '@'} ${esc(r.opp)} · ${dayLabel(etDay(r.start))} · ${r.em.toFixed(0)}' exp</span></span>
        <span class="hm-score hm-bet"><small>score</small><b class="${r.p >= 0.5 ? 'odfav' : 'oddog'}">${Odds.inline(r.p)}</b></span></div>`).join('');
    const shotsHome = (D.goals?.rows || []).filter(r => r.sh && new Date(r.start) > new Date()).sort((a, b) => b.sh.mu - a.sh.mu).slice(0, 5).map(r => {
      const L = evenLine(r.sh.pmf, SK.sh.lines), p = pOver(r.sh.pmf, L);
      return `<div class="hm-row" onclick="event.stopPropagation(); openShotCard('sh','${r.pid}')">
        ${faceHtml(r.pid, r.name, r.hs, 'hm-photo')}
        <span class="hm-name">${esc(r.name)}<span class="hm-subtle">${esc(r.team)} ${r.home ? 'vs' : '@'} ${esc(r.opp)} · ${r.sh.mu.toFixed(1)} shots proj · ${r.sot.mu.toFixed(1)} on target</span></span>
        <span class="hm-score hm-bet"><small>o${L}</small><b class="${p >= 0.5 ? 'odfav' : 'oddog'}">${Odds.inline(p)}</b></span></div>`; }).join('');
    const lead = esc(String(D.leadersFrom).replace(/\s*MLS$/, ''));
    el.innerHTML = `
      <div class="hm-cols">
        <div class="hm-col">
          ${card('recap', lastRound ? `${roundLabel(lastRound)} Recap` : 'Recap', 'Recap', lastCard, 'No games in the last four weeks.')}
          ${card('goals', 'Goals · next game', 'Goals', goalsHome, 'The board fills in once the next games are on the schedule.')}
          ${card('shots', 'Shots · next game', 'Shots', shotsHome, 'The board fills in once the next games are on the schedule.')}
          ${card('stats', `${lead} Scorers`, 'Stats', leaders, 'No goals yet.')}
        </div>
        <div class="hm-col">
          ${card('schedule', nd ? `${dayLabel(nd)} · ${next.length} Game${next.length === 1 ? '' : 's'}` : 'Schedule', 'Schedule', gameRows, D.nextDay ? `Next up: ${dayLabel(D.nextDay, true)}.` : 'No games in the next two weeks.')}
          ${card('stats', `${lead} Shooters`, 'Stats', shooters, 'Not enough minutes played yet.')}
        </div>
      </div>`;
  }

  document.addEventListener('DOMContentLoaded', () => { updateThemeToggleIcon(); applyRouteState(); loadSoccer(); });
</script>
<script src="/welcome.js?v=5" defer></script>
</body>
