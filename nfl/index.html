  .ph-bucket-rate { font-family: var(--font-d); font-size: 1.2rem; font-weight: 700; display: block; line-height: 1.2; }
  .ph-bucket-n { font-size: 0.57rem; color: var(--dim); display: block; }
  .ph-days { display: flex; flex-direction: column; gap: 0; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .ph-day-row { display: flex; align-items: center; gap: 0.55rem; padding: 0.55rem 0.75rem; border-bottom: 1px solid var(--border); font-size: 0.68rem; }
  .ph-day-row:last-child { border-bottom: none; }
  .ph-day-date { color: var(--muted); flex-shrink: 0; font-size: 0.62rem; width: 5.6rem; }
  /* Model-change divider inside the day-by-day timeline */
  .ph-day-marker { display: flex; align-items: center; justify-content: center; gap: 0.4rem; padding: 0.32rem 0.6rem; background: repeating-linear-gradient(-45deg, var(--surface1), var(--surface1) 6px, transparent 6px, transparent 12px); border-bottom: 1px solid var(--border); border-top: 1px solid var(--gold); }
  .ph-day-marker:last-child { border-bottom: none; }
  .ph-marker-txt { font-size: 0.56rem; font-weight: 800; letter-spacing: 0.03em; color: var(--gold); text-align: center; }
  /* Model changelog list */
  .ph-log { display: flex; flex-direction: column; gap: 0; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .ph-log-item { display: flex; gap: 0.6rem; padding: 0.5rem 0.75rem; border-bottom: 1px solid var(--border); }
  .ph-log-item:last-child { border-bottom: none; }
  .ph-log-date { flex-shrink: 0; width: 5.2rem; font-size: 0.6rem; font-weight: 700; color: var(--gold); font-variant-numeric: tabular-nums; }
  .ph-log-body { display: flex; flex-direction: column; gap: 0.12rem; min-width: 0; }
  .ph-log-title { font-size: 0.68rem; font-weight: 700; color: var(--text); }
  .ph-log-detail { font-size: 0.6rem; color: var(--muted); line-height: 1.35; }
  .ph-day-fraction { color: var(--text); font-weight: 700; flex-shrink: 0; width: 2.4rem; }
  .ph-day-pct { font-family: var(--font-d); font-size: 0.9rem; font-weight: 700; flex-shrink: 0; width: 2.6rem; }
  .ph-day-hrg { font-family: var(--font-d); font-size: 0.9rem; font-weight: 700; flex-shrink: 0; width: 4.6rem; color: var(--muted); }
  .ph-day-hrg-unit { font-family: var(--font-b); font-size: 0.5rem; color: var(--muted); font-weight: 400; }
  .ph-day-hits { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 0.25rem; }
  .ph-hit-name { font-size: 0.6rem; font-weight: 500; background: rgba(51,208,124,0.1); color: var(--good); border: 1px solid rgba(51,208,124,0.25); border-radius: 4px; padding: 0.06rem 0.35rem; display: inline-flex; align-items: center; gap: 0.22rem; }
  .ph-hit-rank { font-weight: 700; color: var(--muted); font-size: 0.54rem; }
  .dr-chip-sub { font-size: 0.54rem; color: var(--muted); font-weight: 400; }
  .dr-wait-days { font-family: var(--font-d); font-size: 1rem; font-weight: 700; color: var(--gold); width: 2.4rem; flex-shrink: 0; }
  .dr-wait-name { font-weight: 500; color: var(--text); flex-shrink: 0; }
  .dr-wait-sub { font-size: 0.6rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @media (max-width: 600px) {
    .ph-day-row { flex-wrap: wrap; }
    .ph-day-hits { flex-basis: 100%; margin-top: 0.15rem; }
  }

  /* Home dashboard */
  /* Two independent columns so a short card lets the next one rise (no row-gaps). */
  .hm-cols { display: flex; gap: 0.6rem; align-items: flex-start; }
  .hm-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 0.6rem; }
  @media (max-width: 640px) { .hm-cols { flex-direction: column; align-items: stretch; } }
  /* On phones, pull the home cards out toward the screen edges (offsetting the
     page's side padding) and trim their inner padding so they read wider. */
  @media (max-width: 600px) {
    #home-content { margin-left: -0.55rem; margin-right: -0.55rem; }
    #home-content .hm-card { padding: 0.75rem 0.7rem; }
  }
  .hm-card { min-width: 0; background: var(--surface0); border: 1px solid var(--border); border-radius: 10px; padding: 0.75rem 0.85rem; cursor: pointer; transition: border-color 0.15s, background 0.15s; animation: fadeIn 0.15s ease; }
  .hm-card:hover { border-color: var(--accent); background: var(--surface1); }
  .hm-head { display: flex; justify-content: space-between; align-items: baseline; gap: 0.5rem; margin-bottom: 0.55rem; }
  /* Section label inside a combined card (Chalk / Value in the Picks card). */
  .hm-subhead { font-size: 0.58rem; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); margin: 0.5rem 0 0.12rem; display: inline-block; }
  .hm-subhead.link { cursor: pointer; }
  .hm-subhead.link:hover { color: var(--accent); }
  .hm-head + .hm-subhead { margin-top: 0.05rem; }
  .hm-title { font-family: var(--font-d); font-weight: 700; font-size: 0.98rem; color: var(--text-strong); letter-spacing: 0.02em; }
  .hm-link { font-size: 0.6rem; color: var(--accent); font-weight: 700; white-space: nowrap; }
  .hm-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.4rem; margin-bottom: 0.55rem; }
  .hm-tile { background: var(--surface1); border: 1px solid var(--border); border-radius: 7px; text-align: center; padding: 0.45rem 0.2rem; }
  .hm-tile b { font-family: var(--font-d); font-size: 1.3rem; font-weight: 700; color: var(--text-strong); display: block; line-height: 1.05; }
  .hm-tile span { font-size: 0.53rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .hm-tile.heat-hot b { color: var(--good); }
  .hm-tile.heat-warm b { color: var(--good-2); }
  .hm-tile.heat-cool b { color: #4fb6d6; }
  :root[data-theme="light"] .hm-tile.heat-cool b { color: #1f8fbf; }
  .hm-chips { display: flex; flex-wrap: wrap; gap: 0.25rem; }
  .hm-row { display: flex; align-items: center; gap: 0.45rem; padding: 0.32rem 0; border-bottom: 1px solid var(--border); font-size: 0.72rem; min-width: 0; }
  .hm-row:last-of-type { border-bottom: none; }
  .hm-rank { color: var(--muted); font-weight: 700; width: 1rem; flex-shrink: 0; font-size: 0.62rem; text-align: center; }
  .hm-photo { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; background: var(--surface2); flex-shrink: 0; }
  .hm-name { font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .hm-subtle { font-size: 0.6rem; color: var(--muted); font-weight: 400; }
  .hm-combo-tag { flex-shrink: 0; text-align: center; font-family: var(--font-b); font-size: 0.66rem; font-weight: 700; color: var(--text); background: var(--surface2); border: 1px solid var(--border2); border-radius: 5px; padding: 0.1rem 0.38rem; letter-spacing: 0.02em; }
  .hm-tag-sub { color: var(--muted); font-weight: 600; }
  .hm-pair-score { color: var(--accent); }
  .hm-x { font-size: 0.72rem; color: var(--muted); font-weight: 700; margin-left: 0.08rem; }
  .hm-score { margin-left: auto; font-family: var(--font-d); font-weight: 700; font-size: 0.95rem; flex-shrink: 0; }
  .hm-score.hot, .hm-score.great { color: var(--accent); }
  .hm-score.warm, .hm-score.good { color: var(--gold); }
  .hm-score.mild, .hm-score.ok   { color: var(--warn); }
  .hm-more { font-size: 0.6rem; color: var(--muted); padding-top: 0.35rem; }

  /* Tip strip — quiet "buy me a coffee", homer edition. Bottom of home only. */
  .hm-tip { margin-top: 0.9rem; display: flex; align-items: center; gap: 0.7rem; flex-wrap: wrap; background: var(--surface1); border: 1px solid var(--border); border-radius: 10px; padding: 0.6rem 0.85rem; }
  .hm-tip-emoji { font-size: 1.15rem; line-height: 1; flex-shrink: 0; }
  .hm-tip-text { font-size: 0.72rem; color: var(--dim); line-height: 1.35; min-width: 0; flex: 1 1 12rem; }
  .hm-tip-text b { color: var(--text); font-weight: 700; }
  .hm-tip-note { display: block; font-size: 0.56rem; color: var(--muted); margin-top: 0.1rem; }
  .hm-tip-cash { display: inline-flex; align-items: center; gap: 0.35rem; flex-shrink: 0; text-decoration: none; font-family: var(--font-b); font-weight: 700; font-size: 0.78rem; color: var(--accent); background: var(--surface2); border: 1px solid var(--border2); border-radius: 8px; padding: 0.32rem 0.6rem; transition: border-color 0.15s, color 0.15s; cursor: pointer; }
  .hm-tip-cash:hover { border-color: var(--accent); }
  .hm-tip-copy { font-size: 0.58rem; color: var(--muted); }

  .theme-toggle { position: absolute; top: 0; right: 0; z-index: 5; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border-radius: 9px; border: 1px solid var(--border2); background: var(--surface1); color: var(--muted); cursor: pointer; transition: color 0.15s, background 0.15s, border-color 0.15s; }
  .theme-toggle:hover { color: var(--accent); border-color: var(--accent); background: var(--surface2); }
  .theme-toggle svg { width: 18px; height: 18px; display: block; }

  footer { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--border); display: flex; justify-content: space-between; font-size: 0.56rem; color: var(--dim); flex-wrap: wrap; gap: 0.4rem; }
  .panel { display: none; }
  .panel.visible { display: block; }

  /* ── Light-mode overrides ──────────────────────────────────────────────
     A handful of components bake in dark tints / bright-on-dark text that
     wash out on white. Re-tint them (as faint accent washes with darker text)
     only under the light theme; dark mode is untouched. */
  :root[data-theme="light"] .card.top { background: rgba(16,167,88,0.09); border-color: rgba(16,167,88,0.38); }
  :root[data-theme="light"] .card.top .count-num { color: var(--good); }
  :root[data-theme="light"] .status-badge.fetching { background: rgba(176,125,10,0.14); border-color: rgba(176,125,10,0.4); }
  :root[data-theme="light"] .status-badge.ready    { background: rgba(16,167,88,0.12);  border-color: rgba(16,167,88,0.4); }
  :root[data-theme="light"] .status-badge.error    { background: rgba(214,31,60,0.12);  border-color: rgba(214,31,60,0.4); }
  :root[data-theme="light"] .fresh-badge.hot  { background: rgba(16,167,88,0.12);  border-color: rgba(16,167,88,0.4); }
  :root[data-theme="light"] .fresh-badge.warm { background: rgba(176,125,10,0.14); border-color: rgba(176,125,10,0.4); color: var(--gold); }
  :root[data-theme="light"] .sgp-badge { background: rgba(176,125,10,0.14); border-color: rgba(176,125,10,0.4); }
  :root[data-theme="light"] .player-chip.matched { background: rgba(16,167,88,0.1); }
  :root[data-theme="light"] .date-pill.latest { background: rgba(16,167,88,0.12); border-color: rgba(16,167,88,0.4); color: var(--green); }
  /* Temperature contact tags (Due) — darker text so it reads on white. */
  :root[data-theme="light"] .due-contact-tag.great { background: rgba(217,116,26,0.15); color: #bf5710; }
  :root[data-theme="light"] .due-contact-tag.bad   { background: rgba(20,140,210,0.14); color: #1479bc; }
  :root[data-theme="light"] .due-contact-tag.avg   { background: rgba(120,135,150,0.16); color: #566677; }
  /* Cool-blue accents (quiet-day heat, LHP bullpen) darkened for contrast. */
  :root[data-theme="light"] .recap-tile.heat-cool .recap-tile-num,
  :root[data-theme="light"] .recap-tile.heat-cool .recap-tile-heat-tag { color: #1f8fbf; }
  :root[data-theme="light"] .sched-bullpen-hand.l { color: #1580c4; }

  /* ── Dinger Digest — GMG-style shareable slate sheet ──────────────── */
  .sched-toolbar { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px; }
  .sched-toolbar .picks-sort { margin:0; }
  .dinger-digest-btn { background:var(--accent, #35c96e); color:#06210f; font-weight:700;
    border:none; border-radius:7px; padding:5px 11px; font-size:12px; cursor:pointer; white-space:nowrap;
    display:inline-flex; align-items:center; gap:5px; box-shadow:0 1px 4px rgba(0,0,0,.25); }
  .dinger-digest-btn:hover { filter:brightness(1.08); }
  .dd-backdrop { position:fixed; inset:0; background:rgba(0,0,0,.72); z-index:1000;
    display:flex; align-items:flex-start; justify-content:center; padding:24px 16px; overflow:auto; }
  .dd-modal { position:relative; margin:auto; }
  .dd-close { position:absolute; top:-30px; right:-2px; background:none; border:none; color:#fff;
    font-size:26px; line-height:1; cursor:pointer; opacity:.85; }
  .dd-close:hover { opacity:1; }
  /* The sheet is a fixed light card so screenshots look the same in either theme. */
  .dd-sheet { background:#fff; color:#1a1a1a; border-radius:12px; padding:18px 20px 14px;
    box-shadow:0 12px 44px rgba(0,0,0,.5); max-width:880px; }
  .dd-head { text-align:center; margin-bottom:12px; }
  .dd-title { font-size:23px; font-weight:800; letter-spacing:-.02em; }
  .dd-sub { font-size:12px; color:#666; margin-top:2px; }
  .dd-scroll { overflow-x:auto; }
  @media (max-width:600px) {
    .dd-backdrop { padding:14px 6px; }
    .dd-modal { max-width:100%; }
    .dd-sheet { padding:14px 10px 12px; max-width:100%; }
  }
  .dd-table { border-collapse:collapse; width:100%; font-size:12.5px; }
  .dd-table th { background:#2b2b2b; color:#fff; font-weight:700; padding:7px 9px;
    border:1px solid #8f8f8f; text-align:center; font-size:11px; white-space:nowrap; }
  .dd-table td { border:1px solid #d2d2d2; padding:6px 9px; vertical-align:middle; }
  .dd-team { text-align:center; width:32px; }
  .dd-team .dd-logo { margin:0; }
  .dd-pitcher { white-space:nowrap; }
  .dd-logo { width:19px; height:19px; vertical-align:middle; }
  .dd-p-name { font-weight:700; }
  .dd-p-sub { color:#8a8a8a; font-size:10px; margin-left:7px; }
  .dd-mm, .dd-wp, .dd-overall { text-align:center; }
  .dd-dot { display:inline-block; width:16px; height:16px; border-radius:50%; border:1px solid rgba(0,0,0,.28); }
  .dd-green { background:#4caf50; } .dd-yellow { background:#ffd54a; }
  .dd-red { background:#e5534b; } .dd-na { background:#dcdcdc; }
  /* Muted result wash behind the three scored cells (matchup / weather / overall). */
  .dd-cell-green  { background:#d8efd9; }
  .dd-cell-yellow { background:#fdf1c9; }
  .dd-cell-red    { background:#f7dcda; }
  .dd-cell-dome   { background:#dde6ee; font-size:15px; }
  .dd-overall-num { font-weight:800; font-size:14px; }
  .dd-leans { line-height:1.55; }
  .dd-lean { white-space:nowrap; }
  .dd-lean-top { font-weight:900; }
  .dd-lean-sep { border-top:1px solid #cbcbcb; margin:4px 0; }
  .dd-other { color:#555; font-size:11.5px; line-height:1.5; }
  .dd-notes { min-width:70px; }
  .dd-empty { color:#c0c0c0; }
  .dd-g-bot td { border-bottom:2px solid #9a9a9a; }
  .dd-legend { display:flex; flex-wrap:wrap; gap:12px; justify-content:center;
    font-size:11px; color:#555; margin-top:12px; align-items:center; }
  .dd-legend .dd-dot { width:11px; height:11px; vertical-align:-1px; margin-right:3px; }
  .dd-legend-sep { width:1px; height:14px; background:#ddd; }
  .dd-credit { text-align:center; font-size:10px; color:#b0b0b0; margin-top:7px; }
  .dd-hint { text-align:center; color:#fff; font-size:12px; margin-top:12px; opacity:.85; }

  /* Hidden read-only health view (?status) */
  .st-backdrop { position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:1100; display:flex; align-items:flex-start; justify-content:center; padding:24px 12px; overflow:auto; }
  .st-panel { position:relative; background:#0b1120; color:#c8d6e5; border:1px solid #1e3050; border-radius:12px; width:100%; max-width:520px; padding:18px 20px 14px; font-family:var(--font-m,'JetBrains Mono',monospace); font-size:12.5px; box-shadow:0 12px 44px rgba(0,0,0,.55); }
  .st-close { position:absolute; top:8px; right:12px; background:none; border:none; color:#6b8aa8; font-size:22px; line-height:1; cursor:pointer; }
  .st-close:hover { color:#c8d6e5; }
  .st-title { font-size:16px; font-weight:800; margin-bottom:6px; letter-spacing:.02em; }
  .st-sec { text-transform:uppercase; letter-spacing:.1em; font-size:9.5px; color:#5a7089; margin:13px 0 4px; border-bottom:1px solid #16243a; padding-bottom:3px; }
  .st-row { display:flex; align-items:center; gap:8px; padding:2.5px 0; flex-wrap:wrap; }
  .st-dot { width:8px; height:8px; border-radius:50%; flex:none; }
  .st-ok { background:#35c96e; } .st-warn { background:#e0a83c; } .st-bad { background:#e5534b; } .st-muted { background:#44546a; }
  .st-label { color:#8aaac0; }
  .st-val { color:#e8f0fa; font-weight:700; margin-left:auto; }
  .st-note { flex-basis:100%; color:#5a7089; font-size:10.5px; padding-left:16px; line-height:1.4; }
  .st-actions { display:flex; gap:8px; margin-top:14px; }
  .st-btn { background:#16243a; border:1px solid #1e3050; color:#8fd0a0; font-family:inherit; font-size:11.5px; padding:6px 12px; border-radius:7px; cursor:pointer; text-decoration:none; display:inline-block; }
  .st-btn:hover { background:#1e3050; color:#c8f0d5; }
  .st-foot { color:#4a5f78; font-size:10px; margin-top:10px; text-align:center; }
  .st-foot code { background:#16243a; padding:1px 5px; border-radius:4px; color:#8aaac0; }
  /* Tud Tool — recap / stats / schedule */
  .rc-head { font-family: var(--font-d); font-size: 1.35rem; font-weight: 800; color: var(--text-strong); margin: 0.1rem 0 0.7rem; }
  .rc-weeks { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-bottom: 0.5rem; }
  .rc-wk { min-width: 2rem; padding: 0.3rem 0.5rem; font-family: var(--font-d); font-weight: 700; font-size: 0.85rem; background: var(--surface1); border: 1px solid var(--border); border-radius: 7px; color: var(--muted); cursor: pointer; transition: background 0.12s, color 0.12s, border-color 0.12s; }
  .rc-wk:hover { border-color: var(--muted); color: var(--text); }
  .rc-wk.active { background: var(--accent); border-color: var(--accent); color: #06210f; }
  .rc-meta { font-size: 0.74rem; color: var(--muted); margin-bottom: 0.6rem; }
  .rc-meta b { color: var(--text); font-family: var(--font-d); }
  .rc-list { display: flex; flex-direction: column; gap: 0.4rem; }
  .rc-card { display: flex; align-items: center; gap: 0.7rem; background: var(--surface1); border: 1px solid var(--border); border-radius: 10px; padding: 0.5rem 0.7rem; }
  .rc-photo { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; object-position: center 18%; background: var(--surface2); flex-shrink: 0; }
  .rc-noface { display: flex; align-items: center; justify-content: center; font-family: var(--font-d); font-weight: 800; color: var(--muted); }
  .rc-info { flex: 1; min-width: 0; }
  .rc-name { font-family: var(--font-d); font-size: 1rem; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rc-sub { font-size: 0.62rem; color: var(--muted); margin-top: 0.1rem; }
  .rc-detail { display: flex; align-items: center; gap: 0.4rem; flex-shrink: 0; }
  .rc-badge { font-size: 0.5rem; font-weight: 800; letter-spacing: 0.05em; padding: 0.12rem 0.35rem; border-radius: 4px; }
  .rc-rush { color: #7fd861; background: rgba(76,212,106,0.16); }
  .rc-rec  { color: #6fb2ff; background: rgba(90,150,240,0.16); }
  .rc-ret  { color: var(--gold); background: rgba(242,201,76,0.16); }
  .rc-other { color: var(--muted); background: var(--surface2); }
  .rc-yd { font-family: var(--font-d); font-weight: 700; font-size: 0.85rem; color: var(--text); }
  .rc-from { font-size: 0.6rem; color: var(--muted); white-space: nowrap; }
  .rc-first { font-size: 0.5rem; font-weight: 800; letter-spacing: 0.04em; color: var(--gold); background: rgba(242,201,76,0.16); padding: 0.1rem 0.28rem; border-radius: 4px; margin-left: 0.4rem; vertical-align: middle; }
  /* filter / sort bar */
  .fl-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem 0.6rem; margin: 0.2rem 0 0.7rem; }
  .fl-pills { display: inline-flex; gap: 0.25rem; background: var(--surface1); border: 1px solid var(--border); border-radius: 8px; padding: 0.15rem; }
  .fl-pill { font-family: var(--font-d); font-weight: 700; font-size: 0.75rem; padding: 0.28rem 0.55rem; border: none; background: none; color: var(--muted); border-radius: 6px; cursor: pointer; transition: background 0.12s, color 0.12s; }

  let activeNav = 'home', applyingRoute = false;
  function switchNav(nav) {
    activeNav = nav;
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('visible'));
    document.getElementById('panel-' + nav)?.classList.add('visible');
    document.querySelectorAll('.nav-btn[data-nav]').forEach(b => b.classList.toggle('active', b.dataset.nav === nav));
    document.title = PAGE_TITLES[nav] || "Ron's Tud Tool";
    renderPanel(nav);
    closeNavTools();
    if (!applyingRoute) commitRoute();
  }

  // ── Data + renders ─────────────────────────────────────────────────────
  let nflData = null, recapWeek = null, scheduleWeek = null;
  async function loadNfl() {
    try { const r = await fetch(APP_BASE + '/data.json', { cache: 'no-store' }); nflData = await r.json(); }
    catch (e) { nflData = 'error'; }
    renderPanel(activeNav);
  }
  const WK_LABEL = (w) => w <= 18 ? 'Week ' + w : ({ 19: 'Wild Card', 20: 'Divisional', 21: 'Conf Championship', 22: 'Super Bowl' }[w] || 'Week ' + w);
  const WK_SHORT = (w) => w <= 18 ? String(w) : ({ 19: 'WC', 20: 'DIV', 21: 'CC', 22: 'SB' }[w] || String(w));
  function renderPanel(nav) { if (nav === 'home') renderHome(); else if (nav === 'recap') renderRecap(); else if (nav === 'stats') renderStats(); else if (nav === 'schedule') renderSchedule(); }
  // ESPN team-logo CDN (transparent PNGs). nflverse abbrs are ESPN slugs
  // lowercased, save two: LA(Rams)->lar, WAS->wsh.
  const LOGO_SLUG = { LA: 'lar', WAS: 'wsh' };
  const teamLogo = (abbr) => `https://a.espncdn.com/i/teamlogos/nfl/500/${(LOGO_SLUG[abbr] || (abbr || '').toLowerCase())}.png`;
  const logoImg = (abbr) => abbr ? `<img class="tm-logo" src="${teamLogo(abbr)}" alt="${abbr}" loading="lazy">` : '';
  // nflverse spread_line: positive => HOME favored. Show it as a betting line
  // (favorite carries the minus). e.g. spread 3.5 => "SEA -3.5".
  const spreadLabel = (g) => g.spread === 0 ? 'PK' : `${g.home} ${g.spread > 0 ? '-' : '+'}${Math.abs(g.spread)}`;
  function gameRow(g) {
    const played = g.homeScore != null && g.awayScore != null;
    const time = g.gametime ? g.gametime.slice(0, 5) : '';
    const when = `${g.weekday || ''}${g.gameday ? ' ' + g.gameday.slice(5) : ''}${time ? ' · ' + time : ''}`.trim();
    const meta = played
      ? `<div class="sc-score">${g.awayScore}–${g.homeScore}</div><div class="sc-when">Final</div>`
      : `<div class="sc-line">${g.total != null ? 'O/U ' + g.total : ''}${g.total != null && g.spread != null ? ' · ' : ''}${g.spread != null ? spreadLabel(g) : ''}</div><div class="sc-when">${when}</div>`;
    return `<div class="sc-game">
      <div class="sc-teams">
        <div class="sc-team">${logoImg(g.away)}<span class="sc-abbr">${g.away}</span></div>
        <span class="sc-at">@</span>
        <div class="sc-team">${logoImg(g.home)}<span class="sc-abbr">${g.home}</span></div>
      </div>
      <div class="sc-meta">${meta}</div></div>`;
  }
  function dataGate(id) {
    const el = document.getElementById(id); if (!el) return null;
    if (!nflData) { el.innerHTML = '<div class="empty">Loading…</div>'; return null; }
    if (nflData === 'error') { el.innerHTML = '<div class="empty">Couldn\'t load NFL data. <a href="javascript:void(0)" onclick="loadNfl()">Retry</a></div>'; return null; }
    return el;
  }
  const TD_LABEL = { rush: 'RUSH', rec: 'REC', ret: 'RET', other: 'TD' };
  function faceHtml(pid, name) {
    const s = nflData.headshots[pid];
    return s ? `<img class="rc-photo" src="${s}" alt="" loading="lazy">` : `<div class="rc-photo rc-noface">${(name || '?').replace(/^[A-Z]\.\s*/, '')[0] || '?'}</div>`;
  }
  function tdCard(t) {
    return `<div class="rc-card">${faceHtml(t.pid, t.player)}
      <div class="rc-info"><div class="rc-name">${t.player}${t.firstTd ? '<span class="rc-first" title="First TD of the game">1st</span>' : ''}</div><div class="rc-sub">${t.team} vs ${t.opp} · Q${t.qtr || '?'}${t.weekday ? ' · ' + t.weekday.slice(0, 3) : ''}</div></div>
      <div class="rc-detail"><span class="rc-badge rc-${t.type}">${TD_LABEL[t.type] || 'TD'}</span><span class="rc-yd">${t.yards != null ? t.yards + ' yd' : ''}</span>${t.passer ? `<span class="rc-from">from ${t.passer}</span>` : ''}</div></div>`;
  }
  // Recap filter/sort state.
  const rcFilt = { type: 'all', day: 'all', firstOnly: false, sort: 'order' };
  function setRecapWeek(w) { recapWeek = w; renderRecap(); }
  function setRcFilt(k, v) { rcFilt[k] = v; renderRecap(); }
  function toggleRcFirst() { rcFilt.firstOnly = !rcFilt.firstOnly; renderRecap(); }
  const DAY_ORDER = { Thursday: 1, Friday: 2, Saturday: 3, Sunday: 4, Monday: 5 };
  function renderRecap() {
    const el = dataGate('recap-content'); if (!el) return;
    const weeks = nflData.tdRecapWeeks || [];
    if (recapWeek == null || !weeks.includes(recapWeek)) recapWeek = weeks[0];
    const wsel = weeks.map(w => `<button class="rc-wk${w === recapWeek ? ' active' : ''}" onclick="setRecapWeek(${w})" title="${WK_LABEL(w)}">${WK_SHORT(w)}</button>`).join('');
    const all = nflData.tdRecap[recapWeek] || [];
    // Day options present this week, in canonical order.
    const days = [...new Set(all.map(t => t.weekday).filter(Boolean))].sort((a, b) => (DAY_ORDER[a] || 9) - (DAY_ORDER[b] || 9));
    if (rcFilt.day !== 'all' && !days.includes(rcFilt.day)) rcFilt.day = 'all';
    let tds = all.filter(t =>
      (rcFilt.type === 'all' || t.type === rcFilt.type) &&
      (rcFilt.day === 'all' || t.weekday === rcFilt.day) &&
      (!rcFilt.firstOnly || t.firstTd));
    if (rcFilt.sort === 'long') tds = tds.slice().sort((a, b) => (b.yards ?? -1) - (a.yards ?? -1));
    else if (rcFilt.sort === 'short') tds = tds.slice().sort((a, b) => (a.yards ?? 1e9) - (b.yards ?? 1e9));
    const typePill = (v, lbl) => `<button class="fl-pill${rcFilt.type === v ? ' active' : ''}" onclick="setRcFilt('type','${v}')">${lbl}</button>`;
    const dayOpts = ['all', ...days].map(d => `<option value="${d}"${rcFilt.day === d ? ' selected' : ''}>${d === 'all' ? 'Any day' : d}</option>`).join('');
    el.innerHTML = `<div class="rc-head">${nflData.historySeason} Touchdown Recap</div>
      <div class="rc-weeks">${wsel}</div>
      <div class="fl-bar">
        <div class="fl-pills">${typePill('all', 'All')}${typePill('rush', 'Rush')}${typePill('rec', 'Rec')}${typePill('ret', 'Ret')}</div>
        <select class="fl-sel" onchange="setRcFilt('sort',this.value)">
          <option value="order"${rcFilt.sort === 'order' ? ' selected' : ''}>Game order</option>
          <option value="long"${rcFilt.sort === 'long' ? ' selected' : ''}>Longest</option>
          <option value="short"${rcFilt.sort === 'short' ? ' selected' : ''}>Shortest</option>
        </select>
        ${days.length > 1 ? `<select class="fl-sel" onchange="setRcFilt('day',this.value)">${dayOpts}</select>` : ''}
        <button class="fl-toggle${rcFilt.firstOnly ? ' active' : ''}" onclick="toggleRcFirst()">1st TD</button>
      </div>
      <div class="rc-meta"><b>${WK_LABEL(recapWeek)}</b> · ${tds.length} of ${all.length} touchdowns</div>
      <div class="rc-list">${tds.length ? tds.map(tdCard).join('') : '<div class="empty">No touchdowns match these filters.</div>'}</div>`;
  }
  const stFilt = { pos: 'all', team: 'all', sort: 'tds' };
  function setStFilt(k, v) { stFilt[k] = v; renderStats(); }
  const ST_SORT = { tds: l => l.tds, rushTd: l => l.rushTd, recTd: l => l.recTd, opp: l => l.opp };
  const ST_SORT_LBL = { tds: 'TD', rushTd: 'Rush TD', recTd: 'Rec TD', opp: 'Opp' };
  function renderStats() {
    const el = dataGate('stats-content'); if (!el) return;
    const L = nflData.tdLeaders || [];
    const teams = [...new Set(L.map(l => l.team).filter(Boolean))].sort();
    if (stFilt.team !== 'all' && !teams.includes(stFilt.team)) stFilt.team = 'all';
    const rows = L.filter(l =>
      (stFilt.pos === 'all' || l.pos === stFilt.pos) &&
      (stFilt.team === 'all' || l.team === stFilt.team))
      .slice().sort((a, b) => ST_SORT[stFilt.sort](b) - ST_SORT[stFilt.sort](a));
    const val = ST_SORT[stFilt.sort];
    const posPill = (v, lbl) => `<button class="fl-pill${stFilt.pos === v ? ' active' : ''}" onclick="setStFilt('pos','${v}')">${lbl}</button>`;
    const teamOpts = ['all', ...teams].map(t => `<option value="${t}"${stFilt.team === t ? ' selected' : ''}>${t === 'all' ? 'All teams' : t}</option>`).join('');
    el.innerHTML = `<div class="rc-head">${nflData.historySeason} Touchdown Leaders</div>
      <div class="fl-bar">
        <div class="fl-pills">${posPill('all', 'All')}${posPill('RB', 'RB')}${posPill('WR', 'WR')}${posPill('TE', 'TE')}${posPill('QB', 'QB')}</div>
        <select class="fl-sel" onchange="setStFilt('sort',this.value)">
          <option value="tds"${stFilt.sort === 'tds' ? ' selected' : ''}>Total TDs</option>
          <option value="rushTd"${stFilt.sort === 'rushTd' ? ' selected' : ''}>Rushing TDs</option>
          <option value="recTd"${stFilt.sort === 'recTd' ? ' selected' : ''}>Receiving TDs</option>
          <option value="opp"${stFilt.sort === 'opp' ? ' selected' : ''}>Opportunities</option>
        </select>
        <select class="fl-sel" onchange="setStFilt('team',this.value)">${teamOpts}</select>
      </div>
      <div class="rc-meta">${rows.length} players · sorted by <b>${ST_SORT_LBL[stFilt.sort]}</b></div>
      <div class="rc-list">${rows.length ? rows.map((l, i) => `<div class="rc-card"><span class="st-rank">${i + 1}</span>${faceHtml(l.pid, l.name)}
        <div class="rc-info"><div class="rc-name">${l.name}</div><div class="rc-sub">${l.pos} · ${l.team} · ${l.games} G</div></div>
        <div class="rc-detail"><span class="st-td">${val(l)}</span><span class="rc-yd">${ST_SORT_LBL[stFilt.sort]}</span><span class="rc-from">${l.rushTd}ru · ${l.recTd}rec</span></div></div>`).join('') : '<div class="empty">No players match these filters.</div>'}</div>`;
  }
  // Weeks that have at least one REG game; and the earliest week still to play.
  function scheduleWeeks() {
    const byWeek = {}; for (const g of (nflData.schedule || [])) if (g.type === 'REG') (byWeek[g.week] ??= []).push(g);
    return { byWeek, wks: Object.keys(byWeek).map(Number).sort((a, b) => a - b) };
  }
  function firstUpcomingWeek() {
    const { byWeek, wks } = scheduleWeeks();
    for (const w of wks) if (byWeek[w].some(g => g.homeScore == null)) return w;
    return wks[wks.length - 1] ?? 1;
  }
  function setScheduleWeek(w) { scheduleWeek = w; renderSchedule(); }
  function renderSchedule() {
    const el = dataGate('schedule-content'); if (!el) return;
    const { byWeek, wks } = scheduleWeeks();
    if (scheduleWeek == null || !wks.includes(scheduleWeek)) scheduleWeek = firstUpcomingWeek();
    const sel = wks.map(w => `<button class="rc-wk${w === scheduleWeek ? ' active' : ''}" onclick="setScheduleWeek(${w})">${w}</button>`).join('');
    const games = (byWeek[scheduleWeek] || []).slice().sort((a, b) => (a.gameday || '').localeCompare(b.gameday || '') || (a.gametime || '').localeCompare(b.gametime || ''));
    el.innerHTML = `<div class="rc-head">${nflData.upcomingSeason} Schedule</div>
      <div class="rc-weeks">${sel}</div>
      <div class="rc-meta"><b>Week ${scheduleWeek}</b> · ${games.length} games</div>
      <div class="sc-list">${games.map(gameRow).join('')}</div>`;
  }
  function renderHome() {
    const el = dataGate('home-content'); if (!el) return;
    const w = firstUpcomingWeek();
    const { byWeek } = scheduleWeeks();
    const upcoming = (byWeek[w] || []).slice().sort((a, b) => (a.gameday || '').localeCompare(b.gameday || '') || (a.gametime || '').localeCompare(b.gametime || '')).slice(0, 4);
    const leaders = (nflData.tdLeaders || []).slice(0, 5);
    const totalTds = (nflData.tdRecapWeeks || []).reduce((s, wk) => s + (nflData.tdRecap[wk] || []).length, 0);
    el.innerHTML = `
      <div class="hm-stats">
        <div class="hm-stat"><div class="hm-big">${totalTds}</div><div class="hm-lbl">${nflData.historySeason} TDs</div></div>
        <div class="hm-stat"><div class="hm-big">${(nflData.tdRecapWeeks || []).length}</div><div class="hm-lbl">weeks recapped</div></div>
        <div class="hm-stat"><div class="hm-big">${(byWeek[w] || []).length}</div><div class="hm-lbl">Week ${w} games</div></div>
      </div>
      <div class="hm-sec">
        <div class="hm-sec-head"><span>Week ${w} kickoff</span><a href="javascript:void(0)" onclick="switchNav('schedule')">Full schedule →</a></div>
        <div class="sc-list">${upcoming.map(gameRow).join('')}</div>
      </div>
      <div class="hm-sec">
        <div class="hm-sec-head"><span>${nflData.historySeason} TD leaders</span><a href="javascript:void(0)" onclick="switchNav('stats')">All leaders →</a></div>
        <div class="rc-list">${leaders.map((l, i) => `<div class="rc-card"><span class="st-rank">${i + 1}</span>${faceHtml(l.pid, l.name)}
          <div class="rc-info"><div class="rc-name">${l.name}</div><div class="rc-sub">${l.pos} · ${l.team}</div></div>
          <div class="rc-detail"><span class="st-td">${l.tds}</span><span class="rc-yd">TD</span></div></div>`).join('')}</div>
      </div>`;
  }
  function currentPath() { return activeNav === 'home' ? APP_BASE + '/' : APP_BASE + '/' + activeNav; }
  function commitRoute() { const p = currentPath(); if (location.pathname !== p) history.pushState(null, '', p); }
  function parsePath() { const rel = location.pathname.startsWith(APP_BASE) ? location.pathname.slice(APP_BASE.length) : location.pathname; return rel.replace(/^\/+|\/+$/g, '').split('/')[0] || 'home'; }
  function applyRouteState() { applyingRoute = true; const nav = parsePath(); switchNav(NFL_NAVS.includes(nav) ? nav : 'home'); history.replaceState(null, '', currentPath()); applyingRoute = false; }
  window.addEventListener('popstate', applyRouteState);
  document.addEventListener('click', (e) => { if (navToolsOpen && !e.target.closest('#nav-tools-menu') && !e.target.closest('#nav-tools-btn')) closeNavTools(); });

  document.addEventListener('DOMContentLoaded', () => { updateThemeToggleIcon(); applyRouteState(); loadNfl(); });
</script>
</body>
</html>
