<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ron's Tools</title>
<meta name="description" content="Ron's sports tools — MLB home run picks (Dong Tool), football touchdowns (Tud Tool), and more.">
<meta property="og:title" content="Ron's Tools">
<meta property="og:description" content="Pick your sport — MLB home run picks, football touchdowns, and more.">
<meta property="og:url" content="https://dong-tool.netlify.app/">
<meta property="og:image" content="https://dong-tool.netlify.app/icons/icon-512.png">
<meta name="twitter:card" content="summary">
<link rel="icon" type="image/svg+xml" href="/icons/logo.svg?v=2">
<link rel="icon" type="image/x-icon" href="/icons/favicon.ico?v=2">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2">
<script>
  // Legacy links: the MLB app used to live at the root (/picks, /due/results…).
  // If we landed on one of its routes, forward to the new /mlb home so old
  // bookmarks and shared links keep working.
  (function () {
    var MLB = ['picks','due','pairs','stats','recap','schedule','matchups','prospects','daylate','returning','birthdays','milestones','steals','pitchtypes','pitchervuln','pitcherks','pitcherwalks'];
    var seg = location.pathname.split('/').filter(Boolean)[0];
    if (seg && MLB.indexOf(seg) !== -1) location.replace('/mlb' + location.pathname + location.search + location.hash);
  })();
</script>
<style>
  :root { --bg:#05080f; --card:#0e1524; --card2:#131c30; --border:#233149; --text:#e8edf5; --muted:#8a94a6; --dim:#5b6577; --green:#33d07c; --gold:#f0c040; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body { background:
      radial-gradient(1200px 600px at 50% -10%, rgba(51,208,124,0.10), transparent 60%),
      radial-gradient(900px 500px at 50% 110%, rgba(240,192,64,0.07), transparent 60%),
      var(--bg);
    color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 2rem 1.2rem calc(2rem + env(safe-area-inset-bottom)); min-height: 100dvh; text-align: center; }
  .wrap { width: 100%; max-width: 760px; }
  .brand { font-weight: 800; font-size: clamp(2.1rem, 7vw, 3.4rem); letter-spacing: -0.02em; line-height: 1.02; }
  .brand .apos { color: var(--muted); }
  .tag { color: var(--muted); font-size: clamp(0.8rem, 2.6vw, 0.98rem); margin-top: 0.6rem; letter-spacing: 0.01em; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.9rem; margin-top: 2.2rem; }
  @media (max-width: 460px) { .grid { grid-template-columns: 1fr; } }
  .tile { position: relative; display: flex; flex-direction: column; align-items: flex-start; text-align: left; gap: 0.15rem;
    background: linear-gradient(180deg, var(--card2), var(--card)); border: 1px solid var(--border); border-radius: 18px;
    padding: 1.15rem 1.2rem 1.2rem; text-decoration: none; color: inherit; transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s; }
  .tile.live:hover { transform: translateY(-3px); border-color: var(--green); box-shadow: 0 14px 34px rgba(0,0,0,0.45), 0 0 0 1px rgba(51,208,124,0.25); }
  .tile.soon { opacity: 0.5; cursor: default; }
  .tile-ico { font-size: 2rem; line-height: 1; margin-bottom: 0.5rem; }
  .tile-name { font-weight: 800; font-size: 1.18rem; }
  .tile-sub { color: var(--muted); font-size: 0.78rem; margin-top: 0.15rem; }
  .badge { position: absolute; top: 0.9rem; right: 0.9rem; font-size: 0.55rem; font-weight: 800; letter-spacing: 0.09em; text-transform: uppercase;
    padding: 0.22rem 0.5rem; border-radius: 999px; }
  .badge.go { color: #06210f; background: var(--green); }
  .badge.soon { color: var(--dim); background: rgba(138,148,166,0.12); border: 1px solid var(--border); }
  .foot { margin-top: 2rem; color: var(--dim); font-size: 0.68rem; letter-spacing: 0.02em; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">Ron<span class="apos">'s</span> Tools</div>
    <div class="tag">Pick your sport.</div>
    <div class="grid">
      <a class="tile live" href="/mlb/">
        <span class="badge go">Live</span>
        <span class="tile-ico">⚾</span>
        <span class="tile-name">Ron's Dong Tool</span>
        <span class="tile-sub">MLB · home run picks, value bats, matchups</span>
      </a>
      <div class="tile soon">
        <span class="badge soon">Soon</span>
        <span class="tile-ico">🏈</span>
        <span class="tile-name">Ron's Tud Tool</span>
        <span class="tile-sub">Football · touchdown picks</span>
      </div>
      <div class="tile soon">
        <span class="badge soon">Soon</span>
        <span class="tile-ico">🏀</span>
        <span class="tile-name">Ron's Hoop Tool</span>
        <span class="tile-sub">NBA · coming soon</span>
      </div>
      <div class="tile soon">
        <span class="badge soon">Soon</span>
        <span class="tile-ico">🏒</span>
        <span class="tile-name">Ron's Goal Tool</span>
        <span class="tile-sub">NHL · coming soon</span>
      </div>
    </div>
    <div class="foot">Inspired by Green Means Go.</div>
  </div>
</body>
</html>
