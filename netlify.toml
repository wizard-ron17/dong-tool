# Ron's multi-sport hierarchy:
#   /            -> the sport picker (root index.html)
#   /mlb/*       -> Ron's Dong Tool (mlb/index.html, a client-routed SPA)
#   /nfl/*       -> Ron's Tud Tool (nfl/index.html)
#   /nhl/*       -> Ron's Goal Tool (nhl/index.html)
#
# Netlify serves real static files (mlb/data.json, mlb/sw.js, icons/*, …) before
# applying these rewrites, so they only catch virtual client-side routes.
#
# mlb/data.json is refreshed every 30 min by GitHub Actions. Tell the CDN not to
# cache it at the edge, or it serves a stale copy for hours regardless of the
# browser-side no-store fetch (which only controls the local cache).
[build]
  # Skip the deploy when a commit only touches data files (or build-side code):
  # the GitHub Actions builds commit data every hour or so, and the pages read
  # data straight from the repo (raw.githubusercontent.com — see dataFetch), so
  # those commits needn't redeploy anything. Exit 0 = nothing that matters
  # changed = skip. A code change anywhere else deploys as always.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)mlb/*.json' ':(exclude)nfl/*.json' ':(exclude)nhl/*.json' ':(exclude)scripts' ':(exclude)research' ':(exclude).github'"

[[headers]]
  for = "/mlb/data.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/nhl/phys-history.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/nhl/shots-history.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/nhl/saves-history.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/nhl/points-history.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/nhl/players.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/nhl/data.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# MLB SPA fallback: any /mlb/<route> that isn't a real file resolves to the app.
[[redirects]]
  from = "/mlb/*"
  to = "/mlb/index.html"
  status = 200

# NFL (Ron's Tud Tool) SPA fallback.
[[redirects]]
  from = "/nfl/*"
  to = "/nfl/index.html"
  status = 200

# NHL (Ron's Goal Tool) SPA fallback.
[[redirects]]
  from = "/nhl/*"
  to = "/nhl/index.html"
  status = 200

# No catch-all: any other path that isn't a real file gets Netlify's automatic
# 404.html with a real 404 status. That page also forwards legacy top-level MLB
# links (/picks -> /mlb/picks) before showing "not found".
